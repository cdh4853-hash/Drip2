                  <span style={{marginLeft:6,fontSize:12,color:orderTab===t?color:"#707870"}}>{cnt}건</span>
                </button>
              ))}
            </div>

            {/* 완료 탭 — 라인 필터 (전체/A라인/B라인) */}
            {orderTab==="완료"&&(()=>{
              const doneAll=viewOrders.filter(o=>o.status==="완료");
              const doneA=doneAll.filter(o=>(o.line||"A")==="A");
              const doneB=doneAll.filter(o=>o.line==="B");
              return(
                <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:14,flexWrap:"wrap"}}>
                  <span style={{color:"#a8b8a0",fontSize:13,fontWeight:700}}>라인 필터:</span>
                  {[
                    ["전체",doneAll.length,"#6fcf97"],
                    ["A",doneA.length,"#8ecf90"],
                    ["B",doneB.length,"#8ac8f0"],
                  ].map(([l,cnt,color])=>(
                    <button key={l} onClick={()=>setDoneLineFilter(l)}
                      style={{background:doneLineFilter===l?color+"33":"rgba(255,255,255,.06)",border:"1px solid "+(doneLineFilter===l?color+"88":"#7a8a7044"),borderRadius:20,color:doneLineFilter===l?color:"#c8c8b8",padding:"5px 16px",fontSize:13,fontWeight:doneLineFilter===l?700:400,cursor:"pointer",fontFamily:"inherit"}}>
                      {l==="전체"?"⚪ 전체":l==="A"?"🟢 A라인":"🔵 B라인"} <span style={{marginLeft:4,opacity:.8}}>{cnt}건</span>
                    </button>
                  ))}
                </div>
              );
            })()}

            {/* 생산계획 — 다중 선택 */}
            {orderTab==="생산계획"&&viewOrders.filter(o=>o.status==="대기"||o.status==="투입완료").length>0&&(
              <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:12,padding:"8px 14px",background:"rgba(255,255,255,.05)",border:"1px solid #7a8a7044",borderRadius:8,flexWrap:"wrap"}}>
                <span style={{color:"#a8b8a0",fontSize:13,fontWeight:700}}>다중 선택:</span>
                <button onClick={()=>checkAll(viewOrders.filter(o=>o.status==="대기"||o.status==="투입완료").map(o=>o.id))} style={{background:"rgba(255,255,255,.1)",border:"1px solid #7a8a7055",borderRadius:6,color:"#d8ecca",padding:"4px 12px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>☑ 전체</button>
                <button onClick={()=>checkAll(viewOrders.filter(o=>o.status==="투입완료").map(o=>o.id))} style={{background:"rgba(255,255,255,.1)",border:"1px solid #7a8a7055",borderRadius:6,color:"#8ac8f0",padding:"4px 12px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>☑ 투입완료만</button>
                <button onClick={uncheckAll} style={{background:"rgba(255,255,255,.1)",border:"1px solid #7a8a7055",borderRadius:6,color:"#d8ecca",padding:"4px 12px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>☐ 해제</button>
                {/* ★ 전체 낱개투입 */}
                <button onClick={investAll}
                  style={{background:"linear-gradient(135deg,#2a5a3a,#3a7a4a)",border:"1px solid #4a9a5a66",borderRadius:6,color:"#6fcf97",padding:"4px 16px",fontSize:12,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>
                  ⚡ 전체 낱개투입
                </button>
                {/* ★ 선택 낱개투입 */}
                <button onClick={async()=>{
                  if(!checkedOrders.size)return alert("투입할 항목을 선택하세요.");
                  const ids=[...checkedOrders].filter(id=>orders.find(o=>o.id===id)?.status==="대기");
                  if(!ids.length)return alert("대기 상태 항목만 낱개투입할 수 있습니다.");
                  pollPaused.current=true;
                  try{
                    let cur=[...stock];
                    for(const id of ids){cur=await investCore(id,cur);if(!cur)break;}
                  }finally{resumePoll();}
                  setCheckedOrders(new Set());
                }} style={{background:"linear-gradient(135deg,#1a4a2a,#2a6a3a)",border:"1px solid #3a7a4a55",borderRadius:6,color:"#8ecf90",padding:"4px 16px",fontSize:12,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>
                  ⚡ 선택 낱개투입 {checkedOrders.size>0?"("+checkedOrders.size+"건)":""}
                </button>
                <button onClick={async()=>{
                  if(!checkedOrders.size)return alert("항목을 선택하세요.");
                  const ids=[...checkedOrders].filter(id=>{const o=orders.find(o=>o.id===id);return o?.status==="투입완료"||o?.status==="대기";});
                  if(!ids.length)return alert("확정할 수 있는 항목이 없습니다.");
                  pollPaused.current=true;
                  try{
                    setOrders(prev=>prev.map(o=>ids.includes(o.id)?{...o,status:"확정"}:o));
                    setCheckedOrders(new Set());
                    await Promise.all(ids.map(id=>sb.from("drip2_orders").update({status:"확정"}).eq("id",id)));
                  }finally{resumePoll();}
                }} style={{background:"linear-gradient(135deg,#7a6020,#b08a30)",border:"1px solid #c8a06a66",borderRadius:6,color:"#f5e8a0",padding:"4px 16px",fontSize:12,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>📋 선택 생산확정 {checkedOrders.size>0?"("+checkedOrders.size+"건)":""}</button>
                <button onClick={()=>{
                  if(!checkedOrders.size)return alert("삭제할 항목을 선택하세요.");
                  askPw("선택 주문 삭제","선택된 "+checkedOrders.size+"건을 삭제합니다. 투입완료 항목은 재고가 복구됩니다.",async()=>{
                    pollPaused.current=true;
                    try{
                    const ids=[...checkedOrders];
                    // ★ UI 즉시 반영
                    setOrders(prev=>prev.filter(o=>!ids.includes(o.id)));
                    setCheckedOrders(new Set());
                    // ★ 재고 복구 누적 계산 후 병렬 처리
                    const stockDelta={};
                    const logIds=[];
                    const orderIds=[];
                    for(const id of ids){
                      const order=orders.find(o=>o.id===id);if(!order)continue;
                      if(order.status==="투입완료"&&order.detail?.details){
                        for(const d of order.detail.details)for(const u of (d.used||[])){
                          stockDelta[u.id]=(stockDelta[u.id]||0)+u.qty;
                        }
                        if(order.detail?.logId)logIds.push(order.detail.logId);
                        orderIds.push(id); // order_id 기준 삭제용
                      }
                    }
                    const updatedStock=[...stock];
                    const stockUpdates=Object.entries(stockDelta).map(([sid,delta])=>{
                      const idx=updatedStock.findIndex(s=>String(s.id)===sid);
                      if(idx!==-1){const restored=updatedStock[idx].qty+delta;updatedStock[idx]={...updatedStock[idx],qty:restored};return sb.from("drip2_stock").update({qty:restored}).eq("id",sid);}
                    }).filter(Boolean);
                    setStock(updatedStock);
                    // ★ logId + order_id 둘 다로 로그 삭제
                    setProdLog(prev=>prev.filter(l=>!logIds.includes(l.id)&&!orderIds.includes(l.order_id)));
                    await Promise.all([
                      ...stockUpdates,
                      ...logIds.map(lid=>sb.from("drip2_prod_log").delete().eq("id",lid)),
                      ...orderIds.filter(oid=>!logIds.length).map(oid=>sb.from("drip2_prod_log").delete().eq("order_id",oid)),
                      ...ids.map(id=>sb.from("drip2_orders").delete().eq("id",id)),
                    ]);
                    }finally{resumePoll();}
                  });
                }} style={{background:"rgba(160,60,60,.3)",border:"1px solid #c0606055",borderRadius:6,color:"#f08080",padding:"4px 14px",fontSize:12,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>🗑 선택 삭제 {checkedOrders.size>0?"("+checkedOrders.size+"건)":""}</button>
              </div>
            )}

            {/* 생산확정 — 다중 선택 */}
            {orderTab==="생산확정"&&viewOrders.filter(o=>o.status==="확정").length>0&&(
              <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:12,padding:"8px 14px",background:"rgba(255,255,255,.05)",border:"1px solid #7a8a7044",borderRadius:8,flexWrap:"wrap"}}>
                <span style={{color:"#a8b8a0",fontSize:13,fontWeight:700}}>다중 선택:</span>
                <button onClick={()=>checkAll(viewOrders.filter(o=>o.status==="확정").map(o=>o.id))} style={{background:"rgba(255,255,255,.1)",border:"1px solid #7a8a7055",borderRadius:6,color:"#d8ecca",padding:"4px 12px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>☑ 전체</button>
                <button onClick={uncheckAll} style={{background:"rgba(255,255,255,.1)",border:"1px solid #7a8a7055",borderRadius:6,color:"#d8ecca",padding:"4px 12px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>☐ 해제</button>
                <button onClick={async()=>{
                  if(!checkedOrders.size)return alert("항목을 선택하세요.");
                  const ids=[...checkedOrders];
                  pollPaused.current=true;
                  try{
                    setOrders(prev=>prev.map(o=>ids.includes(o.id)?{...o,status:"완료"}:o));
                    setCheckedOrders(new Set());
                    await Promise.all(ids.map(id=>sb.from("drip2_orders").update({status:"완료"}).eq("id",id)));
                  }finally{resumePoll();}
                }} style={{background:"linear-gradient(135deg,#2d6a2d,#3a8a3a)",border:"1px solid #4caf5066",borderRadius:6,color:"#6fcf97",padding:"4px 16px",fontSize:12,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>✅ 선택 완료 {checkedOrders.size>0?"("+checkedOrders.size+"건)":""}</button>
                <button onClick={()=>{
                  if(!checkedOrders.size)return alert("복귀할 항목을 선택하세요.");
                  askPw("선택 생산계획 복귀","선택된 "+checkedOrders.size+"건의 재고가 복구되고 생산계획으로 돌아갑니다.",async()=>{
                    pollPaused.current=true;
                    try{
                    const ids=[...checkedOrders].map(String);
                    // ★ UI 즉시 반영
                    setOrders(prev=>prev.map(o=>ids.includes(String(o.id))?{...o,status:"대기",detail:null}:o));
                    setCheckedOrders(new Set());
                    setOrderTab("생산계획");
                    // ★ 재고 복구 누적 계산
                    const stockDelta={};
                    const logIds=[];
                    const orderIds=[];
                    for(const id of ids){
                      const order=orders.find(o=>String(o.id)===id);if(!order)continue;
                      if(order.detail?.details){
                        for(const d of order.detail.details)for(const u of (d.used||[])){
                          stockDelta[u.id]=(stockDelta[u.id]||0)+u.qty;
                        }
                      }
                      if(order.detail?.logId)logIds.push(order.detail.logId);
                      orderIds.push(id);
                    }
                    const updatedStock=[...stock];
                    const stockUpdates=Object.entries(stockDelta).map(([sid,delta])=>{
                      const idx=updatedStock.findIndex(s=>String(s.id)===sid);
                      if(idx!==-1){const restored=updatedStock[idx].qty+delta;updatedStock[idx]={...updatedStock[idx],qty:restored};return sb.from("drip2_stock").update({qty:restored}).eq("id",sid);}
                    }).filter(Boolean);
                    setStock(updatedStock);
                    // ★ logId + order_id 둘 다로 로그 삭제
                    setProdLog(prev=>prev.filter(l=>!logIds.includes(l.id)&&!orderIds.includes(l.order_id)));
                    await Promise.all([
                      ...stockUpdates,
                      ...logIds.map(lid=>sb.from("drip2_prod_log").delete().eq("id",lid)),
                      ...orderIds.map(oid=>sb.from("drip2_prod_log").delete().eq("order_id",oid)),
                      ...ids.map(id=>sb.from("drip2_orders").update({status:"대기",detail:null}).eq("id",id)),
                    ]);
                    }finally{resumePoll();}
                  });
                }} style={{background:"rgba(90,130,200,.25)",border:"1px solid #5a8fc055",borderRadius:6,color:"#8ac8d8",padding:"4px 14px",fontSize:12,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>🔄 선택 복귀 {checkedOrders.size>0?"("+checkedOrders.size+"건)":""}</button>
              </div>
            )}

            {/* 생산계획 목록 */}
            {orderTab==="생산계획"&&(
              viewOrders.filter(o=>o.status==="대기"||o.status==="투입완료").length===0
                ?<div style={{textAlign:"center",color:"#909888",padding:26,fontSize:14}}>생산계획 주문이 없습니다.</div>
                :viewOrders.filter(o=>o.status==="대기"||o.status==="투입완료").map((order,idx,arr)=>(
                  <div key={order.id} style={{display:"flex",alignItems:"flex-start",gap:8}}>
                    <div style={{paddingTop:15,flexShrink:0}}><input type="checkbox" checked={checkedOrders.has(order.id)} onChange={()=>toggleCheck(order.id)} style={{width:18,height:18,cursor:"pointer",accentColor:"#7aaf6a"}}/></div>
                    <div style={{flex:1}}>
                      <OrderCard order={order} pName={pName} sName={sName} fmtDate={fmtDate}
                        invest={invest} delOrder={delOrder} updateOrder={updateOrder}
                        confirmOrder={confirmOrder} completeOrder={completeOrder} revertOrder={revertOrder} cancelOrder={cancelOrder}
                        primaryBtn={primaryBtn} delBtn={delBtn}
                        moveOrder={moveOrder} isFirst={idx===0} isLast={idx===arr.length-1}
                        channels={channels}/>
                    </div>
                  </div>
                ))
            )}

            {/* 생산확정 목록 — A/B 라인별 순위 + 클릭/드래그 재정렬 */}
            {orderTab==="생산확정"&&(
              viewOrders.filter(o=>o.status==="확정").length===0
                ?<div style={{textAlign:"center",color:"#909888",padding:26,fontSize:14}}>생산확정 주문이 없습니다.</div>
                :<div>
                  <div style={{fontSize:12,color:"#8a9a88",marginBottom:10,padding:"6px 12px",background:"rgba(255,255,255,.04)",borderRadius:8,border:"1px solid #7a8a7033"}}>
                    ☰ 드래그 또는 <b style={{color:"#c8a06a"}}>순위 뱃지 클릭</b>으로 순위 변경 · <b style={{color:"#8ac8f0"}}>"⇄ 라인 전환" 버튼</b>으로 A/B 라인 이동
                  </div>
                  {(()=>{
                    const confirmedList=viewOrders.filter(o=>o.status==="확정");
                    // 라인별 순서 계산
                    const lineARanks={};const lineBRanks={};
                    let ai=1,bi=1;
                    confirmedList.forEach(o=>{
                      if((o.line||"A")==="A")lineARanks[o.id]=ai++;
                      else lineBRanks[o.id]=bi++;
                    });
                    const lineAList=confirmedList.filter(o=>(o.line||"A")==="A");
                    const lineBList=confirmedList.filter(o=>o.line==="B");

                    const handleLineSwitch=async(order,e)=>{
                      e.stopPropagation();
                      const myLine=order.line||"A";
                      const newLine=myLine==="A"?"B":"A";
                      if(!window.confirm(`${myLine}라인 → ${newLine}라인으로 이동하시겠습니까?`))return;
                      setOrders(prev=>prev.map(o=>o.id===order.id?{...o,line:newLine}:o));
                      const{error}=await sb.from("drip2_orders").update({line:newLine}).eq("id",order.id);
                      if(error){
                        alert("라인 전환 저장 실패: "+error.message);
                        setOrders(prev=>prev.map(o=>o.id===order.id?{...o,line:myLine}:o));
                      }
                    };

                    const handleRankClick=(order)=>{
                      const myLine=order.line||"A";
                      const sameLineList=myLine==="A"?lineAList:lineBList;
                      const myRank=myLine==="A"?lineARanks[order.id]:lineBRanks[order.id];
                      const total=sameLineList.length;
                      const input=window.prompt(`현재 ${myLine}-${myRank} 입니다.\n${myLine}라인에서 이동할 순위를 입력하세요 (1~${total}):`);
                      if(!input)return;
                      const target=parseInt(input);
                      if(isNaN(target)||target<1||target>total){alert(`1~${total} 사이 숫자를 입력하세요.`);return;}
                      if(target===myRank)return;
                      // 같은 라인 내 재정렬
                      const reordered=[...sameLineList];
                      const[moved]=reordered.splice(myRank-1,1);
                      reordered.splice(target-1,0,moved);
                      const sortedPriorities=sameLineList.map(o=>o.priority).sort((a,b)=>a-b);
                      const updates=reordered.map((o,i)=>({id:o.id,priority:sortedPriorities[i]}));
                      setOrders(prev=>prev.map(o=>{const u=updates.find(x=>x.id===o.id);return u?{...o,priority:u.priority}:o;}));
                      Promise.all(updates.map(u=>sb.from("drip2_orders").update({priority:u.priority}).eq("id",u.id)));
                    };

                    return confirmedList.map((order,idx)=>{
                      const myLine=order.line||"A";
                      const myRank=myLine==="A"?lineARanks[order.id]:lineBRanks[order.id];
                      const isA=myLine==="A";
                      const badgeBg=isA?"linear-gradient(135deg,#2a5a2a,#4a8a4a)":"linear-gradient(135deg,#1a3a6a,#2a5a9a)";
                      const badgeGlow=isA?"rgba(0,200,80,.5)":"rgba(68,170,255,.5)";
                      const isDragTarget=dragOverId===order.id;
                      return(
                        <div key={order.id}
                          draggable
                          onDragStart={()=>onConfirmDragStart(order.id)}
                          onDragOver={e=>onConfirmDragOver(e,order.id)}
                          onDrop={e=>onConfirmDrop(e,order.id)}
                          onDragEnd={onConfirmDragEnd}
                          style={{marginBottom:8,transition:"opacity .15s",opacity:dragItem.current===order.id?.4:1}}>
                          {isDragTarget&&<div style={{height:3,background:"#c8821a",borderRadius:2,marginBottom:4,boxShadow:"0 0 8px #c8821a"}}/>}
                          <div style={{display:"flex",alignItems:"flex-start",gap:8}}>
                            {/* A/B 라인 순위 뱃지 */}
                            <div style={{flexShrink:0,display:"flex",flexDirection:"column",alignItems:"center",gap:4,paddingTop:12}}>
                              <div
                                onClick={()=>handleRankClick(order)}
                                title={`클릭해서 ${myLine}라인 순위 변경`}
                                style={{background:badgeBg,color:"#fff",borderRadius:7,minWidth:44,height:38,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:13,cursor:"pointer",userSelect:"none",boxShadow:`0 2px 6px rgba(0,0,0,.3)`,padding:"0 6px",gap:1,flexDirection:"column",lineHeight:1}}>
                                <span style={{fontSize:10,opacity:.85,letterSpacing:.5}}>{myLine}라인</span>
                                <span style={{fontSize:18,lineHeight:1}}>{myRank}</span>
                              </div>
                              <div style={{fontSize:9,color:"#7a8a70",letterSpacing:.5}}>순위</div>
                              <button
                                onClick={e=>handleLineSwitch(order,e)}
                                title={`클릭해서 ${myLine==="A"?"B":"A"}라인으로 이동`}
                                style={{background:"rgba(255,255,255,.08)",border:"1px solid #7a8a7055",borderRadius:6,color:"#c8ddb8",fontSize:11,fontWeight:700,padding:"5px 8px",cursor:"pointer",fontFamily:"inherit",minWidth:44,whiteSpace:"nowrap"}}>
                                ⇄ {myLine==="A"?"B":"A"}로
                              </button>
                              <div style={{color:"#5a6a50",fontSize:16,cursor:"grab",lineHeight:1}}>⠿</div>
                            </div>
                            {/* 체크박스 */}
                            <div style={{paddingTop:15,flexShrink:0}}>
                              <input type="checkbox" checked={checkedOrders.has(order.id)} onChange={()=>toggleCheck(order.id)} style={{width:18,height:18,cursor:"pointer",accentColor:"#f5c97a"}}/>

              <div style={{fontSize:11,color:"#8a9a88",marginTop:4}}>💡 매일 작업자 수가 달라서, 아래 가동률 그래프에서 날짜를 클릭해 그날그날 작업자 수/근무시간을 입력해야 해요.</div>
            </div>

            {/* 인원 미입력 경고 배너 */}
            {anaMissingDays.length>0&&(
              <div style={{background:"rgba(224,80,80,.12)",border:"2px solid #e05050",borderRadius:10,padding:"12px 16px",marginBottom:16}}>

                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  {anaMissingDays.map(d=>(
                    <button key={d} onClick={()=>quickSelectDay(d)} style={{background:anaSelDay===d?"#e05050":"rgba(224,80,80,.2)",border:"1px solid #e0505066",borderRadius:6,color:anaSelDay===d?"#fff":"#f0a0a0",fontWeight:anaSelDay===d?700:400,padding:"3px 9px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>{d}</button>
                  ))}
                </div>
                {/* 클릭한 날짜 바로 아래 인라인 입력 — 스크롤 없이 바로 입력 */}
                {anaSelDay&&anaMissingDays.includes(anaSelDay)&&(
                  <div style={{marginTop:12,paddingTop:12,borderTop:"1px solid #e0505044",display:"flex",gap:14,alignItems:"flex-end",flexWrap:"wrap"}}>
                    <div style={{fontSize:13,fontWeight:700,color:"#f5c97a"}}>📅 {anaSelDay} ({anaSelWeekday})</div>
                    <LblInp label="작업자 수 (명) *" type="number" value={String(anaWorkerDraft.workers)} onChange={v=>setAnaWorkerDraft(d=>({...d,workers:v}))} width={100}/>
                    <LblInp label="근무시간 (시간/일) *" type="number" value={String(anaWorkerDraft.hours)} onChange={v=>setAnaWorkerDraft(d=>({...d,hours:v}))} width={120}/>
                    <LblInp label="연장근무 (시간)" type="number" value={String(anaWorkerDraft.overtime)} onChange={v=>setAnaWorkerDraft(d=>({...d,overtime:v}))} width={110}/>
                    <input value={anaNoteDraft} onChange={e=>setAnaNoteDraft(e.target.value)} placeholder="사유(선택)" style={{...inp,width:180}}/>
                    <button onClick={saveAnaNote} disabled={anaNoteSaving} style={{...primaryBtn,padding:"6px 16px",fontSize:13,opacity:anaNoteSaving?.6:1}}>{anaNoteSaving?"저장 중...":"💾 저장"}</button>
                  </div>
                )}
              </div>
            )}

            {/* KPI 카드 */}
            <div style={{display:"flex",gap:14,flexWrap:"wrap",marginBottom:24}}>
              <KpiCard icon="📦" label="총 생산량" value={anaTotalQty.toLocaleString()+"개"}/>
              <KpiCard icon="⏱" label="총 생산시간" value={anaTotalProdHours.toFixed(1)+"시간"} sub="생산수량 × 생산속도"/>
              <KpiCard icon="👥" label="총 가용시간" value={anaTotalAvailHours.toLocaleString()+"시간"} sub={"생산일("+anaDays+"일)별 작업자수×근무시간+연장근무 합산"}/>
              <KpiCard icon="📈" label="평균 가동률" value={anaUtilRate.toFixed(1)+"%"} color={anaUtilRate>=80?"#6fcf97":anaUtilRate>=50?"#f5c97a":"#e89090"}/>
            </div>

            {/* 제품 생산 순위 */}
            <div style={{marginBottom:26}}>
              <SecTitle icon="🏆" title="제품 생산 순위"/>
              <BarRankChart data={anaProductRank}/>
            </div>

            {/* 가동률 그래프 */}
            <div style={{marginBottom:26}}>
              <SecTitle icon="📉" title="가동률 추이 (일별)"/>
              <TrendSvgChart data={anaUtilTrend} color="#c8821a" unit="%" height={190} selected={anaSelDay} onSelect={selectAnaDay} notedDates={anaNoteMap}/>
              <div style={{display:"flex",gap:20,marginTop:8,fontSize:13,color:"#a8b8a0",flexWrap:"wrap"}}>
                <span>평균 <b style={{color:"#f5c97a"}}>{anaUtilAvg.toFixed(1)}%</b></span>
                <span>최대 <b style={{color:"#6fcf97"}}>{anaUtilMax.toFixed(1)}%</b></span>
                <span>최소 <b style={{color:"#e89090"}}>{anaUtilMin.toFixed(1)}%</b></span>
                <span style={{color:"#8a9a88"}}>🟡 점 아래 표시 = 사유 등록된 날짜</span>
              </div>

              {/* 선택한 날짜의 가동률 근거 상세 */}
              {anaSelDay&&(
                <div ref={anaDetailRef} style={{marginTop:14,background:"rgba(200,130,26,.08)",border:"1px solid #c8821a55",borderRadius:12,padding:"16px 18px"}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,flexWrap:"wrap",gap:8}}>
                    <div style={{fontSize:14,fontWeight:700,color:"#f5c97a"}}>📅 {anaSelDay} ({anaSelWeekday}) 가동률 근거</div>
                    <button onClick={()=>setAnaSelDay(null)} style={{background:"rgba(255,255,255,.08)",border:"1px solid #7a8a7044",borderRadius:6,color:"#c8c8b8",padding:"3px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>✕ 닫기</button>
                  </div>
                  <div style={{display:"flex",gap:16,flexWrap:"wrap",marginBottom:12,fontSize:13,color:"#e8f0e0"}}>
                    <span>생산시간 <b style={{color:"#f5c97a"}}>{anaSelTotalHours.toFixed(2)}시간</b></span>
                    <span>÷ 그날 가용시간 <b style={{color:anaSelDailyAvail?"#f5c97a":"#e89090"}}>{anaSelDailyAvail?anaSelDailyAvail.toLocaleString()+"시간":"미입력"}</b></span>
                    <span>× 100 = 가동률 <b style={{color:"#c8821a",fontSize:15}}>{anaSelDailyAvail?anaSelRate.toFixed(1)+"%":"-"}</b></span>
                  </div>
                  <Tbl headers={["완제품","생산속도(초/개)","생산수량","생산시간"]}>
                    {anaSelDetail.map(d=>(
                      <tr key={d.code}>
                        <Td><div style={{color:"#9a7050",fontSize:11}}>[{d.code}]</div><div style={{color:"#f5c97a",fontWeight:600}}>{d.label}</div></Td>
                        <Td>{d.speed?d.speed+"초":<span style={{color:"#e89090"}}>미설정(0)</span>}</Td>
                        <Td>{d.qty.toLocaleString()}개</Td>
                        <Td>{d.hours.toFixed(2)}시간</Td>
                      </tr>
                    ))}
                    {anaSelDetail.length===0&&<tr><Td style={{textAlign:"center",color:"#8a9a88"}} colSpan={4}>해당 날짜 생산완료 데이터가 없습니다.</Td></tr>}
                  </Tbl>
                  <div style={{marginTop:8,fontSize:12,color:"#a8b8a0"}}>합계: {anaSelTotalQty.toLocaleString()}개 · {anaSelTotalHours.toFixed(2)}시간</div>
                  {anaSelDetail.some(d=>!d.speed)&&<div style={{marginTop:6,fontSize:11,color:"#e89090"}}>⚠️ 생산속도가 설정되지 않은 제품은 생산시간이 0으로 계산됩니다. "제품마스터" 탭에서 설정해주세요.</div>}

                  {/* 그날 작업자수/근무시간 — 날짜마다 반드시 입력 */}
                  <div style={{marginTop:16,paddingTop:14,borderTop:"1px solid #7a8a7044"}}>
                    <div style={{fontSize:13,fontWeight:700,color:"#f5c97a",marginBottom:10}}>👥 이 날짜 작업자 수 / 근무시간 {!anaSelDailyAvail&&<span style={{color:"#e05050",fontWeight:700}}>· 미입력 ⚠️</span>}</div>
                    <div style={{display:"flex",gap:16,alignItems:"flex-end",flexWrap:"wrap"}}>
                      <LblInp label="작업자 수 (명) *" type="number" value={String(anaWorkerDraft.workers)} onChange={v=>setAnaWorkerDraft(d=>({...d,workers:v}))} width={110}/>
                      <LblInp label="근무시간 (시간/일) *" type="number" value={String(anaWorkerDraft.hours)} onChange={v=>setAnaWorkerDraft(d=>({...d,hours:v}))} width={120}/>
                      <LblInp label="연장근무 (시간)" type="number" value={String(anaWorkerDraft.overtime)} onChange={v=>setAnaWorkerDraft(d=>({...d,overtime:v}))} width={110}/>
                      <div style={{fontSize:12,color:"#a8b8a0"}}>이 날짜 가용시간: <b style={{color:"#f5c97a"}}>{((Number(anaWorkerDraft.workers)||0)*(Number(anaWorkerDraft.hours)||0)+(Number(anaWorkerDraft.overtime)||0)).toLocaleString()}시간</b> <span style={{color:"#8a9a88"}}>(기본 {((Number(anaWorkerDraft.workers)||0)*(Number(anaWorkerDraft.hours)||0)).toLocaleString()}h + 연장 {(Number(anaWorkerDraft.overtime)||0).toLocaleString()}h)</span></div>
                    </div>
                  </div>

                  {/* 가동률 사유 메모 — 저장 시 drip2_ana_notes 테이블에 upsert */}
                  <div style={{marginTop:16,paddingTop:14,borderTop:"1px solid #7a8a7044"}}>
                    <div style={{fontSize:13,fontWeight:700,color:"#f5c97a",marginBottom:6}}>📝 가동률 변동 사유 (선택)</div>
                    <textarea value={anaNoteDraft} onChange={e=>setAnaNoteDraft(e.target.value)} placeholder="예) 설비 점검으로 오전 2시간 라인 정지 / 결원 2명으로 가동률 저조 등" rows={3} style={{...inp,width:"100%",resize:"vertical",fontFamily:"inherit",boxSizing:"border-box"}}/>
                    <div style={{display:"flex",justifyContent:"flex-end",alignItems:"center",gap:10,marginTop:8}}>
                      <button onClick={saveAnaNote} disabled={anaNoteSaving} style={{...primaryBtn,padding:"6px 18px",fontSize:13,opacity:anaNoteSaving?.6:1}}>{anaNoteSaving?"저장 중...":"💾 저장"}</button>
                    </div>
                  </div>
                </div>
              )}
            </div>

            {/* 하루 낱개 포장량 추이 */}
            <div style={{marginBottom:26}}>
              <SecTitle icon="📦" title="하루 낱개 포장량 추이"/>
              <TrendSvgChart data={anaPackTrend} color="#4db6ac" unit="개" selected={anaPackSelDay} onSelect={d=>setAnaPackSelDay(prev=>prev===d?null:d)}/>
              <div style={{display:"flex",gap:20,marginTop:8,fontSize:13,color:"#a8b8a0",flexWrap:"wrap"}}>
                <span>총 포장량 <b style={{color:"#f5c97a"}}>{anaPackTotal.toLocaleString()}개</b></span>
                <span>일평균 <b style={{color:"#6fcf97"}}>{anaPackAvg.toLocaleString(undefined,{maximumFractionDigits:0})}개</b></span>
                <span>최대 <b style={{color:"#4db6ac"}}>{anaPackMax.toLocaleString()}개</b></span>
              </div>
              {anaPackTrend.length===0&&<div style={{marginTop:6,fontSize:11,color:"#8a9a88"}}>💡 완제품 생산완료 수량 × BOM 구성품 총 수량으로 계산돼요. (예: 세트 1개에 낱개 6종×3개=18개면 100세트 생산 시 1,800개)</div>}

              {/* 선택한 날짜의 낱개 포장량 근거 */}
              {anaPackSelDay&&(
                <div style={{marginTop:14,background:"rgba(77,182,172,.08)",border:"1px solid #4db6ac55",borderRadius:12,padding:"16px 18px"}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,flexWrap:"wrap",gap:8}}>
                    <div style={{fontSize:14,fontWeight:700,color:"#4db6ac"}}>📅 {anaPackSelDay} ({anaPackSelWeekday}) 낱개 포장량 근거</div>
                    <button onClick={()=>setAnaPackSelDay(null)} style={{background:"rgba(255,255,255,.08)",border:"1px solid #7a8a7044",borderRadius:6,color:"#c8c8b8",padding:"3px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>✕ 닫기</button>
                  </div>
                  <Tbl headers={["완제품","생산수량","제품당 낱개수","낱개 포장량"]}>
                    {anaPackSelDetail.map(d=>(
                      <tr key={d.code}>
                        <Td><div style={{color:"#9a7050",fontSize:11}}>[{d.code}]</div><div style={{color:"#f5c97a",fontWeight:600}}>{d.label}</div></Td>
                        <Td>{d.qty.toLocaleString()}개</Td>
                        <Td>{d.unitsPerProduct?d.unitsPerProduct+"개":<span style={{color:"#e89090"}}>BOM 미설정(0)</span>}</Td>
                        <Td style={{color:"#4db6ac",fontWeight:700}}>{d.packQty.toLocaleString()}개</Td>
                      </tr>
                    ))}
                    {anaPackSelDetail.length===0&&<tr><Td style={{textAlign:"center",color:"#8a9a88"}} colSpan={4}>해당 날짜 생산완료 데이터가 없습니다.</Td></tr>}
                  </Tbl>
                  <div style={{marginTop:8,fontSize:12,color:"#a8b8a0"}}>합계: 완제품 {anaPackSelTotalQty.toLocaleString()}개 · 낱개 포장량 <b style={{color:"#4db6ac"}}>{anaPackSelTotalPack.toLocaleString()}개</b></div>
                  {anaPackSelDetail.some(d=>!d.unitsPerProduct)&&<div style={{marginTop:6,fontSize:11,color:"#e89090"}}>⚠️ BOM이 등록되지 않은 제품은 낱개 포장량이 0으로 계산됩니다. "BOM관리" 탭에서 설정해주세요.</div>}
                </div>
              )}
            </div>

            {/* 가동률 사유 기록 목록 */}
            {Object.keys(anaNoteMap).length>0&&(
              <div style={{marginBottom:26}}>
                <SecTitle icon="🗒️" title="가동률 사유 기록"/>
                <Tbl headers={["날짜","요일","작업자/근무시간","연장근무","사유"]}>
                  {Object.keys(anaNoteMap).sort().map(d=>(
                    <tr key={d} onClick={()=>selectAnaDay(d)} style={{cursor:"pointer"}}>
                      <Td><span style={{color:d===anaSelDay?"#e05050":"#f5c97a",fontWeight:d===anaSelDay?700:600}}>{d}</span></Td>
                      <Td>{WEEKDAY_KR[new Date(d+"T00:00:00Z").getUTCDay()]}</Td>
                      <Td>{anaNoteMap[d].workers!=null?anaNoteMap[d].workers+"명 × "+anaNoteMap[d].hours+"시간":<span style={{color:"#8a9a88"}}>기본값</span>}</Td>
                      <Td>{anaNoteMap[d].overtime?anaNoteMap[d].overtime+"시간":<span style={{color:"#8a9a88"}}>-</span>}</Td>
                      <Td style={{color:"#e8f0e0"}}>{anaNoteMap[d].note||<span style={{color:"#8a9a88"}}>-</span>}</Td>
                    </tr>
                  ))}
                </Tbl>
              </div>
            )}

            {/* 제품별 생산 비율 */}
            <div style={{marginBottom:26}}>
              <SecTitle icon="🥧" title="제품별 생산 비율"/>
              <DonutChart data={anaProductPie}/>
            </div>

            {/* 베스트 / 워스트 */}
            <div style={{display:"flex",gap:24,flexWrap:"wrap",marginBottom:26}}>
              <div style={{flex:1,minWidth:280}}>
                <SecTitle icon="🥇" title="베스트 제품 TOP5"/>
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {anaBest.map((d,i)=>(
                    <div key={d.code} style={{display:"flex",alignItems:"center",gap:10,background:"rgba(255,255,255,.05)",border:"1px solid #7a8a7044",borderRadius:10,padding:"10px 14px"}}>
                      <span style={{fontSize:20}}>{["🥇","🥈","🥉","4️⃣","5️⃣"][i]}</span>
                      <span style={{flex:1,color:"#f5c97a",fontWeight:700}}>{d.label}</span>
                      <span style={{color:"#e8f0e0",fontWeight:700}}>{d.value.toLocaleString()}개</span>
                    </div>
                  ))}
                  {anaBest.length===0&&<div style={{color:"#8a9a88",fontSize:13}}>데이터가 없습니다.</div>}
                </div>
              </div>
              <div style={{flex:1,minWidth:280}}>
                <SecTitle icon="⚠️" title="워스트 제품 TOP5"/>
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {anaWorst.map((d,i)=>(
                    <div key={d.code} style={{display:"flex",alignItems:"center",gap:10,background:"rgba(255,255,255,.05)",border:"1px solid #7a8a7044",borderRadius:10,padding:"10px 14px"}}>
                      <span style={{width:20,textAlign:"center",color:"#8a9a88",fontWeight:700}}>{i+1}</span>
                      <span style={{flex:1,color:"#e89090",fontWeight:700}}>{d.label}</span>
                      <span style={{color:"#e8f0e0",fontWeight:700}}>{d.value.toLocaleString()}개</span>
                    </div>
                  ))}
                  {anaWorst.length===0&&<div style={{color:"#8a9a88",fontSize:13}}>데이터가 없습니다.</div>}
                </div>
              </div>
            </div>

            {/* 업체별 분석 */}
            <div style={{marginBottom:10}}>
              <SecTitle icon="🏢" title="업체별 생산 실적"/>
              <Tbl headers={["순위","업체","생산량","비율"]}>
                {anaChannelStats.map((c,i)=>(
                  <tr key={c.label}>
                    <Td>{i+1}</Td>
                    <Td><ChannelBadge name={c.label} color={c.color} color2={c.color2} size="sm"/></Td>
                    <Td>{c.value.toLocaleString()}개</Td>
                    <Td>{(c.value/(anaTotalQty||1)*100).toFixed(1)}%</Td>
                  </tr>
                ))}
                {anaChannelStats.length===0&&<tr><Td style={{textAlign:"center",color:"#8a9a88"}} colSpan={4}>데이터가 없습니다.</Td></tr>}
              </Tbl>
            </div>
          </div>
        )}

        {/* ════ 라인별생산량 ════ */}
        {tab==="라인별생산량"&&(
          <div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
              <SecTitle icon="🟢🔵" title="라인별 생산량 / 낱개 포장량"/>
            </div>

            {/* 기간 선택 */}
            <div style={{background:"rgba(255,255,255,.05)",border:"1px solid #7a8a7044",borderRadius:10,padding:"12px 16px",marginBottom:16,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
              {["일별","월별","년별","특정기간"].map(pt=>(
                <button key={pt} onClick={()=>setAnaPeriodType(pt)} style={{padding:"5px 14px",borderRadius:20,border:"none",cursor:"pointer",fontFamily:"inherit",fontSize:13,background:anaPeriodType===pt?"#6a8a5a":"rgba(255,255,255,.1)",color:anaPeriodType===pt?"#fff":"#c8c8b8",fontWeight:anaPeriodType===pt?700:400}}>{pt}</button>
              ))}
              {anaPeriodType!=="특정기간"&&(
                <div style={{display:"flex",alignItems:"center",gap:6,background:"rgba(255,255,255,.06)",border:"1px solid #7a8a7044",borderRadius:20,padding:"3px 6px"}}>
                  <button onClick={()=>shiftAnaAnchor(-1)} style={{background:"rgba(255,255,255,.1)",border:"none",borderRadius:"50%",width:26,height:26,color:"#f5c97a",cursor:"pointer",fontFamily:"inherit",fontSize:14}}>◀</button>
                  <span style={{color:"#f5c97a",fontWeight:700,fontSize:14,minWidth:90,textAlign:"center"}}>{anaPeriodLabel}</span>
                  <button onClick={()=>shiftAnaAnchor(1)} style={{background:"rgba(255,255,255,.1)",border:"none",borderRadius:"50%",width:26,height:26,color:"#f5c97a",cursor:"pointer",fontFamily:"inherit",fontSize:14}}>▶</button>
                  {anaAnchor!==today()&&<button onClick={()=>setAnaAnchor(today())} style={{background:"rgba(200,130,26,.2)",border:"1px solid #c8821a44",borderRadius:14,color:"#c8a06a",padding:"3px 10px",fontSize:11,cursor:"pointer",fontFamily:"inherit",marginLeft:4}}>오늘</button>}
                </div>
              )}
              {anaPeriodType==="특정기간"&&(<>
                <input type="date" value={anaCustomFrom} onChange={e=>setAnaCustomFrom(e.target.value)} style={{...inp,width:150}}/>
                <span style={{color:"#8a9a88"}}>~</span>
                <input type="date" value={anaCustomTo} onChange={e=>setAnaCustomTo(e.target.value)} style={{...inp,width:150}}/>
              </>)}
              <span style={{fontSize:12,color:"#8a9a88",marginLeft:"auto"}}>
                {anaLoading?"불러오는 중...":anaFrom+" ~ "+anaTo+" · "+anaRows.length.toLocaleString()+"건"}

                <div style={{flex:1,minWidth:200,background:"rgba(50,100,180,.15)",border:"2px solid #5a8fc055",borderRadius:10,padding:"16px 20px"}}>
                  <div style={{fontSize:18,fontWeight:900,color:"#8ac8f0",marginBottom:8}}>🔵 B 라인</div>
                  <div style={{fontSize:13,color:"#4a6a9a",lineHeight:1.7}}>
                    <div>완제품 생산 주문 등록 시 <b style={{color:"#8ac8f0"}}>B라인</b> 선택</div>
                    <div>전광판 오른쪽 컬럼에 표시</div>
                    <div style={{marginTop:8,fontSize:12,color:"#3a5a8a"}}>주문 등록 후 ✏️ 수정으로 라인 변경 가능</div>
                  </div>
                </div>
              </div>
              <div style={{marginTop:14,padding:"10px 14px",background:"rgba(200,130,26,.08)",border:"1px solid #c8821a33",borderRadius:8,fontSize:12,color:"#c8a06a",lineHeight:1.6}}>
                ⚠️ <b>DB 설정 필요 (최초 1회)</b> — Supabase 대시보드 SQL Editor에서 아래 쿼리를 실행하세요:<br/>
                <code style={{display:"block",marginTop:6,padding:"8px 12px",background:"rgba(0,0,0,.3)",borderRadius:6,color:"#f5c97a",fontSize:11,fontFamily:"monospace",letterSpacing:.3}}>
                  ALTER TABLE drip2_orders ADD COLUMN IF NOT EXISTS line TEXT DEFAULT 'A';
                </code>
              </div>
            </div>

            {/* 업체 관리 */}
            <div style={{background:"rgba(255,255,255,.04)",border:"1px solid #7a8a7044",borderRadius:12,padding:"20px 22px",marginBottom:24}}>
              <div style={{fontSize:15,fontWeight:700,color:"#c8ddb8",marginBottom:6}}>🏢 출고 업체 관리</div>
              <div style={{fontSize:12,color:"#8a9a88",marginBottom:16}}>등록된 업체가 생산 주문 드롭다운에 표시됩니다.</div>

              {channels.length===0&&<div style={{textAlign:"center",color:"#8a9a88",padding:16,fontSize:14}}>등록된 업체가 없습니다.</div>}
              <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:20}}>
                {channels.map((ch,idx,arr)=>(
                  <div key={ch.id} style={{display:"flex",alignItems:editChId===ch.id?"flex-start":"center",gap:10,padding:"10px 14px",background:"rgba(255,255,255,.05)",border:"1px solid "+(editChId===ch.id?"#c8821a77":"#7a8a7044"),borderRadius:10,flexWrap:"wrap"}}>
                    {editChId===ch.id?(
                      <div style={{width:"100%",background:"rgba(200,130,26,.08)",border:"1px solid #c8821a44",borderRadius:8,padding:"14px 16px"}}>
                        <div style={{fontSize:12,color:"#c8a06a",fontWeight:700,marginBottom:12}}>✏️ 업체 수정 중: {ch.name}</div>
                        <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-end"}}>
                          <div>
                            <div style={{fontSize:12,color:"#c8a06a",marginBottom:4}}>업체명</div>
                            <input value={editChData.name} onChange={e=>setEditChData(d=>({...d,name:e.target.value}))}
                              style={{...inp,width:140}} placeholder="업체명"/>
                          </div>
                          <ColorPicker label="색상1" value={editChData.color} onChange={v=>setEditChData(d=>({...d,color:v}))}/>
                          <ColorPicker label="색상2 (선택)" value={editChData.color2} onChange={v=>setEditChData(d=>({...d,color2:v}))}/>
                          {editChData.name&&<div style={{alignSelf:"flex-end",paddingBottom:2}}>
                            <div style={{fontSize:11,color:"#8a9a88",marginBottom:4}}>미리보기</div>
                            <ChannelBadge name={editChData.name} color={editChData.color} color2={editChData.color2}/>
                          </div>}
                        </div>
                        <div style={{display:"flex",gap:8,marginTop:14,borderTop:"1px solid #c8821a22",paddingTop:12}}>
                          <button onClick={saveEditCh}
                            style={{background:"linear-gradient(135deg,#5a7a4a,#7a9a6a)",border:"none",borderRadius:8,color:"#fff",padding:"8px 24px",fontSize:14,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>
                            💾 저장
                          </button>
                          <button onClick={()=>setEditChId(null)}
                            style={{background:"rgba(255,255,255,.08)",border:"1px solid #7a8a7055",borderRadius:8,color:"#c8a06a",padding:"8px 18px",fontSize:14,cursor:"pointer",fontFamily:"inherit"}}>
                            취소
                          </button>
                        </div>
                      </div>
                    ):(
                      <>
                        <ChannelBadge name={ch.name} color={ch.color} color2={ch.color2}/>
                        <div style={{display:"flex",gap:4}}>
                          <div style={{width:18,height:18,borderRadius:4,background:ch.color||"#555",border:"2px solid rgba(255,255,255,.3)"}}/>
                          {ch.color2&&<div style={{width:18,height:18,borderRadius:4,background:ch.color2,border:"2px solid rgba(255,255,255,.3)"}}/>}
                        </div>
                        <span style={{fontSize:12,padding:"2px 8px",borderRadius:10,background:ch.active!==false?"rgba(76,175,80,.2)":"rgba(160,60,60,.2)",color:ch.active!==false?"#6fcf97":"#e89090",border:"1px solid "+(ch.active!==false?"#4caf5044":"#c0606044")}}>{ch.active!==false?"활성":"비활성"}</span>
                        <div style={{marginLeft:"auto",display:"flex",gap:6,alignItems:"center"}}>
                          {/* 순서 이동 */}
                          <div style={{display:"flex",flexDirection:"column",gap:2}}>
                            <button onClick={async()=>{
                              if(idx===0)return;
                              const prev=arr[idx-1];
                              const prevOrder=prev.sort_order??idx-1;
                              const curOrder=ch.sort_order??idx;
                              await Promise.all([
                                sb.from("drip2_channels").update({sort_order:prevOrder}).eq("id",ch.id),
                                sb.from("drip2_channels").update({sort_order:curOrder}).eq("id",prev.id),
                              ]);
                              setChannels(p=>{const n=[...p];const pi=n.findIndex(x=>x.id===prev.id);const ci=n.findIndex(x=>x.id===ch.id);[n[pi],n[ci]]=[n[ci],n[pi]];return n;});
                            }} disabled={idx===0} style={{background:"rgba(255,255,255,.08)",border:"1px solid #7a8a7044",borderRadius:4,color:"#a8b8a0",padding:"1px 7px",fontSize:12,cursor:idx===0?"default":"pointer",opacity:idx===0?.3:1,fontFamily:"inherit"}}>▲</button>
                            <button onClick={async()=>{
                              if(idx===arr.length-1)return;
                              const next=arr[idx+1];
                              const nextOrder=next.sort_order??idx+1;
                              const curOrder=ch.sort_order??idx;
                              await Promise.all([
                                sb.from("drip2_channels").update({sort_order:nextOrder}).eq("id",ch.id),
                                sb.from("drip2_channels").update({sort_order:curOrder}).eq("id",next.id),
                              ]);
                              setChannels(p=>{const n=[...p];const ci=n.findIndex(x=>x.id===ch.id);const ni=n.findIndex(x=>x.id===next.id);[n[ci],n[ni]]=[n[ni],n[ci]];return n;});
                            }} disabled={idx===arr.length-1} style={{background:"rgba(255,255,255,.08)",border:"1px solid #7a8a7044",borderRadius:4,color:"#a8b8a0",padding:"1px 7px",fontSize:12,cursor:idx===arr.length-1?"default":"pointer",opacity:idx===arr.length-1?.3:1,fontFamily:"inherit"}}>▼</button>
                          </div>
                          <button onClick={()=>toggleChActive(ch.id,ch.active===false)} style={{background:"rgba(255,255,255,.08)",border:"1px solid #7a8a7055",borderRadius:6,color:"#c8ddb8",padding:"4px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>{ch.active!==false?"비활성화":"활성화"}</button>
                          <button onClick={()=>startEditCh(ch)} style={{background:"rgba(200,130,26,.2)",border:"1px solid #c8821a44",borderRadius:6,color:"#c8a06a",padding:"4px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>✏️ 수정</button>
                          <button onClick={()=>delChannel(ch.id)} style={{...delBtn,padding:"4px 10px",fontSize:12}}>✕ 삭제</button>
                        </div>
                      </>
                    )}
                  </div>
                ))}
              </div>

              {/* 업체 추가 */}
              <div style={{borderTop:"1px solid #7a8a7033",paddingTop:16}}>
                <div style={{fontSize:13,color:"#a8b8a0",marginBottom:10,fontWeight:600}}>➕ 새 업체 추가</div>
                <div style={{display:"flex",gap:10,alignItems:"flex-end",flexWrap:"wrap"}}>
                  <LblInp label="업체명" value={newChannel.name} onChange={v=>setNewChannel(f=>({...f,name:v}))} placeholder="예: 컬리" width={120}/>
                  <ColorPicker label="색상1 (필수)" value={newChannel.color} onChange={v=>setNewChannel(f=>({...f,color:v}))}/>
                  <ColorPicker label="색상2 (선택)" value={newChannel.color2} onChange={v=>setNewChannel(f=>({...f,color2:v}))}/>
                  {newChannel.name&&<div style={{alignSelf:"flex-end",paddingBottom:2}}><ChannelBadge name={newChannel.name} color={newChannel.color} color2={newChannel.color2}/></div>}
                  <button onClick={addChannel} style={{...primaryBtn,alignSelf:"flex-end"}}>+ 등록</button>
                </div>
              </div>
            </div>

            {/* 내 비밀번호 변경 */}
            <div style={{background:"rgba(255,255,255,.04)",border:"1px solid #7a8a7044",borderRadius:12,padding:"20px 22px",marginBottom:24}}>
              <div style={{fontSize:15,fontWeight:700,color:"#c8ddb8",marginBottom:14}}>🔑 내 비밀번호 변경</div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
                <LblInp label="현재 비밀번호" type="password" value={pwChange.cur} onChange={v=>{setPwChange(p=>({...p,cur:v}));setPwChangeMsg(null);}} placeholder="현재 비밀번호" width={150}/>
                <LblInp label="새 비밀번호" type="password" value={pwChange.next} onChange={v=>{setPwChange(p=>({...p,next:v}));setPwChangeMsg(null);}} placeholder="새 비밀번호 (4자 이상)" width={160}/>
                <LblInp label="새 비밀번호 확인" type="password" value={pwChange.confirm} onChange={v=>{setPwChange(p=>({...p,confirm:v}));setPwChangeMsg(null);}} placeholder="다시 입력" width={150}/>
                <button onClick={changePw} style={{...primaryBtn,alignSelf:"flex-end"}}>변경</button>
              </div>
              {pwChangeMsg&&<div style={{marginTop:10,padding:"8px 12px",borderRadius:8,fontSize:13,background:pwChangeMsg.type==="ok"?"rgba(76,175,80,.15)":"rgba(220,70,70,.15)",border:"1px solid "+(pwChangeMsg.type==="ok"?"#4caf5055":"#e0707055"),color:pwChangeMsg.type==="ok"?"#6fcf97":"#f08080"}}>{pwChangeMsg.msg}</div>}
            </div>

            {/* 계정 정보 */}
            <div style={{background:"rgba(255,255,255,.04)",border:"1px solid #7a8a7044",borderRadius:12,padding:"20px 22px"}}>
              <div style={{fontSize:15,fontWeight:700,color:"#c8ddb8",marginBottom:14}}>👤 계정 정보</div>
              <div style={{display:"flex",gap:16,flexWrap:"wrap",alignItems:"center"}}>
                <div style={{background:"rgba(255,255,255,.06)",borderRadius:8,padding:"12px 18px"}}>
                  <div style={{fontSize:12,color:"#8a9a88",marginBottom:4}}>현재 로그인</div>
                  <div style={{color:"#f5c97a",fontWeight:700}}>👤 {user.user_id}</div>
                </div>
                <button onClick={logout} style={{background:"rgba(200,80,80,.2)",border:"1px solid #c0606055",borderRadius:8,color:"#e89090",padding:"8px 18px",fontSize:13,cursor:"pointer",fontFamily:"inherit",fontWeight:600}}>🚪 로그아웃</button>
              </div>
              <div style={{marginTop:16,padding:"10px 14px",background:"rgba(100,160,80,.1)",border:"1px solid #6a9a5033",borderRadius:8,fontSize:12,color:"#a8c898",lineHeight:1.6}}>
                💡 새 계정 추가 / 비밀번호 초기화는 로그인 화면의 <strong style={{color:"#c8ddb8"}}>계정 만들기 / 비밀번호 변경</strong> 탭을 이용하세요. (마스터 코드 필요)
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
