(function autoUpdateCheck(){
  let lastActive=Date.now(),pending=false;
  ["mousedown","keydown","touchstart","wheel"].forEach(ev=>document.addEventListener(ev,()=>{lastActive=Date.now();},{passive:true,capture:true}));
  const isBusy=()=>{
    const el=document.activeElement;
    const typing=el&&(el.tagName==="INPUT"||el.tagName==="TEXTAREA"||el.tagName==="SELECT"||el.isContentEditable);
    return typing||Date.now()-lastActive<60*1000;
  };
  const tryReload=()=>{if(pending&&!isBusy())location.reload();};
  const check=async()=>{
    if(document.visibilityState!=="visible")return;
    if(pending){tryReload();return;}
    try{
      const res=await fetch(location.pathname+"?_v="+Date.now(),{cache:"no-store"});
      if(!res.ok)return;
      const m=(await res.text()).match(/const APP_VERSION="([^"]+)"/);
      if(m&&m[1]!==APP_VERSION){pending=true;tryReload();}
    }catch(e){}
  };
  setInterval(check,10*60*1000);
  setInterval(tryReload,30*1000); // 새 버전 대기 중이면 30초마다 "한가한지" 확인
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")check();});
})();

function parseDate(raw){
  if(!raw)return null;
  const s=String(raw).replace(/-/g,"").trim();
  if(s.length!==8)return null;
  const d=new Date(s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6,8));
  return isNaN(d)?null:d;
}
function fmtDate(d){
  if(!d)return"-";
  const dt=typeof d==="string"?new Date(d):d;
  return isNaN(dt)?"-":dt.toISOString().slice(0,10).replace(/-/g,"");
}
// 오늘 날짜 항상 동적 계산 — 대한민국 서울(KST, UTC+9) 기준
function today(){return new Date(new Date().getTime()+9*60*60*1000).toISOString().slice(0,10);}
function addDays(ymd,n){const d=new Date(ymd);d.setDate(d.getDate()+n);return new Date(d.getTime()+9*60*60*1000).toISOString().slice(0,10);}
// YYYYMMDD 형식 검증
function validateYMD8(raw){
  const s=String(raw||"").replace(/-/g,"").trim();
  if(!/^\d{8}$/.test(s))return null;
  const d=new Date(s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6,8));
  return isNaN(d)?null:d;
}

// 엑셀 날짜칸 → "YYYY-MM-DD" (20261021 / 2026-10-21 / 2026.10.21 / 엑셀 날짜서식(일련번호) 모두 허용)
function parseExcelYMD(raw){
  if(raw==null||raw==="")return null;
  if(typeof raw==="number"&&raw>20000&&raw<80000){ // 엑셀 일련번호
    const d=new Date(Math.round((raw-25569)*86400000));
    return isNaN(d)?null:d.toISOString().slice(0,10);
  }
  if(raw instanceof Date&&!isNaN(raw))return new Date(raw.getTime()+9*3600000).toISOString().slice(0,10);
  const s=String(raw).trim().replace(/[.\/]/g,"-").replace(/\s/g,"");
  let y,m,d;
  if(/^\d{8}$/.test(s)){y=s.slice(0,4);m=s.slice(4,6);d=s.slice(6,8);}
  else{const mm=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})-?$/);if(!mm)return null;[,y,m,d]=mm;}
  const out=y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
  const chk=new Date(out+"T00:00:00Z");
  return isNaN(chk)||chk.toISOString().slice(0,10)!==out?null:out;
}

// ── 재고 차감 ──
function fifoDeduct(stock,sCode,need){
  const sorted=stock.filter(s=>s.s_code===sCode&&s.qty>0).sort((a,b)=>new Date(a.expiry)-new Date(b.expiry));
  let rem=need;const used=[];const next=stock.map(s=>({...s}));
  for(const s of sorted){
    if(rem<=0)break;
    const take=Math.min(s.qty,rem);
    used.push({expiry:s.expiry,qty:take,id:s.id});
    rem-=take;
    const idx=next.findIndex(x=>x.id===s.id);
    if(idx!==-1)next[idx].qty-=take;
  }
  return{ok:rem===0,used,next,shortage:rem};
}
function smartDeduct(stock,sCode,need){
  const exps=[...new Set(stock.filter(s=>s.s_code===sCode&&s.qty>0).map(s=>s.expiry))].sort();
  for(const exp of exps){
    const rows=stock.filter(s=>s.s_code===sCode&&s.qty>0&&s.expiry===exp);
    const total=rows.reduce((sum,s)=>sum+s.qty,0);
    if(total>=need){
      let rem=need;const used=[];const next=stock.map(s=>({...s}));
      for(const s of rows){
        if(rem<=0)break;
        const take=Math.min(s.qty,rem);
        used.push({expiry:s.expiry,qty:take,id:s.id});
        rem-=take;
        const idx=next.findIndex(x=>x.id===s.id);
        if(idx!==-1)next[idx].qty-=take;
      }
      return{ok:true,used,next,shortage:0};
    }
  }
  return fifoDeduct(stock,sCode,need);
}
// 지정된 소비기한(동일 날짜)에서만 차감 — 추가생산 시 기존 생산과 같은 로트를 유지하기 위함
function deductExactExpiry(stock,sCode,expiry,need){
  const rows=stock.filter(s=>s.s_code===sCode&&s.expiry===expiry&&s.qty>0);
  const total=rows.reduce((sum,s)=>sum+s.qty,0);
  if(total<need)return{ok:false,used:[],next:stock,shortage:need-total};
  let rem=need;const used=[];const next=stock.map(s=>({...s}));
  for(const s of rows){
    if(rem<=0)break;
    const take=Math.min(s.qty,rem);
    used.push({expiry:s.expiry,qty:take,id:s.id});
    rem-=take;
    const idx=next.findIndex(x=>x.id===s.id);
    if(idx!==-1)next[idx].qty-=take;
  }
  return{ok:true,used,next,shortage:0};
}
function findUnifiedExpiry(stock,recipe,totalQty){
  const allExp=[...new Set(stock.filter(s=>s.qty>0).map(s=>s.expiry))].sort();
  for(const exp of allExp){
    let ok=true;
    for(const comp of recipe){
      const need=comp.qty*totalQty;
      const total=stock.filter(s=>s.s_code===comp.s_code&&s.qty>0&&s.expiry===exp).reduce((sum,s)=>sum+s.qty,0);
      if(total<need){ok=false;break;}
    }
    if(ok)return exp;
  }
  return null;
}
function makeLotKey(d){return d.map(x=>x.sCode+":"+x.expiry).sort().join("|");}
async function assignLot(finExp,detailsWithExp,p_code){
  const curKey=makeLotKey(detailsWithExp);
  const{data:logs}=await sb.from("drip2_prod_log").select("lot,lot_key").eq("p_code",p_code).not("lot","is",null).order("created_at",{ascending:true});
  const validLogs=(logs||[]).filter(l=>l.lot&&l.lot_key);
  const existing=validLogs.find(l=>l.lot_key===curKey);
  if(existing)return existing.lot;
  const usedAlpha=new Set(validLogs.filter(l=>l.lot&&l.lot.startsWith(finExp)).map(l=>l.lot.slice(-1)));
  for(let i=0;i<26;i++){const alpha=String.fromCharCode(65+i);if(!usedAlpha.has(alpha))return finExp+alpha;}
  return finExp+"Z";
}

// ══ 대한민국 시계 (KST) ══════════════════
function KstClock(){
  const[now,setNow]=useState(()=>new Date(new Date().getTime()+9*60*60*1000));
  useEffect(()=>{const t=setInterval(()=>setNow(new Date(new Date().getTime()+9*60*60*1000)),1000);return()=>clearInterval(t);},[]);
  const yyyy=now.getUTCFullYear();
  const mm=String(now.getUTCMonth()+1).padStart(2,"0");
  const dd=String(now.getUTCDate()).padStart(2,"0");
  const hh=String(now.getUTCHours()).padStart(2,"0");
  const mi=String(now.getUTCMinutes()).padStart(2,"0");
  const ss=String(now.getUTCSeconds()).padStart(2,"0");
  const days=["일","월","화","수","목","금","토"];
  const day=days[now.getUTCDay()];
  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"5px 14px",background:"rgba(255,255,255,.07)",border:"1px solid #6a8a5a55",borderRadius:10,lineHeight:1.3}}>
      <div style={{fontSize:11,color:"#8ecf90",fontWeight:600,letterSpacing:.5}}>🇰🇷 대한민국 (KST)</div>
      <div style={{fontSize:13,color:"#f5c97a",fontWeight:700,letterSpacing:.5}}>{yyyy}.{mm}.{dd} ({day})</div>
      <div style={{fontSize:17,color:"#e8f0e0",fontWeight:700,fontVariantNumeric:"tabular-nums",letterSpacing:1}}>{hh}:{mi}:{ss}</div>
    </div>
  );
}

// ══ 생산 전광판 컴포넌트 ════════════════════
function DashboardView({orders,pMaster,sMaster,channels}){
  const DB_GREEN="#00ff88";const DB_GREEN_DIM="#00c968";const DB_AMBER="#ffc400";
  const DB_BLUE="#44aaff";const DB_BLUE_DIM="#2288dd";
  const[dbScreen,setDbScreen]=useState("order");
  const[dbFillPct,setDbFillPct]=useState(0);
  // 실시간: orders prop이 바뀌면 자동 반영 (부모에서 Realtime 구독 중)
  const fillRef=useRef(null);const timerRef=useRef(null);
  const ORDER_SEC=60,STATUS_SEC=20;

  useEffect(()=>{
    const dur=(dbScreen==="order"?ORDER_SEC:STATUS_SEC)*1000;
    const start=Date.now();
    if(fillRef.current)clearInterval(fillRef.current);
    if(timerRef.current)clearTimeout(timerRef.current);
    setDbFillPct(0);
    fillRef.current=setInterval(()=>{
      const pct=Math.min(100,(Date.now()-start)/dur*100);
      setDbFillPct(pct);
      if(pct>=100)clearInterval(fillRef.current);
    },80);
    timerRef.current=setTimeout(()=>setDbScreen(s=>s==="order"?"status":"order"),dur);
    return()=>{clearInterval(fillRef.current);clearTimeout(timerRef.current);};
  },[dbScreen]);

  const todayDate=new Date(new Date().getTime()+9*3600*1000).toISOString().slice(0,10);
  const confirmed=[...orders]
    .filter(o=>o.status==="확정"&&(!o.plan_date||(o.plan_date||"").slice(0,10)===todayDate))
    .sort((a,b)=>a.priority-b.priority);
  const lineA=confirmed.filter(o=>(o.line||"A")==="A");
  const lineB=confirmed.filter(o=>o.line==="B");

  const pName=code=>(pMaster.find(p=>p.code===code)||{}).name||code;
  const fd=d=>d?String(d).slice(0,10).replace(/-/g,""):"-";

  const ChBadge=({name})=>{
    const ch=channels.find(c=>c.name===name);
    const bg=ch?.color||"#556655";const bg2=ch?.color2||null;
    const grad=bg2?`linear-gradient(90deg,${bg} 50%,${bg2} 50%)`:bg;
    return(<span style={{background:grad,color:"#fff",border:"2px solid rgba(255,255,255,.6)",borderRadius:5,padding:"2px 10px",fontSize:12,fontWeight:700,textShadow:"0 1px 3px rgba(0,0,0,.6)",display:"inline-flex",alignItems:"center",whiteSpace:"nowrap"}}>{name||"-"}</span>);
  };
  const ChBadgeBig=({name})=>{
    const ch=channels.find(c=>c.name===name);
    const bg=ch?.color||"#556655";const bg2=ch?.color2||null;
    const grad=bg2?`linear-gradient(90deg,${bg} 50%,${bg2} 50%)`:bg;
    return(<span style={{background:grad,color:"#fff",border:"2px solid rgba(255,255,255,.6)",borderRadius:8,padding:"6px 18px",fontSize:17,fontWeight:700,textShadow:"0 1px 3px rgba(0,0,0,.6)",display:"inline-flex",alignItems:"center",whiteSpace:"nowrap"}}>{name||"-"}</span>);
  };

  // ── 라인 컬럼 렌더 ──
  const LineColumn=({lineOrders,lineLabel,accent,accentDim,fullWidth})=>{
    const top=lineOrders[0],rest=lineOrders.slice(1);
    const emptyBg=`rgba(${accent==="green"?"0,255,136":"68,170,255"},.03)`;
    const borderCol=accent==="green"?accentDim:accentDim;
    const rankBg=accent==="green"
      ?`linear-gradient(180deg,${DB_GREEN_DIM},#007a40)`
      :`linear-gradient(180deg,${DB_BLUE_DIM},#0055aa)`;
    const qtyColor=accent==="green"?DB_GREEN:DB_BLUE;
    const qtyGlow=accent==="green"?"rgba(0,255,136,.45)":"rgba(68,170,255,.45)";
    const chipBorder=accent==="green"?"rgba(0,255,136,.18)":"rgba(68,170,255,.18)";
    const chipLabel=accent==="green"?DB_GREEN_DIM:DB_BLUE_DIM;
    // fullWidth면 글자 크게
    const f={
      headerFs: fullWidth?28:22,
      productFs: fullWidth?52:22,
      qtyFs: fullWidth?72:36,
      qtyUnit: fullWidth?26:15,
      badgePad: fullWidth?"10px 28px":"6px 18px",
      badgeFs: fullWidth?24:17,
      chipLbl: fullWidth?12:9,
      chipVal: fullWidth?20:13,
      rankW: fullWidth?90:58,
      rankFs: fullWidth?48:34,
      restProduct: fullWidth?22:15,
      restQty: fullWidth?22:15,
      restRow: fullWidth?"12px 14px":"7px 10px",
    };

    return(
      <div style={{flex:1,display:"flex",flexDirection:"column",gap:8,minWidth:0}}>
        {/* 라인 헤더 */}
        <div style={{flexShrink:0,display:"flex",alignItems:"center",gap:10,padding:"8px 16px",background:emptyBg,border:"1px solid "+borderCol,borderRadius:10}}>
          <span style={{fontSize:f.headerFs,fontWeight:900,color:qtyColor,letterSpacing:2}}>{lineLabel}</span>
          <span style={{fontSize:14,color:accent==="green"?"#3a6a3a":"#3a5a8a",fontWeight:700}}>{lineOrders.length}건</span>
        </div>

        {lineOrders.length===0?(
          <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:8,color:accent==="green"?"#1a3a1a":"#1a2a4a",border:"1px solid "+borderCol,borderRadius:12}}>
            <div style={{fontSize:40}}>⏸</div>
            <div style={{fontSize:16,fontWeight:700}}>확정 없음</div>
          </div>
        ):(
          /* 카드 목록 — 페이지 스크롤 */
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {lineOrders.map((o,i)=>{
              const isTop=i===0;
              const bg=accent==="green"
                ?(isTop?"linear-gradient(135deg,#0d1f10,#071208)":"rgba(10,20,12,.85)")
                :(isTop?"linear-gradient(135deg,#0a1020,#060810)":"rgba(8,12,24,.85)");
              const bd=isTop?"2px solid "+borderCol:"1px solid "+(accent==="green"?"#2a4a2a":"#1a2a4a");
              const sn=code=>(sMaster||[]).find(s=>s.code===code)?.name||code;
              const chObj=channels.find(c=>c.name===o.channel);
              const chBg=chObj?.color||"#556655";
              const chBg2=chObj?.color2||null;
              const chGrad=chBg2?`linear-gradient(90deg,${chBg} 50%,${chBg2} 50%)`:chBg;

              // ── 글자 크기: 1순위 fullWidth 기준, 2순위 이후는 조금 작게 ──
              const FS={
                rank:   isTop?(fullWidth?52:34):(fullWidth?28:20),
                name:   isTop?(fullWidth?42:22):(fullWidth?26:16),
                qty:    isTop?(fullWidth?60:32):(fullWidth?30:18),
                unit:   isTop?(fullWidth?22:14):(fullWidth?14:11),
                badge:  isTop?(fullWidth?22:14):(fullWidth?14:11),
                lbl:    isTop?(fullWidth?13:10):(fullWidth?11:9),
                val:    isTop?(fullWidth?22:14):(fullWidth?16:12),  // 예정일·LOT·소비기한 값
                sName:  isTop?(fullWidth?28:16):(fullWidth?20:13),  // 낱개 품명 = 완제품명과 동일
                sQty:   isTop?(fullWidth?32:18):(fullWidth?22:14),  // 낱개 수량
                sExp:   isTop?(fullWidth?28:16):(fullWidth?20:13),  // 낱개 소비기한 — 크게!
              };

              return(
                <div key={o.id} style={{flexShrink:0,background:bg,border:bd,borderRadius:12,display:"flex",overflow:"hidden",position:"relative",
                  boxShadow:isTop?`0 0 24px ${accent==="green"?"rgba(0,255,136,.14)":"rgba(68,170,255,.14)"}`:"none"}}>
                  {isTop&&<div style={{position:"absolute",top:0,left:0,right:0,height:2,background:`linear-gradient(90deg,transparent,${qtyColor},transparent)`}}/>}

                  {/* 순위 배지 */}
                  <div style={{width:isTop?(fullWidth?90:60):44,minWidth:isTop?(fullWidth?90:60):44,
                    background:isTop?rankBg:(accent==="green"?"rgba(0,80,40,.5)":"rgba(0,40,100,.5)"),
                    display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:2}}>
                    <div style={{fontSize:FS.rank,fontWeight:900,color:isTop?"#000":qtyColor,fontFamily:"monospace",lineHeight:1}}>{i+1}</div>
                    <div style={{fontSize:isTop?(fullWidth?13:9):(fullWidth?11:8),fontWeight:700,color:isTop?"rgba(0,0,0,.6)":chipLabel,letterSpacing:1}}>순위</div>
                  </div>

                  {/* 본문 */}
                  <div style={{flex:1,padding:isTop?(fullWidth?"18px 24px":"10px 14px"):(fullWidth?"10px 16px":"6px 10px"),display:"flex",flexDirection:"column",gap:isTop?(fullWidth?12:8):(fullWidth?8:4)}}>

                    {/* ── 완제품명 + 수량 + 업체 ── */}
                    <div style={{display:"flex",alignItems:"center",gap:fullWidth?14:8,flexWrap:"wrap"}}>
                      <span style={{fontSize:FS.name,fontWeight:900,color:"#f0f8f0",lineHeight:1.1,wordBreak:"keep-all"}}>{pName(o.p_code)}</span>
                      <span style={{fontSize:FS.qty,fontWeight:900,color:qtyColor,fontFamily:"monospace",textShadow:isTop?`0 0 14px ${qtyGlow}`:"none",lineHeight:1}}>{o.qty.toLocaleString()}</span>
                      <span style={{fontSize:FS.unit,color:chipLabel}}>개</span>
                      <span style={{background:chGrad,color:"#fff",border:"2px solid rgba(255,255,255,.55)",borderRadius:6,padding:fullWidth?(isTop?"8px 20px":"4px 12px"):(isTop?"4px 10px":"2px 8px"),fontSize:FS.badge,fontWeight:700,textShadow:"0 1px 3px rgba(0,0,0,.6)",whiteSpace:"normal",wordBreak:"keep-all",lineHeight:1.25,maxWidth:"100%"}}>{chDisplay(o)}</span>
                    </div>

                    {/* ── 예정일·LOT·소비기한 + 출고정보 ── */}
                    <div style={{display:"flex",gap:fullWidth?10:6,flexWrap:"wrap"}}>
                      {[["예정일",o.plan_date?fd(o.plan_date):"-"],["LOT",o.detail?.lot?"LOT "+o.detail.lot:"-"],["소비기한",o.detail?.finExp?fd(o.detail.finExp):"-"],...(o.ship_date?[["출고일",fd(o.ship_date)]]:[]),...(o.ship_type?[["배송구분",o.ship_type]]:[])].map(([l,v])=>{
                        const isLot=l==="LOT";
                        const valSize=FS.val*1.4|0; // 전부 LOT 크기로 통일
                        return(
                          <div key={l} style={{background:isLot?"rgba(200,130,26,.15)":`rgba(${accent==="green"?"0,255,136":"68,170,255"},.06)`,border:"1px solid "+(isLot?"rgba(200,130,26,.5)":chipBorder),borderRadius:6,padding:fullWidth?(isTop?"6px 14px":"3px 10px"):(isTop?"3px 8px":"2px 6px")}}>
                            <div style={{fontSize:FS.lbl,color:isLot?"#c8a06a":chipLabel,letterSpacing:.5,marginBottom:2}}>{l}</div>
                            <div style={{fontSize:valSize,fontWeight:700,color:isLot?"#f5c97a":"#f0f8f0",fontFamily:"monospace"}}>{v}</div>
                          </div>
                        );
                      })}
                    </div>
                    {o.ship_note&&(
                      <div style={{background:"rgba(242,201,76,.1)",border:"1px solid rgba(242,201,76,.45)",borderRadius:6,padding:fullWidth?(isTop?"6px 14px":"3px 10px"):(isTop?"3px 8px":"2px 6px"),fontSize:FS.val,fontWeight:700,color:"#f2c94c",wordBreak:"keep-all",lineHeight:1.35}}>📝 {o.ship_note}</div>
                    )}
                    {isTop&&(o.detail?.details||[]).length>0&&(
                      <div style={{borderTop:"1px solid "+(accent==="green"?"rgba(0,255,136,.15)":"rgba(68,170,255,.15)"),paddingTop:fullWidth?(isTop?10:6):(isTop?6:4),marginTop:2}}>
                        <div style={{fontSize:FS.lbl,color:chipLabel,fontWeight:700,letterSpacing:1,marginBottom:fullWidth?(isTop?8:4):(isTop?5:3)}}>📦 낱개 투입</div>
                        <div style={{display:"flex",flexDirection:"column",gap:fullWidth?(isTop?8:5):(isTop?5:3)}}>
                          {(o.detail.details||[]).map((d,j)=>(
                            <div key={j} style={{display:"flex",alignItems:"center",gap:fullWidth?(isTop?14:8):(isTop?8:5),flexWrap:"wrap",
                              background:`rgba(${accent==="green"?"0,255,136":"68,170,255"},.04)`,
                              border:"1px solid "+chipBorder,borderRadius:6,
                              padding:fullWidth?(isTop?"8px 14px":"4px 10px"):(isTop?"4px 8px":"2px 6px")}}>
                              {/* 낱개 품명 — 완제품명과 같은 크기 */}
                              <span style={{fontSize:FS.sName,fontWeight:900,color:"#e0f0e0",lineHeight:1.1,wordBreak:"keep-all"}}>{sn(d.sCode)}</span>
                              {/* 낱개 수량 */}
                              <span style={{fontSize:FS.sQty,fontWeight:900,color:qtyColor,fontFamily:"monospace",lineHeight:1}}>{d.total}</span>
                              <span style={{fontSize:FS.unit,color:chipLabel}}>개</span>
                              {/* 소비기한 — 크게 강조 */}
                              <span style={{fontSize:FS.sExp,fontWeight:700,color:"#f5c97a",fontFamily:"monospace",background:"rgba(200,130,26,.15)",border:"1px solid rgba(200,130,26,.3)",borderRadius:5,padding:fullWidth?(isTop?"4px 12px":"2px 8px"):(isTop?"2px 8px":"1px 6px")}}>{fd(d.expiry)}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  };
  // ── 생산순서 화면 (A만 있으면 전체화면, A+B면 분할) ──
  const ScreenOrder=()=>{
    const hasA=lineA.length>0;
    const hasB=lineB.length>0;
    return(
      <div style={{display:"flex",gap:14,alignItems:"flex-start"}}>
        {hasA&&<LineColumn lineOrders={lineA} lineLabel="🟢 A 라인" accent="green" accentDim={DB_GREEN_DIM} fullWidth={!hasB}/>}
        {hasA&&hasB&&<div style={{width:2,background:"linear-gradient(180deg,transparent,#3a4a3a,transparent)",flexShrink:0}}/>}
        {hasB&&<LineColumn lineOrders={lineB} lineLabel="🔵 B 라인" accent="blue" accentDim={DB_BLUE_DIM} fullWidth={!hasA}/>}
        {!hasA&&!hasB&&(
          <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16,color:"#2a4a2a"}}>
            <div style={{fontSize:72}}>🏭</div>
            <div style={{fontSize:32,fontWeight:700,letterSpacing:2}}>생산확정 항목 없음</div>
          </div>
        )}
      </div>
    );
  };
  // ── 생산현황 화면 ──
  const ScreenStatus=()=>{
    const allDone=[...orders].filter(o=>o.status==="완료"&&(o.plan_date||"").slice(0,10)===todayDate);
    const lineAQty=lineA.reduce((s,o)=>s+o.qty,0);
    const lineBQty=lineB.reduce((s,o)=>s+o.qty,0);
    const totalQty=lineAQty+lineBQty;
    const maxQtyAll=Math.max(...[...lineA,...lineB].map(o=>o.qty),1);

    // 업체별 집계
    const chSummary={};
    confirmed.forEach(o=>{
      if(!chSummary[o.channel])chSummary[o.channel]={qty:0,cnt:0};
      chSummary[o.channel].qty+=o.qty;
      chSummary[o.channel].cnt+=1;
    });
    const chSummaryArr=Object.entries(chSummary).sort((a,b)=>b[1].qty-a[1].qty);

    // 글자 크기 자동 조절 — 건수 많을수록 작게
    const totalItems=lineA.length+lineB.length;
    const nameFontSize=totalItems>10?13:totalItems>6?15:17;
    const qtyFontSize=totalItems>10?16:totalItems>6?18:22;

    const LineCol=({label,accent,list})=>{
      const qtyColor=accent==="green"?DB_GREEN:DB_BLUE;
      const qtyDim=accent==="green"?DB_GREEN_DIM:DB_BLUE_DIM;
      const borderCol=accent==="green"?"rgba(0,255,136,.25)":"rgba(68,170,255,.25)";
      const bgCol=accent==="green"?"rgba(0,255,136,.04)":"rgba(68,170,255,.04)";
      const lineQty=list.reduce((s,o)=>s+o.qty,0);
      return(
        <div style={{flex:1,minWidth:0,display:"flex",flexDirection:"column",gap:8}}>
          {/* 라인 헤더 */}
          <div style={{background:bgCol,border:"1px solid "+borderCol,borderRadius:10,padding:"10px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div>
              <div style={{fontSize:18,fontWeight:900,color:qtyColor,letterSpacing:2}}>{label}</div>
              <div style={{fontSize:12,color:qtyDim}}>{list.length}건 확정</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:10,color:qtyDim,letterSpacing:1}}>총 수량</div>
              <div style={{fontSize:36,fontWeight:900,color:qtyColor,fontFamily:"monospace",lineHeight:1}}>{lineQty.toLocaleString()}<span style={{fontSize:12,color:qtyDim,marginLeft:3}}>개</span></div>
            </div>
          </div>
          {/* 건별 전체 목록 */}
          <div style={{background:"rgba(0,0,0,.3)",border:"1px solid "+borderCol,borderRadius:10,padding:"10px 14px",display:"flex",flexDirection:"column",gap:7}}>
            {list.length===0
              ?<div style={{color:qtyDim,fontSize:14,textAlign:"center",padding:"12px 0"}}>확정 없음</div>
              :list.map((o,i)=>{
                const ch=channels.find(c=>c.name===o.channel);
                const chBg=ch?.color||"#556655";
                const chBg2=ch?.color2||null;
                const chGrad=chBg2?`linear-gradient(90deg,${chBg} 50%,${chBg2} 50%)`:chBg;
                const rankColor=accent==="green"?DB_GREEN_DIM:DB_BLUE_DIM;
                return(
                  <div key={o.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",background:"rgba(255,255,255,.04)",borderRadius:7,border:"1px solid rgba(255,255,255,.06)"}}>
                    <span style={{width:20,fontSize:13,fontWeight:700,color:rankColor,fontFamily:"monospace",flexShrink:0}}>{i+1}</span>
                    <span style={{flex:1,fontSize:nameFontSize,fontWeight:700,color:"#d0e8d0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{pName(o.p_code)}</span>
                    <span title={chDisplay(o)} style={{background:chGrad,color:"#fff",border:"1px solid rgba(255,255,255,.4)",borderRadius:4,padding:"1px 8px",fontSize:11,fontWeight:700,whiteSpace:"normal",wordBreak:"keep-all",lineHeight:1.25,textAlign:"center",maxWidth:160,flexShrink:0}}>{chDisplay(o)}</span>
                    <div style={{width:80,height:7,background:"rgba(255,255,255,.07)",borderRadius:4,overflow:"hidden",flexShrink:0}}>
                      <div style={{height:"100%",width:Math.round(o.qty/maxQtyAll*100)+"%",background:`linear-gradient(90deg,${qtyDim},${qtyColor})`,borderRadius:4}}/>
                    </div>
                    <span style={{fontSize:qtyFontSize,fontWeight:900,color:qtyColor,fontFamily:"monospace",flexShrink:0,minWidth:45,textAlign:"right"}}>{o.qty.toLocaleString()}<span style={{fontSize:10,color:qtyDim,marginLeft:2}}>개</span></span>
                  </div>
                );
              })
            }
          </div>
        </div>
      );
    };

    return(
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {/* 상단 요약 */}
        <div style={{display:"flex",gap:10}}>
          <div style={{flex:1,background:"rgba(200,130,26,.1)",border:"1px solid rgba(200,130,26,.3)",borderRadius:10,padding:"10px 18px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{fontSize:12,color:"#c8a06a",fontWeight:700,letterSpacing:1}}>📦 오늘 전체 확정 수량</div>
            <div style={{fontSize:32,fontWeight:900,color:DB_AMBER,fontFamily:"monospace"}}>{totalQty.toLocaleString()}<span style={{fontSize:13,color:"#c8a06a",marginLeft:5}}>개</span></div>
          </div>
          <div style={{flex:1,background:"rgba(100,175,100,.08)",border:"1px solid rgba(100,175,100,.2)",borderRadius:10,padding:"10px 18px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{fontSize:12,color:"#6a9a6a",fontWeight:700,letterSpacing:1}}>✅ 오늘 완료</div>
            <div style={{fontSize:32,fontWeight:900,color:DB_GREEN,fontFamily:"monospace"}}>{allDone.length}<span style={{fontSize:13,color:"#6a9a6a",marginLeft:5}}>건</span></div>
          </div>
        </div>
        {/* 업체별 요약 */}
        {chSummaryArr.length>0&&(
          <div style={{background:"rgba(0,0,0,.3)",border:"1px solid rgba(255,255,255,.08)",borderRadius:10,padding:"10px 16px"}}>
            <div style={{fontSize:11,color:"#5a7a5a",letterSpacing:2,fontWeight:700,marginBottom:8}}>🏢 업체별 생산 남은 수량</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              {chSummaryArr.map(([name,stat])=>{
                const ch=channels.find(c=>c.name===name);
                const bg=ch?.color||"#556655";
                const bg2=ch?.color2||null;
                const grad=bg2?`linear-gradient(90deg,${bg} 50%,${bg2} 50%)`:bg;
                return(
                  <div key={name} style={{display:"flex",alignItems:"center",gap:8,background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.1)",borderRadius:8,padding:"6px 12px"}}>
                    <span style={{background:grad,color:"#fff",border:"2px solid rgba(255,255,255,.55)",borderRadius:5,padding:"2px 10px",fontSize:12,fontWeight:700,textShadow:"0 1px 2px rgba(0,0,0,.5)",whiteSpace:"nowrap"}}>{name}</span>
                    <div>
                      <div style={{fontSize:10,color:"#5a7a5a"}}>확정 수량</div>
                      <div style={{fontSize:20,fontWeight:900,color:DB_AMBER,fontFamily:"monospace",lineHeight:1}}>{stat.qty.toLocaleString()}<span style={{fontSize:11,color:"#8a7a4a",marginLeft:2}}>개</span></div>
                    </div>
                    <div style={{borderLeft:"1px solid rgba(255,255,255,.1)",paddingLeft:8}}>
                      <div style={{fontSize:10,color:"#5a7a5a"}}>건수</div>
                      <div style={{fontSize:15,fontWeight:700,color:"#a8b8a0",fontFamily:"monospace",lineHeight:1}}>{stat.cnt}건</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}
        {/* A/B 라인 — 건별 전체 표시 */}
        <div style={{display:"flex",gap:14,alignItems:"flex-start"}}>
          <LineCol label="🟢 A 라인" accent="green" list={lineA}/>
          <div style={{width:2,background:"linear-gradient(180deg,transparent,#3a4a3a,transparent)",alignSelf:"stretch",flexShrink:0}}/>
          <LineCol label="🔵 B 라인" accent="blue" list={lineB}/>
        </div>
      </div>
    );
  };

  return(
    <div style={{background:"#0a0c0a",borderRadius:14,position:"relative",border:"1px solid #1a2a1a",boxShadow:"0 0 40px rgba(0,0,0,.8)",minHeight:"calc(100vh - 130px)"}}>
      <div style={{position:"absolute",inset:0,backgroundImage:"repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0px,rgba(0,0,0,.06) 1px,transparent 1px,transparent 3px)",pointerEvents:"none",zIndex:1,borderRadius:14}}/>
      {/* 전광판 헤더 — sticky로 스크롤해도 고정 */}
      <div style={{position:"sticky",top:0,zIndex:20,background:"linear-gradient(90deg,#0a0c0a,#0f1a0f,#0a0c0a)",borderBottom:"2px solid "+DB_GREEN_DIM,padding:"7px 18px",display:"flex",alignItems:"center",justifyContent:"space-between",borderRadius:"14px 14px 0 0"}}>
        <div>
          <div style={{fontSize:13,fontWeight:700,color:DB_GREEN,letterSpacing:2}}>☕ 드립백 생산 전광판</div>
          <div style={{fontSize:10,color:"#3a5a3a",letterSpacing:1}}>MOMOS COFFEE · 2차가공생산팀 · {todayDate}</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <span style={{background:"rgba(0,255,136,.08)",border:"1px solid rgba(0,255,136,.15)",borderRadius:6,padding:"3px 12px",fontSize:11,color:"#3a6a3a",fontWeight:700}}>
            🟢 A라인 {lineA.length}건
          </span>
          <span style={{background:"rgba(68,170,255,.08)",border:"1px solid rgba(68,170,255,.15)",borderRadius:6,padding:"3px 12px",fontSize:11,color:"#3a5a8a",fontWeight:700}}>
            🔵 B라인 {lineB.length}건
          </span>
          <span style={{fontSize:11,color:"#3a5a3a",fontFamily:"monospace",background:"rgba(0,0,0,.3)",border:"1px solid #2a3a2a",borderRadius:6,padding:"3px 10px"}}>
            {dbScreen==="order"?"📋 생산순서":"📊 현황"} {dbScreen==="order"?ORDER_SEC:STATUS_SEC}s
          </span>
          <button onClick={()=>{setDbScreen(s=>s==="order"?"status":"order");}}
            style={{background:"rgba(255,255,255,.08)",border:"1px solid rgba(255,255,255,.15)",borderRadius:6,color:"#a8b8a0",padding:"3px 12px",fontSize:11,cursor:"pointer",fontFamily:"inherit",fontWeight:700,letterSpacing:.5}}>
            {dbScreen==="order"?"📊 현황 보기":"📋 순서 보기"}
          </button>
        </div>
      </div>
      {/* 화면 영역 — 자유롭게 늘어남 */}
      <div style={{padding:"10px 14px",position:"relative",zIndex:2}}>
        {dbScreen==="order"?<ScreenOrder/>:<ScreenStatus/>}
      </div>
      {/* 전환 진행바 */}
      <div style={{height:3,background:"#1a2a1a",borderRadius:"0 0 14px 14px",position:"sticky",bottom:0,zIndex:20}}>
        <div style={{height:"100%",width:dbFillPct+"%",background:`linear-gradient(90deg,${DB_GREEN_DIM},${DB_GREEN})`,transition:"width .08s linear",borderRadius:"0 0 0 14px"}}/>
      </div>
    </div>
  );
}

// ══ 로그인 화면 (drip2_users 방식) ══════════
const MASTER_CODE="momos1!";
function LoginScreen({onLogin}){
  const[mode,setMode]=useState("login"); // login | signup | changepw
  const[userId,setUserId]=useState("");
  const[pw,setPw]=useState("");
  const[newPw,setNewPw]=useState("");
  const[confirmPw,setConfirmPw]=useState("");
  const[masterCode,setMasterCode]=useState("");
  const[msg,setMsg]=useState(null); // {type:"ok"|"err", text}
  const[loading,setLoading]=useState(false);
  const inpS={width:"100%",padding:"11px 14px",borderRadius:10,fontSize:14,background:"rgba(255,255,255,.08)",border:"1px solid #7a8a7055",color:"#f0ede8",outline:"none",fontFamily:"inherit"};
  const resetFields=()=>{setUserId("");setPw("");setNewPw("");setConfirmPw("");setMasterCode("");setMsg(null);};
  const switchMode=m=>{resetFields();setMode(m);};

  // ── 로그인
  const doLogin=async()=>{
    if(!userId||!pw){setMsg({type:"err",text:"아이디와 비밀번호를 입력하세요."});return;}
    setLoading(true);setMsg(null);
    const{data,error}=await sb.from("drip2_users").select("*").eq("user_id",userId.trim()).single();
    setLoading(false);
    if(error||!data){setMsg({type:"err",text:"아이디 또는 비밀번호가 틀렸습니다."});return;}
    if(data.password!==pw){setMsg({type:"err",text:"아이디 또는 비밀번호가 틀렸습니다."});return;}
    onLogin({id:data.id,user_id:data.user_id,name:data.name||data.user_id});
  };

  // ── 계정 만들기
  const doSignup=async()=>{
    if(masterCode!==MASTER_CODE){setMsg({type:"err",text:"마스터 코드가 틀렸습니다."});return;}
    if(!userId.trim()||!pw){setMsg({type:"err",text:"아이디와 비밀번호를 입력하세요."});return;}
    if(pw!==confirmPw){setMsg({type:"err",text:"비밀번호가 일치하지 않습니다."});return;}
    if(pw.length<4){setMsg({type:"err",text:"비밀번호는 4자 이상이어야 합니다."});return;}
    setLoading(true);setMsg(null);
    const{data:exist}=await sb.from("drip2_users").select("id").eq("user_id",userId.trim()).maybeSingle();
    if(exist){setLoading(false);setMsg({type:"err",text:"이미 사용 중인 아이디입니다."});return;}
    const{error}=await sb.from("drip2_users").insert({user_id:userId.trim(),password:pw});
    setLoading(false);
    if(error){setMsg({type:"err",text:"생성 오류: "+error.message});return;}
    setMsg({type:"ok",text:"✅ 계정이 생성되었습니다. 로그인하세요."});
    setTimeout(()=>switchMode("login"),1400);
  };

  // ── 비밀번호 변경
  const doChangePw=async()=>{
    if(masterCode!==MASTER_CODE){setMsg({type:"err",text:"마스터 코드가 틀렸습니다."});return;}
    if(!userId.trim()||!newPw){setMsg({type:"err",text:"아이디와 새 비밀번호를 입력하세요."});return;}
    if(newPw!==confirmPw){setMsg({type:"err",text:"새 비밀번호가 일치하지 않습니다."});return;}
    if(newPw.length<4){setMsg({type:"err",text:"비밀번호는 4자 이상이어야 합니다."});return;}
    setLoading(true);setMsg(null);
    const{data:exist}=await sb.from("drip2_users").select("id").eq("user_id",userId.trim()).maybeSingle();
    if(!exist){setLoading(false);setMsg({type:"err",text:"존재하지 않는 아이디입니다."});return;}
    const{error}=await sb.from("drip2_users").update({password:newPw}).eq("user_id",userId.trim());
    setLoading(false);
    if(error){setMsg({type:"err",text:"변경 오류: "+error.message});return;}
    setMsg({type:"ok",text:"✅ 비밀번호가 변경되었습니다."});
    setTimeout(()=>switchMode("login"),1400);
  };

  const lbl={fontSize:12,color:"#c8a06a",marginBottom:5};
  const onKey=e=>e.key==="Enter"&&(mode==="login"?doLogin():mode==="signup"?doSignup():doChangePw());

  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#3a3a38"}}>
      <div style={{background:"#2e2e2c",border:"2px solid #6a8a5a",borderRadius:20,padding:"36px 36px 32px",width:"100%",maxWidth:400,boxShadow:"0 8px 40px rgba(0,0,0,.5)"}}>

          <div style={{fontSize:12,color:"#6fcf97",marginTop:4}}>제품생산2팀 완제품포장</div>
        </div>

        {/* 로그인 폼 */}
        {mode==="login"&&(<>
          <div style={{marginBottom:13}}><div style={lbl}>아이디</div>
            <input autoFocus value={userId} onChange={e=>setUserId(e.target.value)} onKeyDown={onKey} placeholder="아이디 입력" style={inpS}/></div>
          <div style={{marginBottom:16}}><div style={lbl}>비밀번호</div>
            <input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={onKey} placeholder="비밀번호 입력" style={inpS}/></div>
          {msg&&<div style={{padding:"8px 12px",borderRadius:8,fontSize:13,marginBottom:12,background:msg.type==="ok"?"rgba(76,175,80,.15)":"rgba(220,70,70,.15)",border:"1px solid "+(msg.type==="ok"?"#4caf5055":"#e0707055"),color:msg.type==="ok"?"#6fcf97":"#f08080"}}>{msg.text}</div>}
          <button onClick={doLogin} disabled={loading} style={{width:"100%",padding:"12px",borderRadius:10,border:"none",background:"linear-gradient(135deg,#5a7a4a,#7a9a6a)",color:"#fff",fontWeight:700,fontSize:15,cursor:"pointer",fontFamily:"inherit",opacity:loading?.6:1}}>
            {loading?"로그인 중...":"로그인"}
          </button>
          {/* 하단 링크 */}
          <div style={{marginTop:16,display:"flex",flexDirection:"column",gap:4,alignItems:"center"}}>
            <span onClick={()=>switchMode("changepw")} style={{fontSize:12,color:"#8a9a88",cursor:"pointer",textDecoration:"underline",textUnderlineOffset:3}}>비밀번호를 잊으셨나요?</span>
            <span onClick={()=>switchMode("signup")} style={{fontSize:12,color:"#8a9a88",cursor:"pointer",textDecoration:"underline",textUnderlineOffset:3}}>+ 사용자 추가 (최초 설정)</span>
          </div>
        </>)}

        {/* 계정 만들기 */}
        {mode==="signup"&&(<>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:18}}>
            <span onClick={()=>switchMode("login")} style={{fontSize:13,color:"#8a9a88",cursor:"pointer"}}>← 돌아가기</span>
            <span style={{fontSize:15,fontWeight:700,color:"#c8ddb8"}}>사용자 추가</span>
          </div>
          <div style={{marginBottom:13}}><div style={lbl}>마스터 코드</div>
            <input autoFocus type="password" value={masterCode} onChange={e=>setMasterCode(e.target.value)} onKeyDown={onKey} placeholder="마스터 코드 입력" style={inpS}/></div>
          <div style={{marginBottom:13}}><div style={lbl}>사용할 아이디</div>
            <input value={userId} onChange={e=>setUserId(e.target.value)} onKeyDown={onKey} placeholder="영문/숫자 권장" style={inpS}/></div>
          <div style={{marginBottom:13}}><div style={lbl}>비밀번호</div>
            <input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={onKey} placeholder="4자 이상" style={inpS}/></div>
          <div style={{marginBottom:13}}><div style={lbl}>비밀번호 확인</div>
            <input type="password" value={confirmPw} onChange={e=>setConfirmPw(e.target.value)} onKeyDown={onKey} placeholder="비밀번호 재입력" style={inpS}/></div>
          {msg&&<div style={{padding:"8px 12px",borderRadius:8,fontSize:13,marginBottom:12,background:msg.type==="ok"?"rgba(76,175,80,.15)":"rgba(220,70,70,.15)",border:"1px solid "+(msg.type==="ok"?"#4caf5055":"#e0707055"),color:msg.type==="ok"?"#6fcf97":"#f08080"}}>{msg.text}</div>}
          <button onClick={doSignup} disabled={loading} style={{width:"100%",padding:"12px",borderRadius:10,border:"none",background:"linear-gradient(135deg,#5a7a4a,#7a9a6a)",color:"#fff",fontWeight:700,fontSize:15,cursor:"pointer",fontFamily:"inherit",opacity:loading?.6:1}}>
            {loading?"처리 중...":"계정 만들기"}
          </button>
        </>)}

        {/* 비밀번호 변경 */}
        {mode==="changepw"&&(<>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:18}}>
            <span onClick={()=>switchMode("login")} style={{fontSize:13,color:"#8a9a88",cursor:"pointer"}}>← 돌아가기</span>
            <span style={{fontSize:15,fontWeight:700,color:"#c8ddb8"}}>비밀번호 변경</span>
          </div>
          <div style={{marginBottom:13}}><div style={lbl}>마스터 코드</div>
            <input autoFocus type="password" value={masterCode} onChange={e=>setMasterCode(e.target.value)} onKeyDown={onKey} placeholder="마스터 코드 입력" style={inpS}/></div>
          <div style={{marginBottom:13}}><div style={lbl}>아이디</div>
            <input value={userId} onChange={e=>setUserId(e.target.value)} onKeyDown={onKey} placeholder="변경할 계정 아이디" style={inpS}/></div>
          <div style={{marginBottom:13}}><div style={lbl}>새 비밀번호</div>
            <input type="password" value={newPw} onChange={e=>setNewPw(e.target.value)} onKeyDown={onKey} placeholder="4자 이상" style={inpS}/></div>
          <div style={{marginBottom:13}}><div style={lbl}>새 비밀번호 확인</div>
            <input type="password" value={confirmPw} onChange={e=>setConfirmPw(e.target.value)} onKeyDown={onKey} placeholder="새 비밀번호 재입력" style={inpS}/></div>
          {msg&&<div style={{padding:"8px 12px",borderRadius:8,fontSize:13,marginBottom:12,background:msg.type==="ok"?"rgba(76,175,80,.15)":"rgba(220,70,70,.15)",border:"1px solid "+(msg.type==="ok"?"#4caf5055":"#e0707055"),color:msg.type==="ok"?"#6fcf97":"#f08080"}}>{msg.text}</div>}
          <button onClick={doChangePw} disabled={loading} style={{width:"100%",padding:"12px",borderRadius:10,border:"none",background:"linear-gradient(135deg,#5a7a4a,#7a9a6a)",color:"#fff",fontWeight:700,fontSize:15,cursor:"pointer",fontFamily:"inherit",opacity:loading?.6:1}}>
            {loading?"처리 중...":"비밀번호 변경"}
          </button>
        </>)}
      </div>
    </div>
  );
}

// ══ 완제품 검색 선택 컴포넌트 ═══════════════
function ProductSearchSelect({pMaster,value,onChange}){
  const[query,setQuery]=useState("");
  const[open,setOpen]=useState(false);
  const ref=useRef(null);
  const inputRef=useRef(null);
  const selected=pMaster.find(p=>p.code===value);

  useEffect(()=>{
    const handler=e=>{if(ref.current&&!ref.current.contains(e.target)){setOpen(false);setQuery("");}};
    document.addEventListener("mousedown",handler);
    return()=>document.removeEventListener("mousedown",handler);
  },[]);

  const filtered=query.trim()
    ?pMaster.filter(p=>p.name.includes(query)||p.code.toLowerCase().includes(query.toLowerCase()))
    :pMaster;

  const baseStyle={background:"rgba(255,255,255,.1)",border:"1px solid #7a8a7055",borderRadius:"6px 6px 0 0",color:"#f0e6d3",padding:"7px 10px",fontSize:13,outline:"none",fontFamily:"inherit",width:"100%",boxSizing:"border-box"};

  return(
    <div ref={ref} style={{position:"relative",minWidth:240}}>
      {/* 입력창 */}
      <div style={{position:"relative"}}>
        <input
          ref={inputRef}
          type="text"
          value={open?query:(selected?`[${selected.code}] ${selected.name}`:"")}
          placeholder="제품 검색 또는 선택..."
          onChange={e=>{setQuery(e.target.value);setOpen(true);}}
          onFocus={()=>{setOpen(true);setQuery("");}}
          style={{...baseStyle,
            borderRadius:open?"6px 6px 0 0":"6px",
            borderBottom:open?"1px solid #c8821a55":"1px solid #7a8a7055",
            paddingRight:28}}
        />
        <span style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",color:"#7a8a70",fontSize:11,pointerEvents:"none"}}>{open?"▲":"▼"}</span>
      </div>
      {/* 드롭다운 리스트 */}
      {open&&(
        <div style={{position:"absolute",top:"100%",left:0,right:0,zIndex:9999,
          background:"#1a221a",border:"1px solid #c8821a55",borderTop:"none",borderRadius:"0 0 8px 8px",
          maxHeight:220,overflowY:"auto",boxShadow:"0 8px 24px rgba(0,0,0,.6)"}}>
          {filtered.length===0
            ?<div style={{padding:"10px 14px",color:"#6a7a68",fontSize:13}}>검색 결과 없음</div>
            :filtered.map(p=>(
              <div key={p.code}
                onMouseDown={e=>{e.preventDefault();onChange(p.code);setOpen(false);setQuery("");}}
                style={{padding:"8px 14px",cursor:"pointer",
                  borderBottom:"1px solid rgba(255,255,255,.04)",
                  display:"flex",alignItems:"center",gap:8,
                  background:value===p.code?"rgba(200,130,26,.18)":"transparent",
                  transition:"background .1s"}}
                onMouseEnter={e=>e.currentTarget.style.background=value===p.code?"rgba(200,130,26,.25)":"rgba(255,255,255,.07)"}
                onMouseLeave={e=>e.currentTarget.style.background=value===p.code?"rgba(200,130,26,.18)":"transparent"}>
                <span style={{fontSize:11,color:"#9a7050",fontFamily:"monospace",flexShrink:0}}>[{p.code}]</span>
                <span style={{fontSize:13,fontWeight:600,color:"#f5c97a",flex:1}}>{p.name}</span>
                {value===p.code&&<span style={{fontSize:12,color:"#c8821a",flexShrink:0}}>✓</span>}
              </div>
            ))
          }
        </div>
      )}
    </div>
  );
}

// ══ OrderCard — 수정 시 업체 드롭다운 지원 ═
function OrderCard({order,pName,sName,fmtDate,invest,delOrder,updateOrder,confirmOrder,completeOrder,revertOrder,cancelOrder,addExtraQty,markErpDone,primaryBtn,delBtn,moveOrder,isFirst,isLast,channels,shipTypeNames}){
  const[editing,setEditing]=useState(false);
  const[qty,setQty]=useState(String(order.qty));
  const[editChId,setEditChId]=useState("");
  const[editLine,setEditLine]=useState(order.line||"A");
  const[editVendor,setEditVendor]=useState(order.bulk_vendor||"");
  const[editShip,setEditShip]=useState({date:"",type:"",note:""});
  const inpS={background:"rgba(255,255,255,.1)",border:"1px solid #7a8a7055",borderRadius:6,color:"#f0e6d3",padding:"5px 8px",fontSize:13,outline:"none",fontFamily:"inherit"};
  const activeChannels=channels.filter(c=>c.active!==false);
  const canEditMain=order.status==="대기"; // 수량·업체·라인은 대기 상태에서만, 출고정보는 언제든 수정 가능
  const startEdit=()=>{
    const cur=channels.find(c=>c.name===order.channel);
    setEditChId(cur?String(cur.id):activeChannels[0]?String(activeChannels[0].id):"");
    setQty(String(order.qty));setEditLine(order.line||"A");setEditVendor(order.bulk_vendor||"");
    setEditShip({date:fmtShipDate(order.ship_date),type:order.ship_type||"",note:order.ship_note||""});
    setEditing(true);
  };
  const editCh=canEditMain?channels.find(c=>String(c.id)===String(editChId)):channels.find(c=>c.name===order.channel);
  const editFlags=chFlags(editCh);
  const saveEdit=async()=>{
    const chName=editCh?.name||order.channel;
    if(editFlags.vendor&&!editVendor.trim())return alert("납품 업체명을 입력해주세요.");
    const ship=buildShipFields(editCh,{vendor:editVendor,date:editShip.date,type:editShip.type,note:editShip.note});
    const patch=canEditMain?{qty:parseInt(qty)||order.qty,channel:chName,line:editLine||"A",...ship}:ship;
    const ok=await updateOrder(order.id,patch);
    if(ok!==false)setEditing(false);
  };
  const moveBtn={background:"rgba(255,255,255,.08)",border:"1px solid #7a8a7044",borderRadius:5,color:"#a8b8a0",padding:"3px 7px",fontSize:13,cursor:"pointer",fontFamily:"inherit",lineHeight:1};
  const ch=channels.find(c=>c.name===order.channel);
  const lineColor=order.line==="B"?"#5a8fc0":"#6a9a5a";
  const lineBg=order.line==="B"?"rgba(50,100,180,.25)":"rgba(60,120,60,.25)";
  const lineBorder=order.line==="B"?"#5a8fc055":"#6a9a5a55";

  // 3단계 색상
  const isConfirmed=order.status==="확정";
  const isDone=order.status==="완료";
  const isPlan=order.status==="대기"||order.status==="투입완료";
  const borderColor=isDone?"#6aaf6a55":isConfirmed?"#c8a06a55":order.status==="투입완료"?"#5a8fc055":"#7a8a7044";
  const bgColor=isDone?"rgba(60,100,55,.2)":isConfirmed?"rgba(160,110,20,.18)":order.status==="투입완료"?"rgba(50,80,120,.2)":"rgba(255,255,255,.06)";

  const statusChip=isDone
    ?<span style={{background:"rgba(60,160,60,.3)",border:"1px solid #6aaf6a77",color:"#6fcf97",borderRadius:6,padding:"2px 9px",fontSize:11,fontWeight:700}}>✅ 완료</span>
    :isConfirmed
    ?<span style={{background:"rgba(160,110,20,.35)",border:"1px solid #c8a06a77",color:"#f5c97a",borderRadius:6,padding:"2px 9px",fontSize:11,fontWeight:700}}>📋 생산확정</span>
    :order.status==="투입완료"
    ?<span style={{background:"rgba(50,100,180,.3)",border:"1px solid #5a8fc077",color:"#8ac8f0",borderRadius:6,padding:"2px 9px",fontSize:11,fontWeight:700}}>🔵 투입완료</span>
    :<span style={{background:"rgba(200,130,26,.2)",border:"1px solid #c8821a55",color:"#f2c94c",borderRadius:6,padding:"2px 9px",fontSize:11,fontWeight:700}}>⏳ 대기</span>;

  return(
    <div style={{background:bgColor,border:"1px solid "+borderColor,borderRadius:12,padding:"13px 16px",marginBottom:10}}>
      <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        {isPlan&&moveOrder&&(
          <div style={{display:"flex",flexDirection:"column",gap:2}}>
            <button onClick={()=>moveOrder(order.id,-1)} disabled={isFirst} style={{...moveBtn,opacity:isFirst?.3:1}}>▲</button>
            <button onClick={()=>moveOrder(order.id,1)} disabled={isLast} style={{...moveBtn,opacity:isLast?.3:1}}>▼</button>
          </div>
        )}
        {order.plan_date&&<span style={{background:"rgba(90,140,200,.25)",border:"1px solid #5a8fc055",color:"#8ac8d8",borderRadius:6,padding:"2px 9px",fontSize:11,fontWeight:700,whiteSpace:"nowrap"}}>📅 {order.plan_date}</span>}
        <span style={{background:"#5a7a4a",color:"#fff",borderRadius:6,padding:"2px 9px",fontSize:11,fontWeight:700}}>P{order.priority}</span>
        {/* 라인 뱃지 */}
        <span style={{background:lineBg,border:"1px solid "+lineBorder,color:lineColor,borderRadius:6,padding:"2px 9px",fontSize:12,fontWeight:900,letterSpacing:1}}>
          {order.line==="B"?"🔵 B라인":"🟢 A라인"}
        </span>
        <span style={{color:"#9a7050",fontSize:12}}>[{order.p_code}]</span>
        <span style={{fontWeight:700,fontSize:15,color:"#f5c97a"}}>{pName(order.p_code)}</span>
        {order.channel&&<ChannelBadge name={order.channel} color={ch?.color} color2={ch?.color2} size="sm"/>}
        {order.bulk_vendor&&<span style={{background:"rgba(242,201,76,.15)",border:"1px solid #f2c94c66",color:"#f2c94c",borderRadius:6,padding:"2px 9px",fontSize:12,fontWeight:700,wordBreak:"keep-all"}}>🏢 {order.bulk_vendor}</span>}
        {statusChip}
        {isDone&&order.completed_by&&<span style={{background:"rgba(76,175,80,.15)",border:"1px solid #4caf5044",color:"#a8d8a0",borderRadius:6,padding:"2px 9px",fontSize:11,fontWeight:600}}>👤 {order.completed_by}</span>}
        {isDone&&!order.erp_done&&<span style={{background:"rgba(220,120,40,.2)",border:"1px solid #d0803055",color:"#f0b070",borderRadius:6,padding:"2px 9px",fontSize:11,fontWeight:700}}>⚠ ERP 미입력</span>}
        {editing&&canEditMain?(
          <>
            <input type="number" value={qty} onChange={e=>setQty(e.target.value)} style={{...inpS,width:70}}/>
            <span style={{color:"#aaa",fontSize:12}}>개</span>
            <select value={editChId} onChange={e=>setEditChId(e.target.value)} style={{...inpS,cursor:"pointer"}}>
              {activeChannels.map(c=><option key={c.id} value={String(c.id)}>{c.name}</option>)}
            </select>
            <select value={editLine} onChange={e=>setEditLine(e.target.value)} style={{...inpS,cursor:"pointer",width:90}}>
              <option value="A">🟢 A라인</option>
              <option value="B">🔵 B라인</option>
            </select>
          </>
        ):(
          <span style={{color:"#e0c090"}}>{order.qty}개</span>
        )}
        <div style={{marginLeft:"auto",display:"flex",gap:8,flexWrap:"wrap"}}>
          {!editing&&<button onClick={startEdit} style={{background:"rgba(200,130,26,.2)",border:"1px solid #c8821a55",color:"#c8a06a",borderRadius:6,padding:"4px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>{canEditMain?"✏️ 수정":"✏️ 출고정보"}</button>}
          {order.status==="대기"&&!editing&&<button onClick={()=>invest(order.id)} style={{...primaryBtn,fontSize:13,padding:"5px 14px"}}>낱개 투입</button>}
          {order.status==="투입완료"&&!editing&&<button onClick={()=>confirmOrder(order.id)} style={{background:"linear-gradient(135deg,#7a6020,#b08a30)",border:"1px solid #c8a06a66",color:"#f5e8a0",borderRadius:6,padding:"5px 14px",fontSize:13,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>📋 생산확정</button>}
          {order.status==="투입완료"&&!editing&&<button onClick={()=>revertOrder(order.id)} style={{background:"rgba(90,130,200,.2)",border:"1px solid #5a8fc055",color:"#8ac8d8",borderRadius:6,padding:"5px 12px",fontSize:12,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>↩ 투입회수</button>}
          {isConfirmed&&!editing&&addExtraQty&&<button onClick={()=>addExtraQty(order.id)} style={{background:"rgba(200,130,26,.22)",border:"1px solid #c8821a66",color:"#f5c97a",borderRadius:6,padding:"5px 12px",fontSize:12,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>➕ 추가생산</button>}
          {isConfirmed&&!editing&&<button onClick={()=>completeOrder(order.id)} style={{background:"#2d6a2d",border:"1px solid #4caf5066",color:"#6fcf97",borderRadius:6,padding:"5px 14px",fontSize:13,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>✅ 완료</button>}
          {/* ERP 입력완료 */}
          {isDone&&!editing&&(order.erp_done
            ?<span style={{background:"rgba(90,140,220,.2)",border:"1px solid #5a8fc055",color:"#8ac8f0",borderRadius:6,padding:"5px 12px",fontSize:12,fontWeight:700}}>🖥 ERP 완료</span>
            :<button onClick={()=>markErpDone&&markErpDone(order.id)} style={{background:"linear-gradient(135deg,#4a5a8a,#6a7ac0)",border:"1px solid #5a8fc066",color:"#eaf0ff",borderRadius:6,padding:"5px 14px",fontSize:13,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>🖥 ERP 입력완료</button>
          )}
          {/* 복귀 버튼 */}
          {(isDone||isConfirmed)&&!editing&&<button onClick={()=>revertOrder(order.id)} style={{background:"rgba(90,130,200,.2)",border:"1px solid #5a8fc055",color:"#8ac8d8",borderRadius:6,padding:"4px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>🔄 복귀</button>}
          {/* 생산취소/삭제: 완료·확정 상태에서 재고 복구 + 로그삭제 + 주문삭제 */}
          {(isDone||isConfirmed)&&!editing&&<button onClick={()=>cancelOrder&&cancelOrder(order.id)} style={{background:"rgba(160,40,40,.3)",border:"1px solid #c0404055",color:"#ff9090",borderRadius:6,padding:"4px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>{isDone?"🚫 생산취소":"🗑 삭제"}</button>}
          {isPlan&&!editing&&<button onClick={()=>delOrder(order.id)} style={delBtn}>✕</button>}
        </div>
      </div>
      {/* 출고정보 표시 (수정 중이 아닐 때) */}
      {!editing&&(order.ship_date||order.ship_type||order.ship_note)&&(
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginTop:8,padding:"6px 10px",background:"rgba(242,201,76,.06)",border:"1px dashed #f2c94c44",borderRadius:8,fontSize:12}}>
          {order.ship_date&&<span style={{color:"#f5c97a",fontWeight:700}}>📅 출고일 {fmtShipDate(order.ship_date)}</span>}
          {order.ship_type&&<span style={{background:"rgba(90,140,200,.2)",border:"1px solid #5a8fc055",color:"#8ac8f0",borderRadius:6,padding:"1px 8px",fontWeight:700}}>🚚 {order.ship_type}</span>}
          {order.ship_note&&<span style={{color:"#e8dcc0",wordBreak:"keep-all"}}>📝 {order.ship_note}</span>}
        </div>
      )}
      {/* 수정 모드: 출고정보 입력 (업체 설정에서 사용으로 켠 항목만) */}
      {editing&&(
        <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end",marginTop:10,padding:"10px 12px",background:"rgba(200,130,26,.08)",border:"1px solid #c8821a44",borderRadius:8}}>
          {editFlags.vendor&&(
            <div><div style={{fontSize:11,color:"#f2c94c",marginBottom:3}}>🏢 납품 업체명 *</div>
              <input type="text" value={editVendor} onChange={e=>setEditVendor(e.target.value)} placeholder="납품 업체명" style={{...inpS,width:150,border:"1px solid #f2c94c88"}}/></div>
          )}
          {editFlags.date&&(
            <div><div style={{fontSize:11,color:"#c8a06a",marginBottom:3}}>📅 출고일</div>
              <input type="date" value={editShip.date} onChange={e=>setEditShip(s=>({...s,date:e.target.value}))} style={{...inpS,width:150}}/></div>
          )}
          {editFlags.type&&(
            <div><div style={{fontSize:11,color:"#c8a06a",marginBottom:3}}>🚚 배송구분</div>
              <ShipTypeSelect value={editShip.type} onChange={v=>setEditShip(s=>({...s,type:v}))} types={shipTypeNames} style={{...inpS,width:130}}/></div>
          )}
          {editFlags.note&&(
            <div style={{flex:"1 1 200px"}}><div style={{fontSize:11,color:"#c8a06a",marginBottom:3}}>📝 비고</div>
              <input type="text" value={editShip.note} onChange={e=>setEditShip(s=>({...s,note:e.target.value}))} placeholder="비고" style={{...inpS,width:"100%",boxSizing:"border-box"}}/></div>
          )}
          {!editFlags.vendor&&!editFlags.date&&!editFlags.type&&!editFlags.note&&<span style={{fontSize:12,color:"#8a9a88"}}>이 업체는 출고 추가정보를 사용하지 않아요. (설정 → 출고 업체 관리)</span>}
          <div style={{display:"flex",gap:6,marginLeft:"auto"}}>
            <button onClick={saveEdit} style={{...primaryBtn,fontSize:12,padding:"5px 14px"}}>저장</button>
            <button onClick={()=>setEditing(false)} style={{...delBtn,fontSize:12,padding:"5px 10px"}}>취소</button>
          </div>
        </div>
      )}
      {(order.status==="완료"||order.status==="투입완료"||order.status==="확정")&&order.detail&&(
        <div style={{marginTop:10,background:"rgba(0,0,0,.2)",borderRadius:8,padding:"12px 14px",fontSize:13}}>
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12,padding:"8px 12px",background:"rgba(76,175,80,.12)",borderRadius:8,border:"1px solid #4caf5033",flexWrap:"wrap"}}>
            <span style={{color:"#6fcf97",fontWeight:700,fontSize:14}}>📦 {pName(order.p_code)}</span>
            <span style={{color:"#6fcf97",fontSize:13}}>소비기한</span>
            <span style={{color:"#6fcf97",fontWeight:700,fontSize:16,background:"rgba(76,175,80,.2)",padding:"2px 10px",borderRadius:6}}>{fmtDate(order.detail.finExp)}</span>
            {order.detail.lot&&<span style={{color:"#f5c97a",fontWeight:700,fontSize:15,background:"rgba(200,130,26,.25)",padding:"2px 10px",borderRadius:6}}>LOT {order.detail.lot}</span>}
            {order.detail.hasPending&&<span style={{fontSize:11,color:"#f2c94c",background:"rgba(242,201,76,.15)",border:"1px solid #f2c94c44",borderRadius:4,padding:"2px 7px"}}>⚠️ 입고예정 포함</span>}
          </div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {(order.detail.details||[]).map((c,i)=>{
              const exp=c.expiry||null;const isMin=exp&&exp===order.detail.finExp;
              return(<div key={i} style={{background:isMin?"rgba(200,80,80,.18)":"rgba(200,130,26,.14)",border:"1px solid "+(isMin?"#e0606066":"#c8821a33"),borderRadius:8,padding:"7px 12px",fontSize:12,minWidth:180}}>
                <div style={{color:"#f5c97a",fontWeight:700,marginBottom:4}}><span style={{color:"#9a7050",fontSize:11,marginRight:4}}>[{c.sCode}]</span>{sName(c.sCode)}<span style={{color:"#c8a06a",marginLeft:6,fontWeight:400}}>총 {c.total}개</span></div>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}><span style={{color:"#aaa",fontSize:11}}>소비기한</span><span style={{color:isMin?"#e08080":"#8ecf90",fontWeight:700,fontSize:13}}>{fmtDate(exp)}</span>{isMin&&<span style={{fontSize:10,color:"#e08080",background:"rgba(200,80,80,.2)",border:"1px solid #e0606044",borderRadius:4,padding:"1px 5px"}}>기준</span>}</div>
                {(c.used||[]).length>1&&(<div style={{borderTop:"1px solid #c8821a22",paddingTop:4,marginTop:2}}>{(c.used||[]).map((u,j)=>(<div key={j} style={{display:"flex",justifyContent:"space-between",color:"#9a8060",fontSize:11,padding:"1px 0"}}><span>{fmtDate(u.expiry)}</span><span style={{color:"#c8a06a"}}>{u.qty}개</span></div>))}</div>)}
              </div>);
            })}
          </div>
        </div>
      )}
    </div>
  );
}

// ══ 분석 탭 유틸 ══════════════════════════
function periodRange(type,base,customFrom,customTo){
  if(type==="특정기간")return{from:customFrom||base,to:customTo||base};
  const d=new Date(base);
  if(type==="일별")return{from:base,to:base};
  if(type==="년별"){
    const y=d.getUTCFullYear();
    return{from:y+"-01-01",to:y+"-12-31"};
  }
  // 월별 (기본)

function TrendSvgChart({data,color="#6fcf97",unit="",height=170,selected,onSelect,notedDates}){
  const W=680,H=height,PAD=32;

  const validVals=data.filter(d=>!d.missing).map(d=>d.value);
  const max=Math.max(1,...(validVals.length?validVals:[1]));
  const min=Math.min(0,...(validVals.length?validVals:[0]));
  const range=max-min||1;
  const stepX=data.length>1?(W-PAD*2)/(data.length-1):0;
  const pts=data.map((d,i)=>{
    const x=PAD+stepX*i;
    const y=d.missing?(H-PAD):H-PAD-((d.value-min)/range)*(H-PAD*2);
    return{x,y,...d};
  });
  const validPts=pts.filter(p=>!p.missing);
  const path=validPts.map((p,i)=>(i===0?"M":"L")+p.x.toFixed(1)+","+p.y.toFixed(1)).join(" ");
  const areaPath=validPts.length?path+" L"+validPts[validPts.length-1].x.toFixed(1)+","+(H-PAD)+" L"+validPts[0].x.toFixed(1)+","+(H-PAD)+" Z":"";

    <div style={{width:"100%",overflowX:"auto"}}>
      <svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",height,minWidth:Math.max(360,data.length*40)}}>

        {areaPath&&<path d={areaPath} fill={color} opacity="0.12" stroke="none"/>}
        {path&&<path d={path} fill="none" stroke={color} strokeWidth="2.5"/>}

              <circle cx={p.x} cy={p.y} r="12" fill="transparent"/>
              <circle cx={p.x} cy={p.y} r={isSel?4.5:3.5} fill={isSel?"#e05050":color}/>

              <text x={p.x} y={p.y-17} fontSize="10" fill="#e8f0e0" textAnchor="middle" fontWeight="700">{p.value.toLocaleString(undefined,{maximumFractionDigits:1})}{unit}</text>
              {p.sub!=null&&<text x={p.x} y={p.y-6} fontSize="8.5" fill="#a8b8a0" textAnchor="middle">{p.sub.toLocaleString(undefined,{maximumFractionDigits:1})}h</text>}

  if(!data.length)return<div style={{color:"#8a9a88",fontSize:13,textAlign:"center",padding:20}}>데이터가 없습니다.</div>;

const salesNorm=v=>String(v||"").replace(/[（]/g,"(").replace(/[）]/g,")").replace(/\s+/g,"").toLowerCase();
function classifyCustomer(name,rules,fallback="대량납품"){
  const n=salesNorm(name);
  for(const r of rules){
    if(r.active===false)continue;
    const k=salesNorm(r.keyword);if(!k)continue;
    const hit=r.match_type==="exact"?n===k:r.match_type==="starts"?n.startsWith(k):n.includes(k);
    if(hit)return{category:r.category,channel:(r.channel||"").trim()||String(name||"").trim(),rule:r};
  }
  return{category:fallback,channel:String(name||"").trim(),rule:null};
}

  const patchCat=async(id,patch)=>{
    const base=await ensureDbCats();if(!base)return false;
    const idx=CATS.findIndex(c=>c.id===id);const target=base[idx];if(!target)return false;
    const{error}=await sb.from("drip2_sales_cats").update(patch).eq("id",target.id);
    if(error){alert("구분 저장 오류: "+error.message);return false;}
    setCats(base.map(c=>c.id===target.id?{...c,...patch}:c));return target;
  };
  const saveCat=async()=>{
    const cur=CATS.find(c=>c.id===editCatId);if(!cur)return setEditCatId(null);
    const nm=(editCat.name||"").trim();if(!nm)return alert("이름을 입력하세요.");
    if(nm!==cur.key&&CAT_BY[nm])return alert("이미 있는 구분 이름이에요.");
    // 이름이 바뀌면 그 구분을 쓰던 규칙도 같이 바꿈
    if(nm!==cur.key){
      const rb=await ensureDbRules();if(!rb)return;
      const{error}=await sb.from("drip2_sales_rules").update({category:nm}).eq("category",cur.key);
      if(error)return alert("규칙 갱신 오류: "+error.message);
      setRules(rb.map(r=>r.category===cur.key?{...r,category:nm}:r));
    }
    const ok=await patchCat(cur.id,{name:nm,color:editCat.color,description:(editCat.description||"").trim()||null});
    if(ok)setEditCatId(null);
  };
  const setDefaultCat=async(id)=>{
    const base=await ensureDbCats();if(!base)return;
    const idx=CATS.findIndex(c=>c.id===id);const target=base[idx];if(!target)return;
    const{error:e1}=await sb.from("drip2_sales_cats").update({is_default:false}).neq("id",target.id);
    const{error:e2}=await sb.from("drip2_sales_cats").update({is_default:true}).eq("id",target.id);
    if(e1||e2)return alert("변경 오류: "+(e1||e2).message);
    setCats(base.map(c=>({...c,is_default:c.id===target.id})));
  };
  const moveCat=async(idx,dir)=>{
    const base=await ensureDbCats();if(!base)return;
    const j=idx+dir;if(j<0||j>=base.length)return;
    const list=[...base];[list[idx],list[j]]=[list[j],list[idx]];
    const re=list.map((c,k)=>({...c,sort_order:k}));setCats(re);
    const res=await Promise.all([re[idx],re[j]].map(c=>sb.from("drip2_sales_cats").update({sort_order:c.sort_order}).eq("id",c.id)));
    const err=res.find(x=>x.error);if(err)alert("순서 저장 오류: "+err.error.message);
  };
  const delCat=c=>{
    if(c.is_default)return alert("「규칙 없을 때」 구분은 삭제할 수 없어요. 다른 구분을 먼저 기본으로 지정해주세요.");
    const used=(rules||[]).filter(r=>r.category===c.key);
    if(used.length)return alert("「"+c.key+"」 구분을 쓰는 규칙이 "+used.length+"개 있어요.\n("+used.map(r=>r.keyword).slice(0,8).join(", ")+")\n\n규칙의 구분을 먼저 바꾸거나 삭제해주세요.");
    askPw("구분 삭제","「"+c.key+"」 구분이 삭제됩니다.",async()=>{
      const base=await ensureDbCats();if(!base)return;
      const target=base[CATS.findIndex(x=>x.id===c.id)];if(!target)return;
      const{error}=await sb.from("drip2_sales_cats").delete().eq("id",target.id);
      if(error)return alert("삭제 오류: "+error.message);
      setCats(base.filter(x=>x.id!==target.id));
    });
  };
  const resetRules=()=>askPw("기본 규칙으로 초기화","지금 규칙을 모두 지우고 기본 규칙("+DEFAULT_SALES_RULES.length+"개)으로 되돌립니다.",async()=>{
    if(rulesErr)return needTable();
    const{error:e1}=await sb.from("drip2_sales_rules").delete().gte("id",0);
    if(e1)return alert("초기화 오류: "+e1.message);
    const{data,error}=await sb.from("drip2_sales_rules").insert(DEFAULT_SALES_RULES.map((r,i)=>({...r,channel:r.channel||null,active:true,sort_order:i}))).select();
    if(error)return alert("초기화 오류: "+error.message);
    setRules([...data].sort((a,b)=>a.sort_order-b.sort_order));setRulesFromDb(true);
  });

  // ── 엑셀 업로드 (ERP 판매현황집계) — 파일에 든 날짜 범위를 통째로 교체 ──
  const handleUpload=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    e.target.value="";
    setUploading(true);
    try{
      const wb=XLSX.read(await file.arrayBuffer());
      const ws=wb.Sheets[wb.SheetNames[0]];
      const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      // 헤더 행 찾기 (품목코드 / 거래처 / 일별 / 수량)
      let h=-1,ci={};
      for(let i=0;i<Math.min(15,aoa.length);i++){
        const r=aoa[i].map(x=>String(x).replace(/\s/g,""));
        const f=k=>r.findIndex(x=>x.startsWith(k));
        if(f("품목코드")>=0&&f("거래처")>=0&&f("수량")>=0){h=i;ci={code:f("품목코드"),cust:f("거래처"),name:f("품목"),date:r.findIndex(x=>x==="일별"||x.startsWith("일자")||x.startsWith("판매일")),qty:f("수량"),amt:f("공급가액")};
          if(ci.name===ci.code)ci.name=r.findIndex((x,j)=>j!==ci.code&&x.startsWith("품목"));break;}
      }
      if(h<0||ci.date<0){setUploading(false);return alert("❌ 양식을 인식하지 못했어요.\nERP '판매현황집계' 엑셀(품목코드·거래처별·품목별·일별·수량 컬럼)을 올려주세요.");}
      const out=[],errs=[];
      for(let i=h+1;i<aoa.length;i++){
        const r=aoa[i];
        const code=String(r[ci.code]||"").trim(),cust=String(r[ci.cust]||"").trim();
        if(!code||!cust)continue;              // 소계(○○ 계)·빈 줄 건너뜀
        if(/계\s*$/.test(code))continue;
        const d=parseExcelYMD(r[ci.date]);
        if(!d){errs.push("행"+(i+1)+": 날짜 '"+r[ci.date]+"'");continue;}
        const q=Number(String(r[ci.qty]).replace(/,/g,""));
        if(!isFinite(q)){errs.push("행"+(i+1)+": 수량 '"+r[ci.qty]+"'");continue;}
        const amt=ci.amt>=0?Number(String(r[ci.amt]).replace(/,/g,"")):null;
        out.push({sale_date:d,p_code:code,p_name:ci.name>=0?String(r[ci.name]||"").trim()||null:null,customer:cust,qty:Math.round(q),amount:isFinite(amt)?Math.round(amt):null});
      }
      if(errs.length){setUploading(false);return alert("❌ 읽을 수 없는 행이 있어 업로드를 중단했어요.\n\n"+errs.slice(0,15).join("\n")+(errs.length>15?"\n외 "+(errs.length-15)+"건":""));}
      // ── 제품마스터 매칭 ──
      //  1) 마스터에 있으면 그대로
      //  2) 쇼핑백·포장 옵션 코드(끝에 A/B/C…)는 기본 코드가 마스터에 있으면 기본 코드로 합침 (DRB0071B → DRB0071)
      //  3) 마스터에 없는 품목은 제품마스터에 자동 등록 (BOM·생산속도는 직접 설정 — 경고 표시)
      if(!pMaster.length){setUploading(false);return alert("제품마스터를 아직 불러오지 못했어요. 잠시 후 다시 시도해주세요.");}
      const exclList=[];const all=out.length;
      const known=new Set(masterSet);
      const stripSuffix=c=>c.replace(/[A-Za-z]+$/,"");
      const isOptionName=nm=>/\[[^\]]*(쇼핑백|리본)[^\]]*\]/.test(nm||"");
      const cleanName=nm=>String(nm||"").replace(/\s*\[[^\]]*(쇼핑백|리본)[^\]]*\]/g,"").replace(/\s{2,}/g," ").trim();
      const fileCodes=new Set(out.map(r=>r.p_code));
      const newReg={}; // 자동 등록할 코드 → {name,qty}
      out.forEach(r=>{
        if(known.has(r.p_code))return;
        const base=stripSuffix(r.p_code);
        if(base!==r.p_code&&known.has(base))return; // 2)에서 처리
        // 옵션 코드면 기본 코드로 등록 (기본 코드가 파일에 있거나 이름이 쇼핑백·리본 옵션일 때), 아니면 코드 그대로
        const target=(base!==r.p_code&&(fileCodes.has(base)||isOptionName(r.p_name)))?base:r.p_code;
        if(!newReg[target])newReg[target]={name:"",qty:0};
        if(r.p_code===target&&r.p_name)newReg[target].name=r.p_name;
        else if(!newReg[target].name)newReg[target].name=cleanName(r.p_name)||target;
      });
      Object.keys(newReg).forEach(c=>known.add(c));
      const mapped={};
      out.forEach(r=>{
        if(known.has(r.p_code)){if(newReg[r.p_code])newReg[r.p_code].qty+=r.qty;return;}
        const base=stripSuffix(r.p_code);
        if(base!==r.p_code&&known.has(base)){
          if(!mapped[r.p_code])mapped[r.p_code]={to:base,qty:0};mapped[r.p_code].qty+=r.qty;
          if(newReg[base])newReg[base].qty+=r.qty;
          r.p_code=base;
        }
      });
      const mappedList=Object.entries(mapped).sort((a,b)=>b[1].qty-a[1].qty);
      const regList=Object.entries(newReg).sort((a,b)=>b[1].qty-a[1].qty);
      const dates=out.map(r=>r.sale_date).sort();
      // 파일 제목줄의 조회기간(예: 2026/08/01 ~ 2026/10/21)이 있으면 그 기간 전체를 교체 (판매 없는 날도 정확히 반영)
      let from=dates[0],to=dates[dates.length-1];
      const title=String((aoa[0]||[])[0]||"");
      const tm=title.match(/(\d{4}[\/.\-]\d{1,2}[\/.\-]\d{1,2})\s*~\s*(\d{4}[\/.\-]\d{1,2}[\/.\-]\d{1,2})/);
      if(tm){const a=parseExcelYMD(tm[1]),b=parseExcelYMD(tm[2]);if(a&&b&&a<=from&&b>=to){from=a;to=b;}}
      const totalQty=out.reduce((a,r)=>a+r.qty,0);
      const regMsg=regList.length?"\n\n🆕 제품마스터에 없는 품목 "+regList.length+"종을 자동 등록해요 (BOM·생산속도는 직접 설정):\n"+regList.slice(0,8).map(([c,x])=>"· "+c+" "+x.name+" ("+x.qty.toLocaleString()+"개)").join("\n")+(regList.length>8?"\n· 외 "+(regList.length-8)+"종":""):"";
      const exclMsg=exclList.length?"\n\n⚠️ 제품마스터에 없는 품목 "+exclList.length+"종("+(all-out.length).toLocaleString()+"건)은 제외돼요:\n"+exclList.slice(0,8).map(([c,x])=>"· "+c+" "+x.name+" ("+x.qty.toLocaleString()+"개)").join("\n")+(exclList.length>8?"\n· 외 "+(exclList.length-8)+"종":"")+"\n→ 필요하면 제품마스터에 등록 후 다시 올려주세요.":"";
      const mapMsg=mappedList.length?"\n\n🔗 옵션 코드 "+mappedList.length+"종은 기본 제품으로 합쳐요:\n"+mappedList.slice(0,6).map(([c,x])=>"· "+c+" → "+x.to+" ("+x.qty.toLocaleString()+"개)").join("\n")+(mappedList.length>6?"\n· 외 "+(mappedList.length-6)+"종":""):"";
      const noBom=[...new Set(out.filter(r=>!rowUnits(r)).map(r=>r.p_code))];
      // ── 기존 저장 데이터와 비교 (같은 내용이면 저장 안 함 / 지워지는 데이터가 많으면 경고) ──
      const{data:oldRows,error:oldErr}=await fetchAll(()=>sb.from("drip2_sales").select("sale_date,p_code,customer,qty").gte("sale_date",from).lte("sale_date",to).order("id"));
      if(oldErr){setUploading(false);return alert("기존 데이터 확인 오류: "+oldErr.message+(/drip2_sales|does not exist|schema cache/i.test(oldErr.message)?"\n\n(최초 1회 SQL 실행이 필요해요)":""));}
      const keyOf=r=>r.sale_date+"|"+r.p_code+"|"+salesNorm(r.customer);
      const sumBy=list=>{const m=new Map();list.forEach(r=>{const k=keyOf(r);m.set(k,(m.get(k)||0)+(r.qty||0));});return m;};
      const newM=sumBy(out),oldM=sumBy(oldRows||[]);
      let dAdd=0,dDel=0,dChg=0,qAdd=0,qDel=0;
      newM.forEach((v,k)=>{if(!oldM.has(k)){dAdd++;qAdd+=v;}else if(oldM.get(k)!==v)dChg++;});
      oldM.forEach((v,k)=>{if(!newM.has(k)){dDel++;qDel+=v;}});
      const oldQty=(oldRows||[]).reduce((a,r)=>a+(r.qty||0),0);
      if(oldM.size>0&&dAdd===0&&dDel===0&&dChg===0){
        setUploading(false);
        return alert("✅ 변경 없음\n\n"+from+" ~ "+to+" 기간의 저장된 데이터와 내용이 똑같아서 저장하지 않았어요.\n("+oldM.size.toLocaleString()+"건 / 순수량 "+oldQty.toLocaleString()+"개)");
      }
      const oldDates=[...new Set((oldRows||[]).map(r=>r.sale_date))];
      const diffMsg=oldM.size===0
        ?"\n\n🆕 이 기간은 처음 올리는 데이터예요."
        :"\n\n🔍 기존 데이터와 비교 (기존 "+oldM.size.toLocaleString()+"건 / "+oldQty.toLocaleString()+"개)\n· 추가 "+dAdd.toLocaleString()+"건 (+"+qAdd.toLocaleString()+"개)\n· 수량 변경 "+dChg.toLocaleString()+"건\n· 삭제 "+dDel.toLocaleString()+"건 (-"+qDel.toLocaleString()+"개)";
      // 많이 지워지면: ERP에서 거래처·품목을 골라서(필터) 뽑은 파일일 수 있음 → 그대로 올리면 나머지가 지워짐
      const bigDelete=oldM.size>0&&dDel>Math.max(20,oldM.size*0.1);
      const delWarn=bigDelete?"\n\n🚨 기존 데이터의 "+Math.round(dDel/oldM.size*100)+"%가 지워져요!\nERP에서 특정 거래처·품목만 골라서 뽑은 파일이라면 나머지 판매 데이터가 사라져요. 전체 조건으로 뽑은 파일이 맞는지 꼭 확인해주세요.":"";
      const noBomMsg=noBom.length?"\n\n※ 낱개 수를 알 수 없는(BOM 미등록) "+noBom.length+"종은 낱개 보기에서 0으로 계산돼요: "+noBom.slice(0,6).join(", ")+(noBom.length>6?" 외":""):"";
      if(!window.confirm("📤 판매현황 업로드\n\n기간: "+from+" ~ "+to+"\n저장: "+out.length.toLocaleString()+"건 / 순수량: "+totalQty.toLocaleString()+"개"+diffMsg+delWarn+regMsg+mapMsg+exclMsg+noBomMsg+"\n\n이 기간에 이미 있는 판매 데이터는 지우고 새로 저장해요. 진행할까요?")){setUploading(false);return;}
      // 신규 제품 자동 등록 (확인 후)
      const regCodes=Object.keys(newReg);
      const doRegister=async()=>{
        if(!regCodes.length)return true;
        const{data:exist,error:e0}=await sb.from("drip2_product_master").select("code,sort_order").in("code",regCodes);
        if(e0){alert("제품마스터 확인 오류: "+e0.message);return false;}
        const already=new Set((exist||[]).map(x=>x.code));
        const maxO=Math.max(0,...pMaster.map(p=>p.sort_order||0));
        const ins=regCodes.filter(c=>!already.has(c)).map((c,i)=>({code:c,name:newReg[c].name||c,sort_order:maxO+1+i,active:true,speed_sec:null}));
        if(!ins.length)return true;
        const{error}=await sb.from("drip2_product_master").insert(ins);
        if(error){alert("제품마스터 자동 등록 오류: "+error.message);return false;}
        return true;
      };
      if(bigDelete&&!window.confirm("🚨 한 번 더 확인할게요.\n\n기존 "+dDel.toLocaleString()+"건("+qDel.toLocaleString()+"개)이 지워져요.\n전체 조건으로 뽑은 ERP 파일이 맞나요?")){setUploading(false);return;}
      if(!(await doRegister())){setUploading(false);return;}
      if(regCodes.length&&onMasterChanged)await onMasterChanged();
      const{error}=await sb.rpc("drip2_sales_replace",{p_from:from,p_to:to,p_rows:out});
      setUploading(false);
      if(error)return alert("업로드 오류: "+error.message+(/function|does not exist|schema cache/i.test(error.message)?"\n\n(최초 1회 SQL 실행이 필요해요)":""));
      alert("✅ 업로드 완료\n"+from+" ~ "+to+" · "+out.length.toLocaleString()+"건"+(regList.length?"\n\n🆕 제품마스터에 "+regList.length+"종 자동 등록했어요.\n⚠️ 제품마스터 탭에서 생산속도, BOM관리 탭에서 낱개 구성을 꼭 설정해주세요:\n"+regList.slice(0,10).map(([c,x])=>"· "+c+" "+x.name).join("\n"):""));
      loadMeta();
      // 올린 기간이 보이도록 조회기간 맞춤
      applyRange(from,to);
      if(range.from===from&&range.to===to)loadRows(from,to);
      setView("trend");
    }catch(err){setUploading(false);alert("파일 오류: "+err.message);}
  };

  const presets=(()=>{const t=today(),y=t.slice(0,4),m=t.slice(0,7);const lme=addDays(m+"-01",-1);
    return[["최근 1개월",addDays(t,-30),t],["최근 3개월",addDays(t,-90),t],["최근 6개월",addDays(t,-182),t],["이번 달",m+"-01",t],["지난 달",lme.slice(0,7)+"-01",lme],["올해",y+"-01-01",t],...(meta&&!meta.empty?[["업로드 전체",meta.from,meta.to]]:[])];})();
  const tableMissing=/drip2_sales|relation|does not exist|schema cache/i.test(dataErr);

  const VIEWS=[["trend","📈 구분별 추이"],["product","🎁 제품별"],["customer","🏢 거래처 분류 확인"],["rules","⚙️ 분류 규칙"],["upload","📤 엑셀 업로드"]];
  return(
    <div>
      <SecTitle icon="🛒" title={"판매 추이 — "+catOrder.join(" · ")}/>

      {/* 세부탭 */}
      <div style={{display:"flex",gap:0,marginBottom:18,borderBottom:"2px solid #6a8a5a33",flexWrap:"wrap"}}>
        {VIEWS.map(([k,l])=>(
          <button key={k} onClick={()=>setView(k)} style={{padding:"9px 18px",border:"none",borderBottom:"3px solid "+(view===k?"#f5c97a":"transparent"),marginBottom:-2,background:"transparent",cursor:"pointer",fontFamily:"inherit",fontSize:14,fontWeight:view===k?700:400,color:view===k?"#f5c97a":"#a8b8a0"}}>{l}</button>
        ))}
      </div>

      {tableMissing&&(
        <div style={{padding:"12px 16px",background:"rgba(224,80,80,.12)",border:"1px solid #e0505066",borderRadius:8,fontSize:13,color:"#f0a0a0",marginBottom:16}}>⚠️ 판매 데이터 테이블이 아직 없어요. Supabase SQL Editor에서 최초 1회 SQL을 실행해주세요.</div>

      {/* 기간 선택 (분석 화면 공통) */}

              · ERP에서 받은 <b>판매현황집계</b> 엑셀을 그대로 올리면 돼요. (품목코드 · 거래처별 · 품목별 · 일별 · 수량)<br/>
              · 중간의 「○○ 계」 소계 줄은 자동으로 빼고, 반품(마이너스 수량)은 판매에서 차감해요.<br/>
              · <b style={{color:"#f5c97a"}}>제품마스터에 없는 품목은 자동으로 등록</b>해요. 등록된 품목은 <b>생산속도·BOM 설정 경고</b>가 떠요. (낱개 환산은 ERP 품목명의 "N개입"을 먼저 사용)<br/>
              · 쇼핑백·포장 옵션 코드(예: DRB0071<b>B</b>)가 마스터에 없으면 기본 코드(DRB0071)로 합쳐서 저장해요.<br/>
              · <b style={{color:"#f5c97a"}}>파일 기간(제목줄의 조회기간)에 이미 있는 데이터는 지우고 새로 저장</b>해요. 기간이 겹쳐도 중복 걱정 없어요.<br/>
              · 거래처 분류는 저장하지 않고 <b>⚙️ 분류 규칙</b>으로 화면에서 계산해요.
            </div>
            <label style={{...primaryBtn,display:"inline-block",opacity:uploading?.6:1,pointerEvents:uploading?"none":"auto"}}>
              {uploading?"⏳ 업로드 중...":"📂 엑셀 파일 선택"}
              <input type="file" accept=".xlsx,.xls" onChange={handleUpload} style={{display:"none"}}/>
            </label>
          </div>
          <div style={{fontSize:13,color:"#a8b8a0"}}>
            {meta===null?"저장된 데이터 확인 중... (테이블이 없으면 최초 1회 SQL을 실행해주세요)":meta.empty?"아직 올린 판매 데이터가 없어요.":<>현재 저장된 판매 데이터: <b style={{color:"#f5c97a"}}>{meta.from} ~ {meta.to}</b></>}
          </div>
        </div>
      )}
    </div>
  );
}

  // ★ [DB 부하 개선] Realtime(postgres_changes) 구독 제거 → 가벼운 폴링으로 대체
  //   - 기존 구독 5개는 존재하지 않는 테이블명(single_master 등)이라 동작하지 않았고,
  //     drip2_orders/drip2_stock도 Realtime 발행 대상이 아니라 이벤트가 오지 않았음 (DB 부하만 발생)
  //   - 주문: "진행중 + 최근 7일"만 조회 (전체 이력 반복 조회 중단), 변경 감지 시에만 조회
  //   - 재고: 변경 감지 시에만 조회 (전광판 탭 제외) / 투입 시에는 기존대로 DB 최신 재고로 재확인(CAS)
  //   - 브라우저 탭이 숨겨져 있으면 확인 중단, 다시 보이면 즉시 1회 갱신
  const tabRef=useRef(tab);
  useEffect(()=>{tabRef.current=tab;},[tab]);
  // ★ [변경 감지 동기화] 10초마다 drip2_sync(변경 시각 2줄)만 확인 → 바뀌었을 때만 주문/재고 다시 조회
  //   - 주문 등록·투입완료·완료처리·삭제 등 drip2_orders가 바뀌면 DB 트리거가 시각 갱신 → 전광판 10초 내 반영

  //   - 안전장치: 5분마다 1회 전체 갱신 / drip2_sync 테이블이 없거나 오류면 기존 30초 폴링으로 자동 전환
  const syncRef=useRef({orders:null,stock:null});
  useEffect(()=>{if(!user)return;loadAll();
    const SYNC_CHECK_MS=10000,FALLBACK_POLL_MS=30000,SAFETY_REFRESH_MS=5*60*1000;
    const canPoll=()=>!pollPaused.current&&document.visibilityState==="visible";
    let syncOk=true,lastFallback=Date.now(),lastSafety=Date.now(),lastStock=Date.now();
    const checkSync=async(force)=>{
      if(!canPoll())return;
      const now=Date.now();
      if(syncOk){
        const{data,error}=await sb.from("drip2_sync").select("key,changed_at");
        if(error||!data||!data.length){
          syncOk=false;console.warn("drip2_sync 사용 불가 → 30초 폴링으로 전환",error?.message||"");
        }else{
          const m={};data.forEach(r=>{m[r.key]=r.changed_at;});
          const prev=syncRef.current;
          const ordersChanged=prev.orders!==null&&m.orders!==prev.orders;
          const stockChanged=prev.stock!==null&&m.stock!==prev.stock;
          syncRef.current={orders:m.orders??null,stock:m.stock??null};
          if(force||ordersChanged||now-lastSafety>=SAFETY_REFRESH_MS){lastSafety=now;loadOrders();}
          if((force||stockChanged)&&tabRef.current!=="전광판")loadStock();
          return;
        }
      }
      // 폴백: 기존 방식 (주문 30초 / 재고 60초, 전광판 탭은 재고 제외)
      if(force||now-lastFallback>=FALLBACK_POLL_MS){
        lastFallback=now;loadOrders();
        if(tabRef.current!=="전광판"&&(force||now-lastStock>=60000)){lastStock=now;loadStock();}
      }
    };
    checkSync(false); // 기준 시각 저장 (loadAll이 이미 최신 데이터를 불러옴)
    const syncTimer=setInterval(()=>checkSync(false),SYNC_CHECK_MS);
    const onVisible=()=>{
      if(document.visibilityState!=="visible"||pollPaused.current)return;
      checkSync(true);
    };
    document.addEventListener("visibilitychange",onVisible);
    return()=>{clearInterval(syncTimer);document.removeEventListener("visibilitychange",onVisible);};
  },[user]);
  useEffect(()=>{

  const loadMasters=async()=>{
    const[{data:sm},{data:pm}]=await Promise.all([sb.from("drip2_single_master").select("*").order("code"),sb.from("drip2_product_master").select("*").order("sort_order").order("code")]);
