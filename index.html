  };
  const loadBom=async()=>{const{data}=await sb.from("drip2_bom").select("*");if(data){setBomData(data);setBomLoaded(true);}};
  const sortStock=arr=>[...arr].sort((a,b)=>a.s_code.localeCompare(b.s_code)||new Date(a.expiry)-new Date(b.expiry));
  // ★ DB에서 최신 재고를 직접 조회 (다른 세션의 변경사항을 놓치지 않기 위함 — 로컬 state에 의존하지 않음)
  const fetchStock=async()=>{const{data}=await sb.from("drip2_stock").select("*");return data?sortStock(data):stock;};
  const loadStock=async()=>{setStock(await fetchStock());};
  // ★ [DB 부하 개선] 전체 이력 대신 필요한 범위만 조회
  //   ① 완료 안 된 건(대기/투입완료/확정) 전부  ② 최근 7일 완료 건  ③ 조회 날짜가 7일 이전이면 그 날짜 건
  const ORDER_WINDOW_DAYS=7;
  const viewDateRef=useRef(viewDate);
  const loadOrders=async()=>{
    const cutoff=addDays(today(),-ORDER_WINDOW_DAYS);
    const vd=viewDateRef.current;
    const reqs=[
      sb.from("drip2_orders").select("*").or("status.neq.완료,plan_date.gte."+cutoff+",plan_date.is.null").order("priority"),
    ];
    if(vd&&vd<cutoff)reqs.push(sb.from("drip2_orders").select("*").eq("plan_date",vd).order("priority"));
    const res=await Promise.all(reqs);
    if(res.some(r=>r.error)){console.error("주문 조회 오류:",res.find(r=>r.error).error.message);return;}
    const byId=new Map();
    res.forEach(r=>(r.data||[]).forEach(o=>byId.set(o.id,o)));
    const data=[...byId.values()].sort((a,b)=>a.priority-b.priority);
    setOrders(prev=>{
      // 데이터 변경 없으면 리렌더 방지 (수량·ERP·담당자 변경도 감지)
      if(prev.length===data.length&&JSON.stringify(prev)===JSON.stringify(data))return prev;
      return data;

    } else {

  const fetchAllRows=async(makeQuery)=>{
    const PAGE=1000;let all=[],from=0;
    for(;;){
      const{data,error}=await makeQuery().range(from,from+PAGE-1);
      if(error)return{data:null,error};
      all=all.concat(data||[]);
      if(!data||data.length<PAGE)return{data:all,error:null};
      from+=PAGE;
    }
  };

    const allExpArr=detailsWithExp.map(d=>d.expiry).filter(Boolean);

    const hasPendingFlag=details.some(d=>(d.used||[]).some(u=>stock.find(s=>s.id===u.id)?.is_pending));

    // ★ UI 즉시 반영 (DB 응답 기다리지 않음)

    // ★ 재고 업데이트 — 동시수정 감지(compare-and-swap): 읽은 시점의 qty와 현재 DB qty가 같을 때만 갱신
    const stockUpdatePlans=ws

      assignLot(finExp,detailsWithExp,order.p_code),

  const addExtraQty=async(orderId)=>{
    const order=orders.find(o=>o.id===orderId);if(!order)return;
    if(order.status!=="확정")return alert("생산확정 상태에서만 추가할 수 있습니다.");
    const input=window.prompt("실제로 더 생산된 수량을 입력하세요 (예: 30)");
    if(!input)return;
    const extra=parseInt(input);
    if(isNaN(extra)||extra<=0)return alert("올바른 수량을 입력해주세요.");
    const recipe=bomOf(order.p_code);
    if(!recipe.length)return alert("BOM이 설정되지 않은 제품입니다.");
    const baseStock=await fetchStock();
    // 기존 detail과 병합 (같은 원료의 소비기한별 사용량 합산)
    const prevDetails=order.detail?.details||[];
    let ws=[...baseStock];const newUsed=[];const errors=[];
    for(const comp of recipe){
      const need=comp.qty*extra;
      const prevD=prevDetails.find(d=>d.sCode===comp.s_code);
      const targetExpiry=prevD?.expiry||order.detail?.finExp;
      if(!targetExpiry){errors.push("["+sName(comp.s_code)+"] 기존 소비기한 정보를 찾을 수 없음");continue;}
      const{ok,used,next,shortage}=deductExactExpiry(ws,comp.s_code,targetExpiry,need);
      if(!ok)errors.push("["+sName(comp.s_code)+"] "+fmtDate(targetExpiry)+" 소비기한 재고 없음 (부족 "+shortage+"개)");
      else{ws=next;newUsed.push({sCode:comp.s_code,used,need});}
    }
    if(errors.length)return alert("⚠️ 추가 반영 불가 — 기존 생산과 같은 소비기한의 재고가 부족합니다\n\n"+errors.join("\n"));

    const mergedDetails=prevDetails.map(d=>{
      const add=newUsed.find(n=>n.sCode===d.sCode);
      if(!add)return d;
      const usedMap={};
      [...(d.used||[]),...add.used].forEach(u=>{
        const key=u.expiry+"_"+u.id;
        if(usedMap[key])usedMap[key]={...usedMap[key],qty:usedMap[key].qty+u.qty};
        else usedMap[key]={...u};
      });
      const mergedUsedArr=Object.values(usedMap);
      const newExpiry=mergedUsedArr.length?mergedUsedArr.reduce((min,u)=>new Date(u.expiry)<new Date(min)?u.expiry:min,mergedUsedArr[0].expiry):d.expiry;
      return{...d,used:mergedUsedArr,total:(d.total||0)+add.need,expiry:newExpiry};
    });
    newUsed.forEach(add=>{
      if(!mergedDetails.find(d=>d.sCode===add.sCode)){
        const expiry=add.used.length?add.used.reduce((min,u)=>new Date(u.expiry)<new Date(min)?u.expiry:min,add.used[0].expiry):null;
        mergedDetails.push({sCode:add.sCode,used:add.used,total:add.need,expiry});
      }
    });
    const allExpArr=mergedDetails.map(d=>d.expiry).filter(Boolean);
    const finExp=allExpArr.length>0?allExpArr.reduce((min,e)=>new Date(e)<new Date(min)?e:min):(order.detail?.finExp||null);
    const newQty=order.qty+extra;
    const newDetail={...order.detail,details:mergedDetails,finExp};

    // ★ UI 즉시 반영
    setStock(ws);
    setOrders(prev=>prev.map(o=>o.id===orderId?{...o,qty:newQty,detail:newDetail}:o));

    ));
    const conflict=results.some(r=>!r.error&&(!r.data||r.data.length===0));
    if(conflict){
      const fresh=await fetchStock();
      setStock(fresh);
      alert("⚠️ 다른 사용자가 방금 같은 재고를 먼저 사용했습니다.\n재고를 최신 상태로 다시 불러왔습니다. 추가 수량을 다시 반영해주세요.");

    const logId=order.detail?.logId;
    if(logId){
      await sb.from("drip2_prod_log").update({qty:newQty,details:mergedDetails,fin_exp:finExp}).eq("id",logId);
      setProdLog(prev=>prev.map(l=>l.id===logId?{...l,qty:newQty,details:mergedDetails,fin_exp:finExp}:l));
    }
    alert("✅ "+extra+"개가 추가 반영되었습니다. (총 "+newQty+"개)");
  };

  // 공통 순서 재정렬 — 리스트 전체를 0..n-1 정수로 다시 매겨 저장 (기존 sort_order 값이 중복/누락되어도 항상 정상 동작)
  const reorderMaster=async(table,list,setList,code,newPos)=>{
    const sorted=[...list].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
    const fromIdx=sorted.findIndex(x=>x.code===code);
    if(fromIdx===-1)return;
    let toIdx=Math.round(newPos)-1;
    if(isNaN(toIdx))return;
    toIdx=Math.max(0,Math.min(sorted.length-1,toIdx));
    if(toIdx===fromIdx)return;
    const[item]=sorted.splice(fromIdx,1);
    sorted.splice(toIdx,0,item);
    const reindexed=sorted.map((x,i)=>({...x,sort_order:i}));
    await Promise.all(reindexed.map(x=>sb.from(table).update({sort_order:x.sort_order}).eq("code",x.code)));
    setList(prev=>prev.map(x=>{const m=reindexed.find(r=>r.code===x.code);return m?{...x,sort_order:m.sort_order}:x;}));
  };

  const addBomComp=async()=>{const{sCode,qty}=newComp;if(!sCode||!qty)return alert("구성품과 수량을 입력하세요.");if(bomOf(bomPCode).length>=10)return alert("최대 10개");if(bomOf(bomPCode).find(c=>c.s_code===sCode))return alert("이미 추가된 구성품");const{data,error}=await sb.from("drip2_bom").insert({p_code:bomPCode,s_code:sCode,qty:parseInt(qty)}).select().single();if(error)return alert("오류: "+error.message);if(data)setBomData(prev=>[...prev,data]);setNewComp(f=>({...f,qty:""}));};
  const delBomComp=(id,sCode)=>askPw("BOM 구성품 삭제","["+sName(sCode)+"] 삭제됩니다.",async()=>{await sb.from("drip2_bom").delete().eq("id",id);setBomData(prev=>prev.filter(b=>b.id!==id));});
  const editBomQty=async(id,val)=>{await sb.from("drip2_bom").update({qty:parseInt(val)||1}).eq("id",id);};

  // ── 주문 순서 ──
  const moveOrder=async(id,dir)=>{
    const pending=sortedOrders.filter(o=>o.status==="대기"||o.status==="투입완료");
    const idx=pending.findIndex(o=>o.id===id);const swapIdx=idx+dir;
    if(swapIdx<0||swapIdx>=pending.length)return;
    const a=pending[idx],b=pending[swapIdx];
    await Promise.all([sb.from("drip2_orders").update({priority:b.priority}).eq("id",a.id),sb.from("drip2_orders").update({priority:a.priority}).eq("id",b.id)]);
    setOrders(prev=>prev.map(o=>o.id===a.id?{...o,priority:b.priority}:o.id===b.id?{...o,priority:a.priority}:o));
  };

  // ── 생산확정 드래그 재정렬 ──
  const[dragOverId,setDragOverId]=useState(null);
  const onConfirmDragStart=(id)=>{dragItem.current=id;};
  const onConfirmDragOver=(e,id)=>{e.preventDefault();if(dragItem.current!==id){setDragOverId(id);}};
  const onConfirmDragEnd=()=>{setDragOverId(null);dragItem.current=null;dragOver.current=null;};
  const onConfirmDrop=async(e,targetId)=>{
    e.preventDefault();
    const srcId=dragItem.current;
    if(!srcId||srcId===targetId){setDragOverId(null);return;}
    // 확정 목록 priority 재계산
    const confirmed=sortedOrders.filter(o=>o.status==="확정"&&(o.plan_date||"").slice(0,10)===viewDate);
    const srcIdx=confirmed.findIndex(o=>o.id===srcId);
    const tgtIdx=confirmed.findIndex(o=>o.id===targetId);
    if(srcIdx===-1||tgtIdx===-1){setDragOverId(null);return;}
    // 배열 재정렬
    const reordered=[...confirmed];
    const[moved]=reordered.splice(srcIdx,1);
    reordered.splice(tgtIdx,0,moved);
    // priority 일괄 업데이트 (기존 priority 값 활용)
    const sortedPriorities=[...confirmed].map(o=>o.priority).sort((a,b)=>a-b);
    const updates=reordered.map((o,i)=>({id:o.id,priority:sortedPriorities[i]}));
    // 로컬 state 즉시 반영
    setOrders(prev=>prev.map(o=>{const u=updates.find(x=>x.id===o.id);return u?{...o,priority:u.priority}:o;}));
    // DB 저장
    await Promise.all(updates.map(u=>sb.from("drip2_orders").update({priority:u.priority}).eq("id",u.id)));

  };

      <div style={{background:"#2e2e2c",border:"2px solid #6a8a5a",borderRadius:16,padding:"28px 32px",minWidth:300}}>
        <div style={{color:"#d8ecca",fontWeight:700,fontSize:16,marginBottom:18}}>📅 생산 날짜 설정</div>
        <div style={{marginBottom:20}}><div style={{fontSize:12,color:"#a8b8a0",marginBottom:4}}>생산날짜</div>
          <input type="date" value={tmp.planDate} onChange={e=>setTmp(t=>({...t,planDate:e.target.value}))}
            style={{width:"100%",padding:"8px 12px",borderRadius:8,fontSize:14,background:"rgba(255,255,255,.1)",border:"1px solid #7a8a7055",color:"#f0ede8",outline:"none",fontFamily:"inherit"}}/></div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>setShowPlanSetting(false)} style={{flex:1,padding:"8px",borderRadius:8,border:"none",background:"rgba(255,255,255,.07)",color:"#c8c8b8",cursor:"pointer",fontFamily:"inherit"}}>취소</button>
          <button onClick={()=>savePlanInfo(tmp)} style={{flex:1,padding:"8px",borderRadius:8,border:"none",background:"linear-gradient(135deg,#5a7a4a,#7a9a6a)",color:"#fff",fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>저장</button>
        </div>
      </div>
    </div>);
  };

  // 색상 팔레트 컴포넌트 (재사용)
  const ColorPicker=({label,value,onChange})=>(
    <div>
      <div style={lbl}>{label} {value&&<span style={{background:value,padding:"1px 8px",borderRadius:4,fontSize:11,border:"1px solid rgba(255,255,255,.3)"}}>{value}</span>}</div>
      <div style={{display:"flex",gap:4,flexWrap:"wrap",maxWidth:230}}>
        {COLORS.map(col=>(
          <div key={col} onClick={()=>onChange(col)} style={{width:24,height:24,borderRadius:5,cursor:"pointer",background:col,border:value===col?"3px solid #fff":"2px solid transparent",outline:value===col?"2px solid #c8821a":"none",boxSizing:"border-box"}}/>
        ))}
        <div onClick={()=>onChange("")} style={{width:24,height:24,borderRadius:5,cursor:"pointer",background:"transparent",border:!value?"3px solid #fff":"2px solid #6a6a64",backgroundImage:"repeating-linear-gradient(45deg,#888 0,#888 2px,transparent 2px,transparent 6px)",boxSizing:"border-box"}} title="없음"/>
      </div>
    </div>
  );

  // ── 분석 계산 (선택 기간 + 완료 데이터 기반) ──
  const anaRange=periodRange(anaPeriodType,anaAnchor,anaCustomFrom,anaCustomTo);
  const anaFrom=anaRange.from,anaTo=anaRange.to;
  const speedOf=code=>{const p=pMaster.find(x=>x.code===code);return p&&p.speed_sec?Number(p.speed_sec):0;};
  const anaTotalQty=anaRows.reduce((a,r)=>a+(r.qty||0),0);
  // 낱개 환산 — 완제품 수량 × BOM 낱개 구성수
  const anaUnitsOf=code=>bomOf(code).reduce((a,c)=>a+(c.qty||0),0);
  const anaTotalUnit=anaRows.reduce((a,r)=>a+(r.qty||0)*anaUnitsOf(r.p_code),0);
  const anaNoBom=[...new Set(anaRows.filter(r=>!anaUnitsOf(r.p_code)).map(r=>r.p_code))];
  const anaTotalProdHours=anaRows.reduce((a,r)=>a+secToHour((r.qty||0)*speedOf(r.p_code)),0);
  const anaPerHour=anaTotalProdHours>0?(anaTotalQty/anaTotalProdHours):0;
  // 날짜별 가용시간: 반드시 그 날짜에 저장된 값이 있어야 계산됨 (기본값 없음). 미입력이면 null.
  const anaDailyAvailOf=d=>{
    const ov=anaNoteMap[d];
    if(!ov||ov.workers==null||ov.hours==null)return null;
    return ov.workers*ov.hours+(ov.overtime||0);
  };

  // 제품별 집계 (생산량/생산시간)
  const anaProductMap={};
  anaRows.forEach(r=>{
    const k=r.p_code;
    if(!anaProductMap[k])anaProductMap[k]={qty:0,hours:0};
    anaProductMap[k].qty+=r.qty||0;
    anaProductMap[k].hours+=secToHour((r.qty||0)*speedOf(k));
  });
  const anaProductArr=Object.keys(anaProductMap).map((k,i)=>({code:k,label:pName(k),value:anaProductMap[k].qty,hours:anaProductMap[k].hours,color:COLORS[i%COLORS.length]})).sort((a,b)=>b.value-a.value);
  const anaProductRank=anaProductArr;
  const anaProductPie=anaProductArr;
  const anaBest=anaProductArr.slice(0,5);
  const anaWorst=[...anaProductArr].sort((a,b)=>a.value-b.value).slice(0,5);

  // 일자별 집계 (가동률/생산시간 그래프) — 실제 생산이 있었던 날짜 기준
  const anaDayMap={};
  anaRows.forEach(r=>{
    const d=(r.plan_date||"").slice(0,10);if(!d)return;
    if(!anaDayMap[d])anaDayMap[d]=0;
    anaDayMap[d]+=secToHour((r.qty||0)*speedOf(r.p_code));
  });
  const anaDayKeys=Object.keys(anaDayMap).sort();
  const anaDays=anaDayKeys.length; // 달력상 일수(예:31일)가 아닌 실제 생산일수
  // 인원 미입력 날짜 (생산은 있었지만 작업자수/근무시간이 저장 안 된 날) — 경고 대상
  const anaMissingDays=anaDayKeys.filter(d=>d!==today()&&anaDailyAvailOf(d)==null);
  // 총 가용시간 = 인원이 입력된 날짜만 (그날 작업자수 × 그날 근무시간) 합산
  const anaTotalAvailHours=anaDayKeys.reduce((a,d)=>{const av=anaDailyAvailOf(d);return a+(av||0);},0);
  const anaUtilRate=anaTotalAvailHours>0?(anaTotalProdHours/anaTotalAvailHours*100):0;
  const anaUtilTrend=anaDayKeys.map(d=>{const av=anaDailyAvailOf(d);return{date:d,label:d.slice(5).replace("-","/"),value:av?(anaDayMap[d]/av*100):0,missing:av==null,sub:anaDayMap[d]};});
  const anaUtilValsFilled=anaUtilTrend.filter(d=>!d.missing).map(d=>d.value);
  const anaUtilAvg=anaUtilValsFilled.length?anaUtilValsFilled.reduce((a,b)=>a+b,0)/anaUtilValsFilled.length:0;
  const anaUtilMax=anaUtilValsFilled.length?Math.max(...anaUtilValsFilled):0;
  const anaUtilMin=anaUtilValsFilled.length?Math.min(...anaUtilValsFilled):0;

  // 일별 낱개 포장량 집계 — 완제품 생산완료 수량 × 그 제품 BOM 구성품 총 수량 (예: 세트 하나에 낱개 6종×3개=18개 들어가면 100세트=1800개)
  const anaPackDayMap={};
  anaRows.forEach(r=>{
    const d=(r.plan_date||"").slice(0,10);if(!d)return;
    const unitsPerProduct=bomOf(r.p_code).reduce((a,c)=>a+(c.qty||0),0);
    anaPackDayMap[d]=(anaPackDayMap[d]||0)+(r.qty||0)*unitsPerProduct;
  });
  const anaPackDayKeys=Object.keys(anaPackDayMap).sort();
  const anaPackTrend=anaPackDayKeys.map(d=>({date:d,label:d.slice(5).replace("-","/"),value:anaPackDayMap[d]}));
  const anaPackTotal=anaPackDayKeys.reduce((a,d)=>a+anaPackDayMap[d],0);
  const anaPackAvg=anaPackDayKeys.length?anaPackTotal/anaPackDayKeys.length:0;
  const anaPackMax=anaPackDayKeys.length?Math.max(...anaPackDayKeys.map(d=>anaPackDayMap[d])):0;
  // ══ 분석2: 요일별 생산량 + 업체별 낱개 (요일별) ══
  const A2_WD=[1,2,3,4,5,6,0]; // 월~일 순서
  const a2UnitsOf=code=>bomOf(code).reduce((a,c)=>a+(c.qty||0),0);
  // 분석은 출고업체 단위로만 집계 (대량납품은 납품업체명과 관계없이 "대량납품" 하나로 묶음)
  const a2Key=r=>(r.channel||"미입력").trim()||"미입력";
  const a2Wd={};A2_WD.forEach(w=>{a2Wd[w]={days:new Set(),qty:0,unit:0,ch:{}};});
  const a2Ch={};   // {업체:{qty,unit,days:Set,wd:{w:{qty,unit}}}}
  const a2Date={}; // {날짜:{qty,unit,ch:{업체:{qty,unit}}}}
  a2Rows.forEach(r=>{
    const d=(r.plan_date||"").slice(0,10);if(!d)return;
    const w=new Date(d+"T00:00:00Z").getUTCDay();
    const q=r.qty||0,u=q*a2UnitsOf(r.p_code),k=a2Key(r);
    const W=a2Wd[w];W.days.add(d);W.qty+=q;W.unit+=u;
    if(!W.ch[k])W.ch[k]={qty:0,unit:0};W.ch[k].qty+=q;W.ch[k].unit+=u;
    if(!a2Ch[k])a2Ch[k]={qty:0,unit:0,days:new Set(),wd:{}};
    const C=a2Ch[k];C.qty+=q;C.unit+=u;C.days.add(d);
    if(!C.wd[w])C.wd[w]={qty:0,unit:0};C.wd[w].qty+=q;C.wd[w].unit+=u;
    if(!a2Date[d])a2Date[d]={qty:0,unit:0,ch:{}};
    a2Date[d].qty+=q;a2Date[d].unit+=u;
    if(!a2Date[d].ch[k])a2Date[d].ch[k]={qty:0,unit:0};a2Date[d].ch[k].qty+=q;a2Date[d].ch[k].unit+=u;
  });
  const a2Pick=o=>o?(a2Metric==="unit"?o.unit:o.qty):0;
  const a2Unit=a2Metric==="unit"?"개(낱개)":"개(완제품)";
  const a2Fmt=v=>Math.round(v).toLocaleString();
  // 화면에 보여줄 요일: 월~금은 항상, 토·일은 생산이 있었던 경우만
  const a2WdShow=A2_WD.filter(w=>(w>=1&&w<=5)||a2Wd[w].days.size>0);
  const a2WdVal=(w,obj)=>{const n=a2Wd[w].days.size;const v=a2Pick(obj);return a2Mode==="avg"?(n?v/n:0):v;};
  // 업체 목록 (선택 기준 내림차순) + 색상 (업체 색상 우선, 겹치면 팔레트에서 대체)
  const a2ChKeys=Object.keys(a2Ch).sort((a,b)=>a2Pick(a2Ch[b])-a2Pick(a2Ch[a]));
  const a2ChColor={};
  {const used=new Set();a2ChKeys.forEach((k,i)=>{
    const base=k.split(" · ")[0];
    let c=channels.find(x=>x.name===base)?.color;
    if(!c||used.has(c))c=COLORS.find(x=>!used.has(x))||COLORS[i%COLORS.length];
    used.add(c);a2ChColor[k]=c;
  });}
  const a2TotalQty=a2Rows.reduce((a,r)=>a+(r.qty||0),0);
  const a2TotalUnit=Object.values(a2Ch).reduce((a,c)=>a+c.unit,0);
  const a2TotalPick=a2Metric==="unit"?a2TotalUnit:a2TotalQty;
  const a2DateKeys=Object.keys(a2Date).sort();
  const a2ProdDays=a2DateKeys.length;
  const a2BestWd=[...A2_WD].filter(w=>a2Wd[w].days.size>0).sort((a,b)=>(a2Pick(a2Wd[b])/a2Wd[b].days.size)-(a2Pick(a2Wd[a])/a2Wd[a].days.size))[0];
  const a2NoBom=[...new Set(a2Rows.filter(r=>!a2UnitsOf(r.p_code)).map(r=>r.p_code))];
  // 차트 데이터
  const a2WdChart=a2WdShow.map(w=>({label:WEEKDAY_KR[w],sub:a2Wd[w].days.size+"일",segs:[{key:"전체",name:"전체",value:a2WdVal(w,a2Wd[w]),color:a2Metric==="unit"?"#4db6ac":"#f5c97a"}]}));
  const a2WdChChart=a2WdShow.map(w=>({label:WEEKDAY_KR[w],sub:a2Wd[w].days.size+"일",segs:a2ChKeys.map(k=>({key:k,name:k,value:a2WdVal(w,a2Wd[w].ch[k]),color:a2ChColor[k]}))}));
  const a2DateChart=a2DateKeys.map(d=>({label:d.slice(5).replace("-","/"),sub:WEEKDAY_KR[new Date(d+"T00:00:00Z").getUTCDay()],segs:a2ChKeys.map(k=>({key:k,name:k,value:a2Pick(a2Date[d].ch[k]),color:a2ChColor[k]}))}));
  // 업체×요일 히트맵 최대값
  const a2HeatMax=Math.max(1,...a2ChKeys.flatMap(k=>a2WdShow.map(w=>a2WdVal(w,a2Ch[k].wd[w]))));
  // ── 업체별 추이 (세부탭) ──
  const a2DateLbl=d=>({label:d.slice(5).replace("-","/"),sub:WEEKDAY_KR[new Date(d+"T00:00:00Z").getUTCDay()]});
  // 업체 하나의 일자별 막대 데이터 (x축은 전체 생산일로 맞춰서 업체끼리 비교 가능)
  const a2ChDateChart=k=>a2DateKeys.map(d=>({...a2DateLbl(d),segs:[{key:k,name:k,value:a2Pick(a2Date[d].ch[k]),color:a2ChColor[k]}]}));
  // 선택 업체의 제품별 생산 내역
  const a2SelValid=a2SelCh!=="__all__"&&a2Ch[a2SelCh];
  const a2SelProd=(()=>{
    if(!a2SelValid)return[];
    const m={};
    a2Rows.forEach(r=>{if(a2Key(r)!==a2SelCh)return;const q=r.qty||0;
      if(!m[r.p_code])m[r.p_code]={code:r.p_code,qty:0,unit:0,days:new Set()};
      m[r.p_code].qty+=q;m[r.p_code].unit+=q*a2UnitsOf(r.p_code);m[r.p_code].days.add((r.plan_date||"").slice(0,10));});
    return Object.values(m).sort((a,b)=>a2Pick(b)-a2Pick(a));
  })();
  const a2SelWdChart=a2SelValid?a2WdShow.map(w=>{const C=a2Ch[a2SelCh].wd[w];const n=a2Wd[w].days.size;const v=a2Pick(C);
    return{label:WEEKDAY_KR[w],sub:n+"일",segs:[{key:a2SelCh,name:a2SelCh,value:a2Mode==="avg"?(n?v/n:0):v,color:a2ChColor[a2SelCh]}]};}):[];

  // 선택한 날짜의 낱개 포장량 근거 — 어떤 완제품을 몇 개 만들었고, 제품당 낱개가 몇 개 들어가는지
  const anaPackSelRows=anaPackSelDay?anaRows.filter(r=>(r.plan_date||"").slice(0,10)===anaPackSelDay):[];
  const anaPackSelMap={};
  anaPackSelRows.forEach(r=>{
    const k=r.p_code;
    if(!anaPackSelMap[k])anaPackSelMap[k]={qty:0};
    anaPackSelMap[k].qty+=r.qty||0;
  });
  const anaPackSelDetail=Object.keys(anaPackSelMap).map(k=>{
    const unitsPerProduct=bomOf(k).reduce((a,c)=>a+(c.qty||0),0);
    return{code:k,label:pName(k),qty:anaPackSelMap[k].qty,unitsPerProduct,packQty:anaPackSelMap[k].qty*unitsPerProduct};
  }).sort((a,b)=>b.packQty-a.packQty);
  const anaPackSelTotalQty=anaPackSelDetail.reduce((a,b)=>a+b.qty,0);
  const anaPackSelTotalPack=anaPackSelDetail.reduce((a,b)=>a+b.packQty,0);
  const anaPackSelWeekday=anaPackSelDay?WEEKDAY_KR[new Date(anaPackSelDay+"T00:00:00Z").getUTCDay()]+"요일":"";

  // 선택한 날짜(anaSelDay)의 가동률 근거 상세 — 어떤 제품을 몇 개, 몇 시간 생산했는지
  const anaSelRows=anaSelDay?anaRows.filter(r=>(r.plan_date||"").slice(0,10)===anaSelDay):[];
  const anaSelMap={};
  anaSelRows.forEach(r=>{
    const k=r.p_code;
    if(!anaSelMap[k])anaSelMap[k]={qty:0,hours:0};
    anaSelMap[k].qty+=r.qty||0;
    anaSelMap[k].hours+=secToHour((r.qty||0)*speedOf(k));
  });
  const anaSelDetail=Object.keys(anaSelMap).map(k=>({code:k,label:pName(k),speed:speedOf(k),qty:anaSelMap[k].qty,hours:anaSelMap[k].hours})).sort((a,b)=>b.hours-a.hours);
  const anaSelTotalQty=anaSelDetail.reduce((a,b)=>a+b.qty,0);
  const anaSelTotalHours=anaSelDetail.reduce((a,b)=>a+b.hours,0);
  const anaSelDailyAvail=anaSelDay?anaDailyAvailOf(anaSelDay):null;
  const anaSelRate=anaSelDailyAvail?(anaSelTotalHours/anaSelDailyAvail*100):0;
  const anaSelWeekday=anaSelDay?WEEKDAY_KR[new Date(anaSelDay+"T00:00:00Z").getUTCDay()]+"요일":"";

  // 업체별 집계
  // 업체별 집계 — 완제품 수량 + 낱개 기준 수량(완제품 × BOM 구성품 총 수량)
  const anaChannelMap={};
  const anaChannelUnitMap={};
  const anaChannelNoBom={};
  anaRows.forEach(r=>{
    const k=r.channel||"미입력";
    const unitsPerProduct=bomOf(r.p_code).reduce((a,c)=>a+(c.qty||0),0);
    anaChannelMap[k]=(anaChannelMap[k]||0)+(r.qty||0);
    anaChannelUnitMap[k]=(anaChannelUnitMap[k]||0)+(r.qty||0)*unitsPerProduct;
    if(!unitsPerProduct&&(r.qty||0)>0)anaChannelNoBom[k]=true;
  });
  const anaChannelUnitTotal=Object.values(anaChannelUnitMap).reduce((a,v)=>a+v,0);
  const anaChannelStats=Object.keys(anaChannelMap).map(k=>{
    const ch=channels.find(c=>c.name===k);
    const value=anaChannelMap[k],unit=anaChannelUnitMap[k]||0;
    const rate=value/(anaTotalQty||1)*100,unitRate=unit/(anaChannelUnitTotal||1)*100;
    return{label:k,value,unit,rate,unitRate,diff:unitRate-rate,noBom:!!anaChannelNoBom[k],color:ch?.color||"#556655",color2:ch?.color2||null};
  }).sort((a,b)=>anaChSort==="unit"?(b.unit-a.unit):(b.value-a.value));

  // ── 금일 가동률 계산 (오늘 plan_date 주문 기준) ──
  const tdStr=today();
  const tdOrders=orders.filter(o=>(o.plan_date||"").slice(0,10)===tdStr&&!String(o.id).startsWith("temp_"));
  const tdHoursOf=o=>secToHour((o.qty||0)*speedOf(o.p_code));
  const tdDone=tdOrders.filter(o=>o.status==="완료");
  const tdConfirmed=tdOrders.filter(o=>o.status==="확정");
  const tdDoneH=tdDone.reduce((a,o)=>a+tdHoursOf(o),0);
  const tdConfH=tdConfirmed.reduce((a,o)=>a+tdHoursOf(o),0);
  const tdPlanH=tdOrders.reduce((a,o)=>a+tdHoursOf(o),0); // 대기+투입완료+확정+완료 전체
  const tdDoneQty=tdDone.reduce((a,o)=>a+(o.qty||0),0);
  const tdPlanQty=tdOrders.reduce((a,o)=>a+(o.qty||0),0);
  const tdDonePack=tdDone.reduce((a,o)=>a+(o.qty||0)*bomOf(o.p_code).reduce((s,c)=>s+(c.qty||0),0),0);
  const tdLineH=ln=>tdDone.filter(o=>(o.line||"A")===ln).reduce((a,o)=>a+tdHoursOf(o),0);
  const tdNoSpeed=[...new Set(tdOrders.filter(o=>!speedOf(o.p_code)).map(o=>o.p_code))];
  const tdAvail=(todayNote&&todayNote.workers!=null&&todayNote.hours!=null)?(Number(todayNote.workers)*Number(todayNote.hours)+(Number(todayNote.overtime)||0)):null;
  const tdRate=tdAvail?tdDoneH/tdAvail*100:null;      // 실적 가동률 (완료 기준)
  const tdPlanRate=tdAvail?tdPlanH/tdAvail*100:null;  // 계획 가동률 (오늘 등록 전체 기준)
  const rateColor=r=>r==null?"#8a9a88":r>=80?"#6fcf97":r>=50?"#f5c97a":"#e89090";

  // ──────────────────────────────────────

  return(
    <div style={{minHeight:"100vh"}}>
      {showPlanSetting&&<PlanSettingModal/>}
      {pwModal&&<PwModal title={pwModal.title} desc={pwModal.desc} onConfirm={()=>{pwModal.action();setPwModal(null);}} onClose={()=>setPwModal(null)}/>}
      {nameModal&&<NameModal title={nameModal.title} desc={nameModal.desc} onConfirm={async(name)=>{await nameModal.onConfirm(name);setNameModal(null);}} onClose={()=>setNameModal(null)}/>}

      {/* 헤더 */}
      <div style={{background:"linear-gradient(90deg,#2c2c2a,#484844,#2c2c2a)",borderBottom:"2px solid #7a9a6a",padding:"12px 20px",display:"flex",alignItems:"center",gap:12,boxShadow:"0 4px 18px rgba(0,0,0,.35)",flexWrap:"wrap"}}>
        <span style={{fontSize:24}}>☕</span>
        <div>
          <div style={{fontSize:16,fontWeight:700,color:"#e8f0e0",letterSpacing:1}}>드립백 생산 관리 시스템</div>
          <div style={{fontSize:11,color:"#6fcf97"}}>🟢 변경 감지 동기화(10초) · FIFO · BOM · v{APP_VERSION}</div>
        </div>
        <KstClock/>
        {/* 낱개 총 재고 요약 */}
        {(()=>{

                  {[

                    ["A",doneA.length,"#8ecf90"],
                    ["B",doneB.length,"#8ac8f0"],
                    ["미입력",doneAll.filter(o=>!o.erp_done).length,"#f0b070"],
                  ].map(([l,cnt,color])=>(
                    <button key={l} onClick={()=>setDoneLineFilter(l)}
                      style={{background:doneLineFilter===l?color+"33":"rgba(255,255,255,.06)",border:"1px solid "+(doneLineFilter===l?color+"88":"#7a8a7044"),borderRadius:20,color:doneLineFilter===l?color:"#c8c8b8",padding:"5px 16px",fontSize:13,fontWeight:doneLineFilter===l?700:400,cursor:"pointer",fontFamily:"inherit"}}>
                      {l==="전체"?"⚪ 전체":l==="A"?"🟢 A라인":l==="B"?"🔵 B라인":"⚠ ERP 미입력"} <span style={{marginLeft:4,opacity:.8}}>{cnt}건</span>
                    </button>
                  ))}
                </div>
              );

            {/* 생산계획 — 다중 선택 */}
            {orderTab==="생산계획"&&viewOrders.filter(o=>o.status==="대기"||o.status==="투입완료").length>0&&(
              <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:12,padding:"8px 14px",background:"rgba(255,255,255,.05)",border:"1px solid #7a8a7044",borderRadius:8,flexWrap:"wrap"}}>
                <span style={{color:"#a8b8a0",fontSize:13,fontWeight:700}}>다중 선택:</span>
                <button onClick={()=>checkAll(viewOrders.filter(o=>o.status==="대기"||o.status==="투입완료").map(o=>o.id))} style={{background:"rgba(255,255,255,.1)",border:"1px solid #7a8a7055",borderRadius:6,color:"#d8ecca",padding:"4px 12px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>☑ 전체</button>
                <button onClick={()=>checkAll(viewOrders.filter(o=>o.status==="투입완료").map(o=>o.id))} style={{background:"rgba(255,255,255,.1)",border:"1px solid #7a8a7055",borderRadius:6,color:"#8ac8f0",padding:"4px 12px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>☑ 투입완료만</button>

                {/* ★ 전체 낱개투입 */}

                  style={{background:"linear-gradient(135deg,#2a5a3a,#3a7a4a)",border:"1px solid #4a9a5a66",borderRadius:6,color:"#6fcf97",padding:"4px 16px",fontSize:12,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>
                  ⚡ 전체 낱개투입
                </button>
                {/* ★ 선택 낱개투입 */}
                <button onClick={async()=>{
                  if(!checkedOrders.size)return alert("투입할 항목을 선택하세요.");
                  const ids=[...checkedOrders].filter(id=>orders.find(o=>o.id===id)?.status==="대기");
                  if(!ids.length)return alert("대기 상태 항목만 낱개투입할 수 있습니다.");
                  pollPaused.current=true;
                  try{
                    let cur=await fetchStock(); // ★ 배치 시작 전 최신 재고 재조회
                    for(const id of ids){cur=await investCore(id,cur);if(!cur)break;}
                  }finally{resumePoll();}
                  setCheckedOrders(new Set());
                }} style={{background:"linear-gradient(135deg,#1a4a2a,#2a6a3a)",border:"1px solid #3a7a4a55",borderRadius:6,color:"#8ecf90",padding:"4px 16px",fontSize:12,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>
                  ⚡ 선택 낱개투입 {checkedOrders.size>0?"("+checkedOrders.size+"건)":""}
                </button>
                <button onClick={async()=>{
                  if(!checkedOrders.size)return alert("항목을 선택하세요.");
                  const ids=[...checkedOrders].filter(id=>{const o=orders.find(o=>o.id===id);return o?.status==="투입완료"||o?.status==="대기";});
                  if(!ids.length)return alert("확정할 수 있는 항목이 없습니다.");
                  pollPaused.current=true;
                  try{
                    setOrders(prev=>prev.map(o=>ids.includes(o.id)?{...o,status:"확정"}:o));
                    setCheckedOrders(new Set());
                    await Promise.all(ids.map(id=>sb.from("drip2_orders").update({status:"확정"}).eq("id",id)));
                  }finally{resumePoll();}
                }} style={{background:"linear-gradient(135deg,#7a6020,#b08a30)",border:"1px solid #c8a06a66",borderRadius:6,color:"#f5e8a0",padding:"4px 16px",fontSize:12,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>📋 선택 생산확정 {checkedOrders.size>0?"("+checkedOrders.size+"건)":""}</button>
                {/* ★ 선택 회수: 투입완료 → 대기 (낱개 재고 복구) */}

                  if(!checkedOrders.size)return alert("회수할 항목을 선택하세요.");

                  if(!ids.length)return alert("투입완료 상태 항목만 회수할 수 있습니다.");
                  askPw("선택 투입 회수","선택된 "+ids.length+"건의 낱개 재고가 복구되고 대기 상태로 돌아갑니다.",async()=>{
                    pollPaused.current=true;
                    try{
                    // ★ UI 즉시 반영
                    setOrders(prev=>prev.map(o=>ids.includes(o.id)?{...o,status:"대기",detail:null}:o));
                    setCheckedOrders(new Set());
                    // ★ 재고 복구 누적 계산 후 병렬 처리
                    const stockDelta={};
                    const logIds=[];
                    const orderIds=[];
                    for(const id of ids){
                      const order=orders.find(o=>o.id===id);if(!order)continue;
                      if(order.detail?.details){
                        for(const d of order.detail.details)for(const u of (d.used||[])){
                          stockDelta[u.id]=(stockDelta[u.id]||0)+u.qty;
                        }
                      }
                      if(order.detail?.logId)logIds.push(order.detail.logId);
                      orderIds.push(id);
                    }
                    const updatedStock=[...stock];
                    const stockUpdates=Object.entries(stockDelta).map(([sid,delta])=>{
                      const idx=updatedStock.findIndex(s=>String(s.id)===sid);
                      if(idx!==-1){const restored=updatedStock[idx].qty+delta;updatedStock[idx]={...updatedStock[idx],qty:restored};return sb.from("drip2_stock").update({qty:restored}).eq("id",sid);}
                    }).filter(Boolean);
                    setStock(updatedStock);
                    // ★ logId + order_id 둘 다로 로그 삭제
                    setProdLog(prev=>prev.filter(l=>!logIds.includes(l.id)&&!orderIds.includes(l.order_id)));
                    await Promise.all([
                      ...stockUpdates,
                      ...logIds.map(lid=>sb.from("drip2_prod_log").delete().eq("id",lid)),
                      ...orderIds.filter(oid=>!logIds.length).map(oid=>sb.from("drip2_prod_log").delete().eq("order_id",oid)),
                      ...ids.map(id=>sb.from("drip2_orders").update({status:"대기",detail:null}).eq("id",id)),
                    ]);
                    }finally{resumePoll();}
                  });
                }} style={{background:"rgba(90,130,200,.25)",border:"1px solid #5a8fc055",borderRadius:6,color:"#8ac8d8",padding:"4px 16px",fontSize:12,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>↩ 선택 회수 {checkedOrders.size>0?"("+checkedOrders.size+"건)":""}</button>
                <button onClick={()=>{
                  if(!checkedOrders.size)return alert("삭제할 항목을 선택하세요.");
                  askPw("선택 주문 삭제","선택된 "+checkedOrders.size+"건을 삭제합니다. 투입완료 항목은 재고가 복구됩니다.",async()=>{
                    pollPaused.current=true;
                    try{
                    const ids=[...checkedOrders];
                    // ★ UI 즉시 반영
                    setOrders(prev=>prev.filter(o=>!ids.includes(o.id)));
                    setCheckedOrders(new Set());
                    // ★ 재고 복구 누적 계산 후 병렬 처리
                    const stockDelta={};
                    const logIds=[];
                    const orderIds=[];
                    for(const id of ids){
                      const order=orders.find(o=>o.id===id);if(!order)continue;
                      if(order.status==="투입완료"&&order.detail?.details){
                        for(const d of order.detail.details)for(const u of (d.used||[])){
                          stockDelta[u.id]=(stockDelta[u.id]||0)+u.qty;
                        }
                        if(order.detail?.logId)logIds.push(order.detail.logId);
                        orderIds.push(id); // order_id 기준 삭제용
                      }
                    }
                    const updatedStock=[...stock];
                    const stockUpdates=Object.entries(stockDelta).map(([sid,delta])=>{
                      const idx=updatedStock.findIndex(s=>String(s.id)===sid);
                      if(idx!==-1){const restored=updatedStock[idx].qty+delta;updatedStock[idx]={...updatedStock[idx],qty:restored};return sb.from("drip2_stock").update({qty:restored}).eq("id",sid);}
                    }).filter(Boolean);
                    setStock(updatedStock);
                    // ★ logId + order_id 둘 다로 로그 삭제
                    setProdLog(prev=>prev.filter(l=>!logIds.includes(l.id)&&!orderIds.includes(l.order_id)));
                    await Promise.all([
                      ...stockUpdates,
                      ...logIds.map(lid=>sb.from("drip2_prod_log").delete().eq("id",lid)),
                      ...orderIds.filter(oid=>!logIds.length).map(oid=>sb.from("drip2_prod_log").delete().eq("order_id",oid)),
                      ...ids.map(id=>sb.from("drip2_orders").delete().eq("id",id)),
                    ]);
                    }finally{resumePoll();}
                  });
                }} style={{background:"rgba(160,60,60,.3)",border:"1px solid #c0606055",borderRadius:6,color:"#f08080",padding:"4px 14px",fontSize:12,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>🗑 선택 삭제 {checkedOrders.size>0?"("+checkedOrders.size+"건)":""}</button>
              </div>

                    // ★ 재고 복구 누적 계산
                    const stockDelta={};
                    const logIds=[];

                        for(const d of order.detail.details)for(const u of (d.used||[])){

                        }
                      }
                      if(order.detail?.logId)logIds.push(order.detail.logId);
                      orderIds.push(id);
                    }
                    const updatedStock=[...stock];
                    const stockUpdates=Object.entries(stockDelta).map(([sid,delta])=>{
                      const idx=updatedStock.findIndex(s=>String(s.id)===sid);
                      if(idx!==-1){const restored=updatedStock[idx].qty+delta;updatedStock[idx]={...updatedStock[idx],qty:restored};return sb.from("drip2_stock").update({qty:restored}).eq("id",sid);}
                    }).filter(Boolean);

                    setProdLog(prev=>prev.filter(l=>!logIds.includes(l.id)&&!orderIds.includes(l.order_id)));

                    const orderIds=[];
                    for(const id of ids){

                        for(const d of order.detail.details)for(const u of (d.used||[])){
                          stockDelta[u.id]=(stockDelta[u.id]||0)+u.qty;
                        }
                        if(order.detail?.logId)logIds.push(order.detail.logId);
                        orderIds.push(id);
                      }
                    }
                    const updatedStock=[...stock];
                    const stockUpdates=Object.entries(stockDelta).map(([sid,delta])=>{
                      const idx=updatedStock.findIndex(s=>String(s.id)===sid);
                      if(idx!==-1){const restored=updatedStock[idx].qty+delta;updatedStock[idx]={...updatedStock[idx],qty:restored};return sb.from("drip2_stock").update({qty:restored}).eq("id",sid);}
                    }).filter(Boolean);

                      if(!window.confirm(`${myLine}라인 → ${newLine}라인으로 이동하시겠습니까?`))return;

                      const target=parseInt(input);
                      if(isNaN(target)||target<1||target>total){alert(`1~${total} 사이 숫자를 입력하세요.`);return;}
                      if(target===myRank)return;
                      // 같은 라인 내 재정렬
                      const reordered=[...sameLineList];
                      const[moved]=reordered.splice(myRank-1,1);
                      reordered.splice(target-1,0,moved);
                      const sortedPriorities=sameLineList.map(o=>o.priority).sort((a,b)=>a-b);
                      const updates=reordered.map((o,i)=>({id:o.id,priority:sortedPriorities[i]}));
                      setOrders(prev=>prev.map(o=>{const u=updates.find(x=>x.id===o.id);return u?{...o,priority:u.priority}:o;}));

                            {/* 체크박스 */}
                            <div style={{paddingTop:15,flexShrink:0}}>
                              <input type="checkbox" checked={checkedOrders.has(order.id)} onChange={()=>toggleCheck(order.id)} style={{width:18,height:18,cursor:"pointer",accentColor:"#f5c97a"}}/>

                              <OrderCard order={order} pName={pName} sName={sName} fmtDate={fmtDate}
                                invest={invest} delOrder={delOrder} updateOrder={updateOrder}
                                confirmOrder={confirmOrder} completeOrder={completeOrder} revertOrder={revertOrder} cancelOrder={cancelOrder} addExtraQty={addExtraQty}

                                moveOrder={null} isFirst={idx===0} isLast={idx===confirmedList.length-1}
                                channels={channels} shipTypeNames={shipTypeNames}/>
                            </div>
                          </div>
                        </div>
                      );
                    });
                  })()}
                </div>
            )}

            {/* 완료 목록 */}

                              ]);
                              setChannels(p=>{const n=[...p];const ci=n.findIndex(x=>x.id===ch.id);const ni=n.findIndex(x=>x.id===next.id);[n[ci],n[ni]]=[n[ni],n[ci]];return n;});
                            }} disabled={idx===arr.length-1} style={{background:"rgba(255,255,255,.08)",border:"1px solid #7a8a7044",borderRadius:4,color:"#a8b8a0",padding:"1px 7px",fontSize:12,cursor:idx===arr.length-1?"default":"pointer",opacity:idx===arr.length-1?.3:1,fontFamily:"inherit"}}>▼</button>
                          </div>
                          <button onClick={()=>toggleChActive(ch.id,ch.active===false)} style={{background:"rgba(255,255,255,.08)",border:"1px solid #7a8a7055",borderRadius:6,color:"#c8ddb8",padding:"4px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>{ch.active!==false?"비활성화":"활성화"}</button>
                          <button onClick={()=>startEditCh(ch)} style={{background:"rgba(200,130,26,.2)",border:"1px solid #c8821a44",borderRadius:6,color:"#c8a06a",padding:"4px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>✏️ 수정</button>
                          <button onClick={()=>delChannel(ch.id)} style={{...delBtn,padding:"4px 10px",fontSize:12}}>✕ 삭제</button>
                        </div>
                      </>
                    )}
                  </div>
                ))}
              </div>

              {/* 업체 추가 */}
              <div style={{borderTop:"1px solid #7a8a7033",paddingTop:16}}>
                <div style={{fontSize:13,color:"#a8b8a0",marginBottom:10,fontWeight:600}}>➕ 새 업체 추가</div>
                <div style={{display:"flex",gap:10,alignItems:"flex-end",flexWrap:"wrap"}}>
                  <LblInp label="업체명" value={newChannel.name} onChange={v=>setNewChannel(f=>({...f,name:v}))} placeholder="예: 컬리" width={120}/>
                  <ColorPicker label="색상1 (필수)" value={newChannel.color} onChange={v=>setNewChannel(f=>({...f,color:v}))}/>
                  <ColorPicker label="색상2 (선택)" value={newChannel.color2} onChange={v=>setNewChannel(f=>({...f,color2:v}))}/>
                  {newChannel.name&&<div style={{alignSelf:"flex-end",paddingBottom:2}}><ChannelBadge name={newChannel.name} color={newChannel.color} color2={newChannel.color2}/></div>}
                  <button onClick={addChannel} style={{...primaryBtn,alignSelf:"flex-end"}}>+ 등록</button>
                </div>
              </div>
            </div>

            {/* 배송구분 관리 */}
            <div style={{background:"rgba(255,255,255,.04)",border:"1px solid #7a8a7044",borderRadius:12,padding:"20px 22px",marginBottom:24}}>
              <div style={{fontSize:15,fontWeight:700,color:"#c8ddb8",marginBottom:6}}>🚚 배송구분 관리</div>
              <div style={{fontSize:12,color:"#8a9a88",marginBottom:14}}>주문 등록·수정 화면의 배송구분 선택 목록이에요. 이름을 바꾸거나 삭제해도 이미 등록된 주문의 값은 그대로 남아요.</div>
              {shipTypes===null?(
                <div style={{padding:"10px 14px",background:"rgba(224,80,80,.12)",border:"1px solid #e0505066",borderRadius:8,fontSize:12,color:"#f0a0a0"}}>⚠️ 배송구분 테이블이 아직 없어서 기본 목록({DEFAULT_SHIP_TYPES.join(", ")})을 쓰고 있어요. 최초 1회 SQL을 실행하면 여기서 직접 관리할 수 있어요.</div>
              ):(<>
                <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:14}}>
                  {shipTypes.length===0&&<div style={{fontSize:13,color:"#8a9a88"}}>등록된 배송구분이 없어요. (없으면 기본 목록이 표시돼요)</div>}
                  {shipTypes.map((t,i)=>(
                    <div key={t.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 12px",background:"rgba(255,255,255,.05)",border:"1px solid "+(editShipTypeId===t.id?"#c8821a77":"#7a8a7044"),borderRadius:8,flexWrap:"wrap"}}>
                      <div style={{display:"flex",flexDirection:"column",gap:2}}>
                        <button onClick={()=>moveShipType(t.id,-1)} disabled={i===0} style={{background:"rgba(255,255,255,.08)",border:"1px solid #7a8a7044",borderRadius:4,color:"#a8b8a0",padding:"0 7px",fontSize:11,cursor:i===0?"default":"pointer",opacity:i===0?.3:1,fontFamily:"inherit"}}>▲</button>
                        <button onClick={()=>moveShipType(t.id,1)} disabled={i===shipTypes.length-1} style={{background:"rgba(255,255,255,.08)",border:"1px solid #7a8a7044",borderRadius:4,color:"#a8b8a0",padding:"0 7px",fontSize:11,cursor:i===shipTypes.length-1?"default":"pointer",opacity:i===shipTypes.length-1?.3:1,fontFamily:"inherit"}}>▼</button>
                      </div>
                      <span style={{color:"#8a9a88",fontSize:12,width:18,textAlign:"center"}}>{i+1}</span>
                      {editShipTypeId===t.id?(<>
                        <input autoFocus value={editShipTypeName} onChange={e=>setEditShipTypeName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")saveShipTypeName(t.id);if(e.key==="Escape")setEditShipTypeId(null);}} style={{...inp,width:160}}/>
                        <button onClick={()=>saveShipTypeName(t.id)} style={{...primaryBtn,fontSize:12,padding:"4px 12px"}}>저장</button>
                        <button onClick={()=>setEditShipTypeId(null)} style={{...delBtn,fontSize:12}}>취소</button>
                      </>):(<>
                        <span style={{flex:1,color:"#f5c97a",fontWeight:700,fontSize:14}}>🚚 {t.name}</span>
                        <button onClick={()=>{setEditShipTypeId(t.id);setEditShipTypeName(t.name);}} style={{background:"rgba(200,130,26,.2)",border:"1px solid #c8821a44",borderRadius:6,color:"#c8a06a",padding:"4px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>✏️ 수정</button>
                        <button onClick={()=>delShipType(t)} style={{...delBtn,fontSize:12}}>✕ 삭제</button>
                      </>)}
                    </div>
                  ))}
                </div>
                <div style={{display:"flex",gap:8,alignItems:"flex-end",borderTop:"1px solid #7a8a7033",paddingTop:14}}>
                  <LblInp label="새 배송구분" value={newShipType} onChange={setNewShipType} placeholder="예) 용차" width={160}/>
                  <button onClick={addShipType} style={{...primaryBtn,alignSelf:"flex-end"}}>+ 추가</button>
                </div>
              </>)}
            </div>

            {/* 내 비밀번호 변경 */}
            <div style={{background:"rgba(255,255,255,.04)",border:"1px solid #7a8a7044",borderRadius:12,padding:"20px 22px",marginBottom:24}}>
              <div style={{fontSize:15,fontWeight:700,color:"#c8ddb8",marginBottom:14}}>🔑 내 비밀번호 변경</div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
                <LblInp label="현재 비밀번호" type="password" value={pwChange.cur} onChange={v=>{setPwChange(p=>({...p,cur:v}));setPwChangeMsg(null);}} placeholder="현재 비밀번호" width={150}/>
                <LblInp label="새 비밀번호" type="password" value={pwChange.next} onChange={v=>{setPwChange(p=>({...p,next:v}));setPwChangeMsg(null);}} placeholder="새 비밀번호 (4자 이상)" width={160}/>
                <LblInp label="새 비밀번호 확인" type="password" value={pwChange.confirm} onChange={v=>{setPwChange(p=>({...p,confirm:v}));setPwChangeMsg(null);}} placeholder="다시 입력" width={150}/>
                <button onClick={changePw} style={{...primaryBtn,alignSelf:"flex-end"}}>변경</button>
              </div>
              {pwChangeMsg&&<div style={{marginTop:10,padding:"8px 12px",borderRadius:8,fontSize:13,background:pwChangeMsg.type==="ok"?"rgba(76,175,80,.15)":"rgba(220,70,70,.15)",border:"1px solid "+(pwChangeMsg.type==="ok"?"#4caf5055":"#e0707055"),color:pwChangeMsg.type==="ok"?"#6fcf97":"#f08080"}}>{pwChangeMsg.msg}</div>}
            </div>

            {/* 계정 정보 */}
            <div style={{background:"rgba(255,255,255,.04)",border:"1px solid #7a8a7044",borderRadius:12,padding:"20px 22px"}}>
              <div style={{fontSize:15,fontWeight:700,color:"#c8ddb8",marginBottom:14}}>👤 계정 정보</div>
              <div style={{display:"flex",gap:16,flexWrap:"wrap",alignItems:"center"}}>
                <div style={{background:"rgba(255,255,255,.06)",borderRadius:8,padding:"12px 18px"}}>
                  <div style={{fontSize:12,color:"#8a9a88",marginBottom:4}}>현재 로그인</div>
                  <div style={{color:"#f5c97a",fontWeight:700}}>👤 {user.user_id}</div>
                </div>
                <button onClick={logout} style={{background:"rgba(200,80,80,.2)",border:"1px solid #c0606055",borderRadius:8,color:"#e89090",padding:"8px 18px",fontSize:13,cursor:"pointer",fontFamily:"inherit",fontWeight:600}}>🚪 로그아웃</button>
              </div>
              <div style={{marginTop:16,padding:"10px 14px",background:"rgba(100,160,80,.1)",border:"1px solid #6a9a5033",borderRadius:8,fontSize:12,color:"#a8c898",lineHeight:1.6}}>
                💡 새 계정 추가 / 비밀번호 초기화는 로그인 화면의 <strong style={{color:"#c8ddb8"}}>계정 만들기 / 비밀번호 변경</strong> 탭을 이용하세요. (마스터 코드 필요)
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
