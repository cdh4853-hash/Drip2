// ── 날짜 유틸 ──
function parseDate(raw){
  if(!raw)return null;
  const s=String(raw).replace(/-/g,"").trim();
  if(s.length!==8)return null;
  const d=new Date(s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6,8));
  return isNaN(d)?null:d;
}
function fmtDate(d){
  if(!d)return"-";
  const dt=typeof d==="string"?new Date(d):d;
  return isNaN(dt)?"-":dt.toISOString().slice(0,10).replace(/-/g,"");
}
// 오늘 날짜 항상 동적 계산 — 대한민국 서울(KST, UTC+9) 기준
function today(){return new Date(new Date().getTime()+9*60*60*1000).toISOString().slice(0,10);}
function addDays(ymd,n){const d=new Date(ymd);d.setDate(d.getDate()+n);return new Date(d.getTime()+9*60*60*1000).toISOString().slice(0,10);}
// YYYYMMDD 형식 검증
function validateYMD8(raw){
  const s=String(raw||"").replace(/-/g,"").trim();
  if(!/^\d{8}$/.test(s))return null;
  const d=new Date(s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6,8));
  return isNaN(d)?null:d;
}

// ── 재고 차감 ──
function fifoDeduct(stock,sCode,need){
  const sorted=stock.filter(s=>s.s_code===sCode&&s.qty>0).sort((a,b)=>new Date(a.expiry)-new Date(b.expiry));
  let rem=need;const used=[];const next=stock.map(s=>({...s}));
  for(const s of sorted){
    if(rem<=0)break;
    const take=Math.min(s.qty,rem);
    used.push({expiry:s.expiry,qty:take,id:s.id});
    rem-=take;
    const idx=next.findIndex(x=>x.id===s.id);
    if(idx!==-1)next[idx].qty-=take;
  }
  return{ok:rem===0,used,next,shortage:rem};
}
function smartDeduct(stock,sCode,need){
  const exps=[...new Set(stock.filter(s=>s.s_code===sCode&&s.qty>0).map(s=>s.expiry))].sort();
  for(const exp of exps){
    const rows=stock.filter(s=>s.s_code===sCode&&s.qty>0&&s.expiry===exp);
    const total=rows.reduce((sum,s)=>sum+s.qty,0);
    if(total>=need){
      let rem=need;const used=[];const next=stock.map(s=>({...s}));
      for(const s of rows){
        if(rem<=0)break;
        const take=Math.min(s.qty,rem);
        used.push({expiry:s.expiry,qty:take,id:s.id});
        rem-=take;
        const idx=next.findIndex(x=>x.id===s.id);
        if(idx!==-1)next[idx].qty-=take;
      }
      return{ok:true,used,next,shortage:0};
    }
  }
  return fifoDeduct(stock,sCode,need);
}
function findUnifiedExpiry(stock,recipe,totalQty){
  const allExp=[...new Set(stock.filter(s=>s.qty>0).map(s=>s.expiry))].sort();
  for(const exp of allExp){
    let ok=true;
    for(const comp of recipe){
      const need=comp.qty*totalQty;
      const total=stock.filter(s=>s.s_code===comp.s_code&&s.qty>0&&s.expiry===exp).reduce((sum,s)=>sum+s.qty,0);
      if(total<need){ok=false;break;}
    }
    if(ok)return exp;
  }
  return null;
}
function makeLotKey(d){return d.map(x=>x.sCode+":"+x.expiry).sort().join("|");}
async function assignLot(finExp,detailsWithExp,p_code){
  const curKey=makeLotKey(detailsWithExp);
  const{data:logs}=await sb.from("drip2_prod_log").select("lot,lot_key").eq("p_code",p_code).not("lot","is",null).order("created_at",{ascending:true});
  const validLogs=(logs||[]).filter(l=>l.lot&&l.lot_key);
  const existing=validLogs.find(l=>l.lot_key===curKey);
  if(existing)return existing.lot;
  const usedAlpha=new Set(validLogs.filter(l=>l.lot&&l.lot.startsWith(finExp)).map(l=>l.lot.slice(-1)));
  for(let i=0;i<26;i++){const alpha=String.fromCharCode(65+i);if(!usedAlpha.has(alpha))return finExp+alpha;}
  return finExp+"Z";
}

// ══ 대한민국 시계 (KST) ══════════════════
function KstClock(){
  const[now,setNow]=useState(()=>new Date(new Date().getTime()+9*60*60*1000));
  useEffect(()=>{const t=setInterval(()=>setNow(new Date(new Date().getTime()+9*60*60*1000)),1000);return()=>clearInterval(t);},[]);
  const yyyy=now.getUTCFullYear();
  const mm=String(now.getUTCMonth()+1).padStart(2,"0");
  const dd=String(now.getUTCDate()).padStart(2,"0");
  const hh=String(now.getUTCHours()).padStart(2,"0");
  const mi=String(now.getUTCMinutes()).padStart(2,"0");
  const ss=String(now.getUTCSeconds()).padStart(2,"0");
  const days=["일","월","화","수","목","금","토"];
  const day=days[now.getUTCDay()];
  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"5px 14px",background:"rgba(255,255,255,.07)",border:"1px solid #6a8a5a55",borderRadius:10,lineHeight:1.3}}>
      <div style={{fontSize:11,color:"#8ecf90",fontWeight:600,letterSpacing:.5}}>🇰🇷 대한민국 (KST)</div>
      <div style={{fontSize:13,color:"#f5c97a",fontWeight:700,letterSpacing:.5}}>{yyyy}.{mm}.{dd} ({day})</div>
      <div style={{fontSize:17,color:"#e8f0e0",fontWeight:700,fontVariantNumeric:"tabular-nums",letterSpacing:1}}>{hh}:{mi}:{ss}</div>
    </div>
  );
}

                      <span style={{fontSize:FS.qty,fontWeight:900,color:qtyColor,fontFamily:"monospace",textShadow:isTop?`0 0 14px ${qtyGlow}`:"none",lineHeight:1}}>{o.qty.toLocaleString()}</span>
                      <span style={{fontSize:FS.unit,color:chipLabel}}>개</span>
                      <span style={{background:chGrad,color:"#fff",border:"2px solid rgba(255,255,255,.55)",borderRadius:6,padding:fullWidth?(isTop?"8px 20px":"4px 12px"):(isTop?"4px 10px":"2px 8px"),fontSize:FS.badge,fontWeight:700,textShadow:"0 1px 3px rgba(0,0,0,.6)",whiteSpace:"nowrap"}}>{o.channel||"-"}</span>
                    </div>

                    {/* ── 예정일·LOT·소비기한 ── */}
                    <div style={{display:"flex",gap:fullWidth?10:6,flexWrap:"wrap"}}>
                      {[["예정일",o.plan_date?fd(o.plan_date):"-"],["LOT",o.detail?.lot?"LOT "+o.detail.lot:"-"],["소비기한",o.detail?.finExp?fd(o.detail.finExp):"-"]].map(([l,v])=>{
                        const isLot=l==="LOT";
                        const valSize=FS.val*1.4|0; // 전부 LOT 크기로 통일
                        return(
                          <div key={l} style={{background:isLot?"rgba(200,130,26,.15)":`rgba(${accent==="green"?"0,255,136":"68,170,255"},.06)`,border:"1px solid "+(isLot?"rgba(200,130,26,.5)":chipBorder),borderRadius:6,padding:fullWidth?(isTop?"6px 14px":"3px 10px"):(isTop?"3px 8px":"2px 6px")}}>
                            <div style={{fontSize:FS.lbl,color:isLot?"#c8a06a":chipLabel,letterSpacing:.5,marginBottom:2}}>{l}</div>
                            <div style={{fontSize:valSize,fontWeight:700,color:isLot?"#f5c97a":"#f0f8f0",fontFamily:"monospace"}}>{v}</div>
                          </div>
                        );
                      })}
                    </div>
                    {isTop&&(o.detail?.details||[]).length>0&&(
                      <div style={{borderTop:"1px solid "+(accent==="green"?"rgba(0,255,136,.15)":"rgba(68,170,255,.15)"),paddingTop:fullWidth?(isTop?10:6):(isTop?6:4),marginTop:2}}>
                        <div style={{fontSize:FS.lbl,color:chipLabel,fontWeight:700,letterSpacing:1,marginBottom:fullWidth?(isTop?8:4):(isTop?5:3)}}>📦 낱개 투입</div>
                        <div style={{display:"flex",flexDirection:"column",gap:fullWidth?(isTop?8:5):(isTop?5:3)}}>
                          {(o.detail.details||[]).map((d,j)=>(
                            <div key={j} style={{display:"flex",alignItems:"center",gap:fullWidth?(isTop?14:8):(isTop?8:5),flexWrap:"wrap",
                              background:`rgba(${accent==="green"?"0,255,136":"68,170,255"},.04)`,
                              border:"1px solid "+chipBorder,borderRadius:6,
                              padding:fullWidth?(isTop?"8px 14px":"4px 10px"):(isTop?"4px 8px":"2px 6px")}}>
                              {/* 낱개 품명 — 완제품명과 같은 크기 */}
                              <span style={{fontSize:FS.sName,fontWeight:900,color:"#e0f0e0",lineHeight:1.1,wordBreak:"keep-all"}}>{sn(d.sCode)}</span>
                              {/* 낱개 수량 */}
                              <span style={{fontSize:FS.sQty,fontWeight:900,color:qtyColor,fontFamily:"monospace",lineHeight:1}}>{d.total}</span>
                              <span style={{fontSize:FS.unit,color:chipLabel}}>개</span>
                              {/* 소비기한 — 크게 강조 */}
                              <span style={{fontSize:FS.sExp,fontWeight:700,color:"#f5c97a",fontFamily:"monospace",background:"rgba(200,130,26,.15)",border:"1px solid rgba(200,130,26,.3)",borderRadius:5,padding:fullWidth?(isTop?"4px 12px":"2px 8px"):(isTop?"2px 8px":"1px 6px")}}>{fd(d.expiry)}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  };
  // ── 생산순서 화면 (A만 있으면 전체화면, A+B면 분할) ──
  const ScreenOrder=()=>{
    const hasA=lineA.length>0;
    const hasB=lineB.length>0;
    return(
      <div style={{display:"flex",gap:14,alignItems:"flex-start"}}>
        {hasA&&<LineColumn lineOrders={lineA} lineLabel="🟢 A 라인" accent="green" accentDim={DB_GREEN_DIM} fullWidth={!hasB}/>}
        {hasA&&hasB&&<div style={{width:2,background:"linear-gradient(180deg,transparent,#3a4a3a,transparent)",flexShrink:0}}/>}
        {hasB&&<LineColumn lineOrders={lineB} lineLabel="🔵 B 라인" accent="blue" accentDim={DB_BLUE_DIM} fullWidth={!hasA}/>}
        {!hasA&&!hasB&&(
          <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16,color:"#2a4a2a"}}>
            <div style={{fontSize:72}}>🏭</div>
            <div style={{fontSize:32,fontWeight:700,letterSpacing:2}}>생산확정 항목 없음</div>
          </div>
        )}
      </div>
    );
  };
  // ── 생산현황 화면 ──
  const ScreenStatus=()=>{
    const allDone=[...orders].filter(o=>o.status==="완료"&&(o.plan_date||"").slice(0,10)===todayDate);
    const lineAQty=lineA.reduce((s,o)=>s+o.qty,0);
    const lineBQty=lineB.reduce((s,o)=>s+o.qty,0);
    const totalQty=lineAQty+lineBQty;
    const maxQtyAll=Math.max(...[...lineA,...lineB].map(o=>o.qty),1);

    // 업체별 집계
    const chSummary={};
    confirmed.forEach(o=>{
      if(!chSummary[o.channel])chSummary[o.channel]={qty:0,cnt:0};
      chSummary[o.channel].qty+=o.qty;
      chSummary[o.channel].cnt+=1;
    });
    const chSummaryArr=Object.entries(chSummary).sort((a,b)=>b[1].qty-a[1].qty);

    // 글자 크기 자동 조절 — 건수 많을수록 작게
    const totalItems=lineA.length+lineB.length;
    const nameFontSize=totalItems>10?13:totalItems>6?15:17;
    const qtyFontSize=totalItems>10?16:totalItems>6?18:22;

    const LineCol=({label,accent,list})=>{
      const qtyColor=accent==="green"?DB_GREEN:DB_BLUE;
      const qtyDim=accent==="green"?DB_GREEN_DIM:DB_BLUE_DIM;
      const borderCol=accent==="green"?"rgba(0,255,136,.25)":"rgba(68,170,255,.25)";
      const bgCol=accent==="green"?"rgba(0,255,136,.04)":"rgba(68,170,255,.04)";
      const lineQty=list.reduce((s,o)=>s+o.qty,0);
      return(
        <div style={{flex:1,minWidth:0,display:"flex",flexDirection:"column",gap:8}}>
          {/* 라인 헤더 */}
          <div style={{background:bgCol,border:"1px solid "+borderCol,borderRadius:10,padding:"10px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div>
              <div style={{fontSize:18,fontWeight:900,color:qtyColor,letterSpacing:2}}>{label}</div>
              <div style={{fontSize:12,color:qtyDim}}>{list.length}건 확정</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:10,color:qtyDim,letterSpacing:1}}>총 수량</div>
              <div style={{fontSize:36,fontWeight:900,color:qtyColor,fontFamily:"monospace",lineHeight:1}}>{lineQty.toLocaleString()}<span style={{fontSize:12,color:qtyDim,marginLeft:3}}>개</span></div>
            </div>
          </div>
          {/* 건별 전체 목록 */}
          <div style={{background:"rgba(0,0,0,.3)",border:"1px solid "+borderCol,borderRadius:10,padding:"10px 14px",display:"flex",flexDirection:"column",gap:7}}>
            {list.length===0
              ?<div style={{color:qtyDim,fontSize:14,textAlign:"center",padding:"12px 0"}}>확정 없음</div>
              :list.map((o,i)=>{
                const ch=channels.find(c=>c.name===o.channel);
                const chBg=ch?.color||"#556655";
                const chBg2=ch?.color2||null;
                const chGrad=chBg2?`linear-gradient(90deg,${chBg} 50%,${chBg2} 50%)`:chBg;
                const rankColor=accent==="green"?DB_GREEN_DIM:DB_BLUE_DIM;
                return(
                  <div key={o.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",background:"rgba(255,255,255,.04)",borderRadius:7,border:"1px solid rgba(255,255,255,.06)"}}>
                    <span style={{width:20,fontSize:13,fontWeight:700,color:rankColor,fontFamily:"monospace",flexShrink:0}}>{i+1}</span>
                    <span style={{flex:1,fontSize:nameFontSize,fontWeight:700,color:"#d0e8d0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{pName(o.p_code)}</span>
                    <span style={{background:chGrad,color:"#fff",border:"1px solid rgba(255,255,255,.4)",borderRadius:4,padding:"1px 8px",fontSize:11,fontWeight:700,whiteSpace:"nowrap",flexShrink:0}}>{o.channel||"-"}</span>
                    <div style={{width:80,height:7,background:"rgba(255,255,255,.07)",borderRadius:4,overflow:"hidden",flexShrink:0}}>
                      <div style={{height:"100%",width:Math.round(o.qty/maxQtyAll*100)+"%",background:`linear-gradient(90deg,${qtyDim},${qtyColor})`,borderRadius:4}}/>
                    </div>
                    <span style={{fontSize:qtyFontSize,fontWeight:900,color:qtyColor,fontFamily:"monospace",flexShrink:0,minWidth:45,textAlign:"right"}}>{o.qty.toLocaleString()}<span style={{fontSize:10,color:qtyDim,marginLeft:2}}>개</span></span>
                  </div>
                );
              })
            }
          </div>
        </div>
      );
    };

    return(
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {/* 상단 요약 */}
        <div style={{display:"flex",gap:10}}>
          <div style={{flex:1,background:"rgba(200,130,26,.1)",border:"1px solid rgba(200,130,26,.3)",borderRadius:10,padding:"10px 18px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{fontSize:12,color:"#c8a06a",fontWeight:700,letterSpacing:1}}>📦 오늘 전체 확정 수량</div>
            <div style={{fontSize:32,fontWeight:900,color:DB_AMBER,fontFamily:"monospace"}}>{totalQty.toLocaleString()}<span style={{fontSize:13,color:"#c8a06a",marginLeft:5}}>개</span></div>
          </div>
          <div style={{flex:1,background:"rgba(100,175,100,.08)",border:"1px solid rgba(100,175,100,.2)",borderRadius:10,padding:"10px 18px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{fontSize:12,color:"#6a9a6a",fontWeight:700,letterSpacing:1}}>✅ 오늘 완료</div>
            <div style={{fontSize:32,fontWeight:900,color:DB_GREEN,fontFamily:"monospace"}}>{allDone.length}<span style={{fontSize:13,color:"#6a9a6a",marginLeft:5}}>건</span></div>
          </div>
        </div>
        {/* 업체별 요약 */}
        {chSummaryArr.length>0&&(
          <div style={{background:"rgba(0,0,0,.3)",border:"1px solid rgba(255,255,255,.08)",borderRadius:10,padding:"10px 16px"}}>
            <div style={{fontSize:11,color:"#5a7a5a",letterSpacing:2,fontWeight:700,marginBottom:8}}>🏢 업체별 생산 남은 수량</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              {chSummaryArr.map(([name,stat])=>{
                const ch=channels.find(c=>c.name===name);
                const bg=ch?.color||"#556655";
                const bg2=ch?.color2||null;
                const grad=bg2?`linear-gradient(90deg,${bg} 50%,${bg2} 50%)`:bg;
                return(
                  <div key={name} style={{display:"flex",alignItems:"center",gap:8,background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.1)",borderRadius:8,padding:"6px 12px"}}>
                    <span style={{background:grad,color:"#fff",border:"2px solid rgba(255,255,255,.55)",borderRadius:5,padding:"2px 10px",fontSize:12,fontWeight:700,textShadow:"0 1px 2px rgba(0,0,0,.5)",whiteSpace:"nowrap"}}>{name}</span>
                    <div>
                      <div style={{fontSize:10,color:"#5a7a5a"}}>확정 수량</div>
                      <div style={{fontSize:20,fontWeight:900,color:DB_AMBER,fontFamily:"monospace",lineHeight:1}}>{stat.qty.toLocaleString()}<span style={{fontSize:11,color:"#8a7a4a",marginLeft:2}}>개</span></div>
                    </div>
                    <div style={{borderLeft:"1px solid rgba(255,255,255,.1)",paddingLeft:8}}>
                      <div style={{fontSize:10,color:"#5a7a5a"}}>건수</div>
                      <div style={{fontSize:15,fontWeight:700,color:"#a8b8a0",fontFamily:"monospace",lineHeight:1}}>{stat.cnt}건</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}
        {/* A/B 라인 — 건별 전체 표시 */}
        <div style={{display:"flex",gap:14,alignItems:"flex-start"}}>
          <LineCol label="🟢 A 라인" accent="green" list={lineA}/>
          <div style={{width:2,background:"linear-gradient(180deg,transparent,#3a4a3a,transparent)",alignSelf:"stretch",flexShrink:0}}/>
          <LineCol label="🔵 B 라인" accent="blue" list={lineB}/>
        </div>
      </div>
    );
  };

  return(
    <div style={{background:"#0a0c0a",borderRadius:14,position:"relative",border:"1px solid #1a2a1a",boxShadow:"0 0 40px rgba(0,0,0,.8)",minHeight:"calc(100vh - 130px)"}}>
      <div style={{position:"absolute",inset:0,backgroundImage:"repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0px,rgba(0,0,0,.06) 1px,transparent 1px,transparent 3px)",pointerEvents:"none",zIndex:1,borderRadius:14}}/>
      {/* 전광판 헤더 — sticky로 스크롤해도 고정 */}
      <div style={{position:"sticky",top:0,zIndex:20,background:"linear-gradient(90deg,#0a0c0a,#0f1a0f,#0a0c0a)",borderBottom:"2px solid "+DB_GREEN_DIM,padding:"7px 18px",display:"flex",alignItems:"center",justifyContent:"space-between",borderRadius:"14px 14px 0 0"}}>
        <div>
          <div style={{fontSize:13,fontWeight:700,color:DB_GREEN,letterSpacing:2}}>☕ 드립백 생산 전광판</div>
          <div style={{fontSize:10,color:"#3a5a3a",letterSpacing:1}}>MOMOS COFFEE · 2차가공생산팀 · {todayDate}</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <span style={{background:"rgba(0,255,136,.08)",border:"1px solid rgba(0,255,136,.15)",borderRadius:6,padding:"3px 12px",fontSize:11,color:"#3a6a3a",fontWeight:700}}>
            🟢 A라인 {lineA.length}건
          </span>
          <span style={{background:"rgba(68,170,255,.08)",border:"1px solid rgba(68,170,255,.15)",borderRadius:6,padding:"3px 12px",fontSize:11,color:"#3a5a8a",fontWeight:700}}>
            🔵 B라인 {lineB.length}건
          </span>
          <span style={{fontSize:11,color:"#3a5a3a",fontFamily:"monospace",background:"rgba(0,0,0,.3)",border:"1px solid #2a3a2a",borderRadius:6,padding:"3px 10px"}}>
            {dbScreen==="order"?"📋 생산순서":"📊 현황"} {dbScreen==="order"?ORDER_SEC:STATUS_SEC}s
          </span>
          <button onClick={()=>{setDbScreen(s=>s==="order"?"status":"order");}}
            style={{background:"rgba(255,255,255,.08)",border:"1px solid rgba(255,255,255,.15)",borderRadius:6,color:"#a8b8a0",padding:"3px 12px",fontSize:11,cursor:"pointer",fontFamily:"inherit",fontWeight:700,letterSpacing:.5}}>
            {dbScreen==="order"?"📊 현황 보기":"📋 순서 보기"}
          </button>
        </div>
      </div>
      {/* 화면 영역 — 자유롭게 늘어남 */}
      <div style={{padding:"10px 14px",position:"relative",zIndex:2}}>
        {dbScreen==="order"?<ScreenOrder/>:<ScreenStatus/>}
      </div>
      {/* 전환 진행바 */}
      <div style={{height:3,background:"#1a2a1a",borderRadius:"0 0 14px 14px",position:"sticky",bottom:0,zIndex:20}}>
        <div style={{height:"100%",width:dbFillPct+"%",background:`linear-gradient(90deg,${DB_GREEN_DIM},${DB_GREEN})`,transition:"width .08s linear",borderRadius:"0 0 0 14px"}}/>
      </div>
    </div>
  );
}

// ══ 로그인 화면 (drip2_users 방식) ══════════
const MASTER_CODE="momos1!";
function LoginScreen({onLogin}){
  const[mode,setMode]=useState("login"); // login | signup | changepw
  const[userId,setUserId]=useState("");
  const[pw,setPw]=useState("");
  const[newPw,setNewPw]=useState("");
  const[confirmPw,setConfirmPw]=useState("");
  const[masterCode,setMasterCode]=useState("");
  const[msg,setMsg]=useState(null); // {type:"ok"|"err", text}
  const[loading,setLoading]=useState(false);
  const inpS={width:"100%",padding:"11px 14px",borderRadius:10,fontSize:14,background:"rgba(255,255,255,.08)",border:"1px solid #7a8a7055",color:"#f0ede8",outline:"none",fontFamily:"inherit"};
  const resetFields=()=>{setUserId("");setPw("");setNewPw("");setConfirmPw("");setMasterCode("");setMsg(null);};
  const switchMode=m=>{resetFields();setMode(m);};

  // ── 로그인
  const doLogin=async()=>{
    if(!userId||!pw){setMsg({type:"err",text:"아이디와 비밀번호를 입력하세요."});return;}
    setLoading(true);setMsg(null);
    const{data,error}=await sb.from("drip2_users").select("*").eq("user_id",userId.trim()).single();
    setLoading(false);
    if(error||!data){setMsg({type:"err",text:"아이디 또는 비밀번호가 틀렸습니다."});return;}
    if(data.password!==pw){setMsg({type:"err",text:"아이디 또는 비밀번호가 틀렸습니다."});return;}
    onLogin({id:data.id,user_id:data.user_id,name:data.name||data.user_id});
  };

  // ── 계정 만들기
  const doSignup=async()=>{
    if(masterCode!==MASTER_CODE){setMsg({type:"err",text:"마스터 코드가 틀렸습니다."});return;}
    if(!userId.trim()||!pw){setMsg({type:"err",text:"아이디와 비밀번호를 입력하세요."});return;}
    if(pw!==confirmPw){setMsg({type:"err",text:"비밀번호가 일치하지 않습니다."});return;}
    if(pw.length<4){setMsg({type:"err",text:"비밀번호는 4자 이상이어야 합니다."});return;}
    setLoading(true);setMsg(null);
    const{data:exist}=await sb.from("drip2_users").select("id").eq("user_id",userId.trim()).maybeSingle();
    if(exist){setLoading(false);setMsg({type:"err",text:"이미 사용 중인 아이디입니다."});return;}
    const{error}=await sb.from("drip2_users").insert({user_id:userId.trim(),password:pw});
    setLoading(false);
    if(error){setMsg({type:"err",text:"생성 오류: "+error.message});return;}
    setMsg({type:"ok",text:"✅ 계정이 생성되었습니다. 로그인하세요."});
    setTimeout(()=>switchMode("login"),1400);
  };

  // ── 비밀번호 변경
  const doChangePw=async()=>{
    if(masterCode!==MASTER_CODE){setMsg({type:"err",text:"마스터 코드가 틀렸습니다."});return;}
    if(!userId.trim()||!newPw){setMsg({type:"err",text:"아이디와 새 비밀번호를 입력하세요."});return;}
    if(newPw!==confirmPw){setMsg({type:"err",text:"새 비밀번호가 일치하지 않습니다."});return;}
    if(newPw.length<4){setMsg({type:"err",text:"비밀번호는 4자 이상이어야 합니다."});return;}
    setLoading(true);setMsg(null);
    const{data:exist}=await sb.from("drip2_users").select("id").eq("user_id",userId.trim()).maybeSingle();
    if(!exist){setLoading(false);setMsg({type:"err",text:"존재하지 않는 아이디입니다."});return;}
    const{error}=await sb.from("drip2_users").update({password:newPw}).eq("user_id",userId.trim());
    setLoading(false);
    if(error){setMsg({type:"err",text:"변경 오류: "+error.message});return;}
    setMsg({type:"ok",text:"✅ 비밀번호가 변경되었습니다."});
    setTimeout(()=>switchMode("login"),1400);
  };

  const lbl={fontSize:12,color:"#c8a06a",marginBottom:5};
  const onKey=e=>e.key==="Enter"&&(mode==="login"?doLogin():mode==="signup"?doSignup():doChangePw());

  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#3a3a38"}}>
      <div style={{background:"#2e2e2c",border:"2px solid #6a8a5a",borderRadius:20,padding:"36px 36px 32px",width:"100%",maxWidth:400,boxShadow:"0 8px 40px rgba(0,0,0,.5)"}}>
        <div style={{textAlign:"center",marginBottom:26}}>
          <div style={{fontSize:44,marginBottom:8}}>☕</div>
          <div style={{fontSize:20,fontWeight:700,color:"#e8f0e0",letterSpacing:1}}>드립백 생산 관리</div>
          <div style={{fontSize:12,color:"#6fcf97",marginTop:4}}>2차 가공 팀 전용 시스템</div>
        </div>

        {/* 로그인 폼 */}
        {mode==="login"&&(<>

// ══ 완제품 검색 선택 컴포넌트 ═══════════════
function ProductSearchSelect({pMaster,value,onChange}){
  const[query,setQuery]=useState("");
  const[open,setOpen]=useState(false);
  const ref=useRef(null);
  const inputRef=useRef(null);
  const selected=pMaster.find(p=>p.code===value);

  useEffect(()=>{
    const handler=e=>{if(ref.current&&!ref.current.contains(e.target)){setOpen(false);setQuery("");}};
    document.addEventListener("mousedown",handler);
    return()=>document.removeEventListener("mousedown",handler);
  },[]);

  const filtered=query.trim()
    ?pMaster.filter(p=>p.name.includes(query)||p.code.toLowerCase().includes(query.toLowerCase()))
    :pMaster;

  const baseStyle={background:"rgba(255,255,255,.1)",border:"1px solid #7a8a7055",borderRadius:"6px 6px 0 0",color:"#f0e6d3",padding:"7px 10px",fontSize:13,outline:"none",fontFamily:"inherit",width:"100%",boxSizing:"border-box"};

  return(
    <div ref={ref} style={{position:"relative",minWidth:240}}>
      {/* 입력창 */}
      <div style={{position:"relative"}}>
        <input
          ref={inputRef}
          type="text"
          value={open?query:(selected?`[${selected.code}] ${selected.name}`:"")}
          placeholder="제품 검색 또는 선택..."
          onChange={e=>{setQuery(e.target.value);setOpen(true);}}
          onFocus={()=>{setOpen(true);setQuery("");}}
          style={{...baseStyle,
            borderRadius:open?"6px 6px 0 0":"6px",
            borderBottom:open?"1px solid #c8821a55":"1px solid #7a8a7055",
            paddingRight:28}}
        />
        <span style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",color:"#7a8a70",fontSize:11,pointerEvents:"none"}}>{open?"▲":"▼"}</span>
      </div>
      {/* 드롭다운 리스트 */}
      {open&&(
        <div style={{position:"absolute",top:"100%",left:0,right:0,zIndex:9999,
          background:"#1a221a",border:"1px solid #c8821a55",borderTop:"none",borderRadius:"0 0 8px 8px",
          maxHeight:220,overflowY:"auto",boxShadow:"0 8px 24px rgba(0,0,0,.6)"}}>
          {filtered.length===0
            ?<div style={{padding:"10px 14px",color:"#6a7a68",fontSize:13}}>검색 결과 없음</div>
            :filtered.map(p=>(
              <div key={p.code}
                onMouseDown={e=>{e.preventDefault();onChange(p.code);setOpen(false);setQuery("");}}
                style={{padding:"8px 14px",cursor:"pointer",
                  borderBottom:"1px solid rgba(255,255,255,.04)",
                  display:"flex",alignItems:"center",gap:8,
                  background:value===p.code?"rgba(200,130,26,.18)":"transparent",
                  transition:"background .1s"}}
                onMouseEnter={e=>e.currentTarget.style.background=value===p.code?"rgba(200,130,26,.25)":"rgba(255,255,255,.07)"}
                onMouseLeave={e=>e.currentTarget.style.background=value===p.code?"rgba(200,130,26,.18)":"transparent"}>
                <span style={{fontSize:11,color:"#9a7050",fontFamily:"monospace",flexShrink:0}}>[{p.code}]</span>
                <span style={{fontSize:13,fontWeight:600,color:"#f5c97a",flex:1}}>{p.name}</span>
                {value===p.code&&<span style={{fontSize:12,color:"#c8821a",flexShrink:0}}>✓</span>}
              </div>
            ))
          }
        </div>
      )}
    </div>
  );
}

// ══ OrderCard — 수정 시 업체 드롭다운 지원 ═
function OrderCard({order,pName,sName,fmtDate,invest,delOrder,updateOrder,confirmOrder,completeOrder,revertOrder,cancelOrder,primaryBtn,delBtn,moveOrder,isFirst,isLast,channels}){

    const cur=channels.find(c=>c.name===order.channel);
    setEditChId(cur?String(cur.id):activeChannels[0]?String(activeChannels[0].id):"");
    setQty(String(order.qty));setEditLine(order.line||"A");setEditing(true);

    const ch=channels.find(c=>String(c.id)===String(editChId));

  const bgColor=isDone?"rgba(60,100,55,.2)":isConfirmed?"rgba(160,110,20,.18)":order.status==="투입완료"?"rgba(50,80,120,.2)":"rgba(255,255,255,.06)";

  const statusChip=isDone

          <div style={{display:"flex",flexDirection:"column",gap:2}}>
            <button onClick={()=>moveOrder(order.id,-1)} disabled={isFirst} style={{...moveBtn,opacity:isFirst?.3:1}}>▲</button>
            <button onClick={()=>moveOrder(order.id,1)} disabled={isLast} style={{...moveBtn,opacity:isLast?.3:1}}>▼</button>
          </div>
        )}
        {order.plan_date&&<span style={{background:"rgba(90,140,200,.25)",border:"1px solid #5a8fc055",color:"#8ac8d8",borderRadius:6,padding:"2px 9px",fontSize:11,fontWeight:700,whiteSpace:"nowrap"}}>📅 {order.plan_date}</span>}

// ══ 분석 탭 유틸 ══════════════════════════
function periodRange(type,base,customFrom,customTo){
  if(type==="특정기간")return{from:customFrom||base,to:customTo||base};
  const d=new Date(base);
  if(type==="일별")return{from:base,to:base};
  if(type==="년별"){
    const y=d.getUTCFullYear();
    return{from:y+"-01-01",to:y+"-12-31"};
  }
  // 월별 (기본)
  const y=d.getUTCFullYear(),m=d.getUTCMonth();
  const first=new Date(Date.UTC(y,m,1));
  const last=new Date(Date.UTC(y,m+1,0));
  return{from:first.toISOString().slice(0,10),to:last.toISOString().slice(0,10)};
}
function daysBetween(from,to){
  const a=new Date(from+"T00:00:00Z"),b=new Date(to+"T00:00:00Z");
  return Math.max(1,Math.round((b-a)/86400000)+1);
}
function secToHour(sec){return sec/3600;}
const WEEKDAY_KR=["일","월","화","수","목","금","토"];

function TrendSvgChart({data,color="#6fcf97",unit="",height=170,selected,onSelect,notedDates}){
  const W=680,H=height,PAD=32;
  if(data.length===0)return<div style={{color:"#8a9a88",fontSize:13,textAlign:"center",padding:20}}>데이터가 없습니다.</div>;
  const validVals=data.filter(d=>!d.missing).map(d=>d.value);
  const max=Math.max(1,...(validVals.length?validVals:[1]));
  const min=Math.min(0,...(validVals.length?validVals:[0]));
  const range=max-min||1;
  const stepX=data.length>1?(W-PAD*2)/(data.length-1):0;
  const pts=data.map((d,i)=>{
    const x=PAD+stepX*i;
    const y=d.missing?(H-PAD):H-PAD-((d.value-min)/range)*(H-PAD*2);
    return{x,y,...d};
  });
  const validPts=pts.filter(p=>!p.missing);
  const path=validPts.map((p,i)=>(i===0?"M":"L")+p.x.toFixed(1)+","+p.y.toFixed(1)).join(" ");
  const areaPath=validPts.length?path+" L"+validPts[validPts.length-1].x.toFixed(1)+","+(H-PAD)+" L"+validPts[0].x.toFixed(1)+","+(H-PAD)+" Z":"";
  return(
    <div style={{width:"100%",overflowX:"auto"}}>
      <svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",height,minWidth:Math.max(360,data.length*40)}}>
        <line x1={PAD} y1={H-PAD} x2={W-PAD} y2={H-PAD} stroke="#7a8a7044" strokeWidth="1"/>
        {areaPath&&<path d={areaPath} fill={color} opacity="0.12" stroke="none"/>}
        {path&&<path d={path} fill="none" stroke={color} strokeWidth="2.5"/>}
        {pts.map((p,i)=>{
          const isSel=selected&&p.date===selected;
          if(p.missing){
            return(
              <g key={i} onClick={()=>onSelect&&p.date&&onSelect(p.date)} style={{cursor:onSelect&&p.date?"pointer":"default"}}>
                {isSel&&<circle cx={p.x} cy={p.y} r="9" fill="none" stroke="#e05050" strokeWidth="2.5"/>}
                <circle cx={p.x} cy={p.y} r="12" fill="transparent"/>
                <circle cx={p.x} cy={p.y} r={isSel?4.5:3.5} fill="none" stroke="#e89090" strokeWidth="1.5" strokeDasharray="2,2"/>
                <text x={p.x} y={H-PAD+16} fontSize="10" fill={isSel?"#e05050":"#8a9a88"} fontWeight={isSel?700:400} textAnchor="middle">{p.label}</text>
                <text x={p.x} y={p.y-8} fontSize="9" fill="#e89090" textAnchor="middle" fontWeight="700">인원⚠️</text>
              </g>
            );
          }
          return(
            <g key={i} onClick={()=>onSelect&&p.date&&onSelect(p.date)} style={{cursor:onSelect&&p.date?"pointer":"default"}}>
              {isSel&&<circle cx={p.x} cy={p.y} r="9" fill="none" stroke="#e05050" strokeWidth="2.5"/>}
              {/* 클릭 히트영역 (실제 점보다 크게) */}
              <circle cx={p.x} cy={p.y} r="12" fill="transparent"/>
              <circle cx={p.x} cy={p.y} r={isSel?4.5:3.5} fill={isSel?"#e05050":color}/>
              <text x={p.x} y={H-PAD+16} fontSize="10" fill={isSel?"#e05050":"#8a9a88"} fontWeight={isSel?700:400} textAnchor="middle">{p.label}</text>
              <text x={p.x} y={p.y-17} fontSize="10" fill="#e8f0e0" textAnchor="middle" fontWeight="700">{p.value.toLocaleString(undefined,{maximumFractionDigits:1})}{unit}</text>
              {p.sub!=null&&<text x={p.x} y={p.y-6} fontSize="8.5" fill="#a8b8a0" textAnchor="middle">{p.sub.toLocaleString(undefined,{maximumFractionDigits:1})}h</text>}
              {notedDates&&p.date&&notedDates[p.date]&&<circle cx={p.x} cy={H-PAD+26} r="2.5" fill="#e8b23c"/>}
            </g>
          );
        })}
      </svg>
      {onSelect&&<div style={{fontSize:11,color:"#6a7a68",marginTop:2}}>💡 그래프의 점을 클릭하면 해당 날짜의 근거 데이터를 볼 수 있어요. <span style={{color:"#e89090"}}>인원⚠️ = 작업자 수 미입력</span></div>}
    </div>
  );
}
function MultiTrendSvgChart({data,series,unit="",height=190}){
  // data: [{label,a,b,total}], series: [{key,label,color,dashed}]
  const W=680,H=height,PAD=32;
  if(data.length===0)return<div style={{color:"#8a9a88",fontSize:13,textAlign:"center",padding:20}}>데이터가 없습니다.</div>;
  const allVals=data.flatMap(d=>series.map(s=>d[s.key]||0));
  const max=Math.max(1,...allVals);
  const stepX=data.length>1?(W-PAD*2)/(data.length-1):0;
  const yOf=v=>H-PAD-(v/max)*(H-PAD*2);
  const xOf=i=>PAD+stepX*i;
  return(
    <div style={{width:"100%",overflowX:"auto"}}>
      <div style={{display:"flex",gap:16,marginBottom:8,fontSize:12,flexWrap:"wrap"}}>
        {series.map(s=>(
          <span key={s.key} style={{display:"flex",alignItems:"center",gap:5,color:"#c8c8b8"}}>
            <span style={{width:14,height:2.5,background:s.color,display:"inline-block",...(s.dashed?{backgroundImage:"repeating-linear-gradient(90deg,"+s.color+" 0,"+s.color+" 4px,transparent 4px,transparent 7px)",background:"none"}:{})}}/>
            {s.label}
          </span>
        ))}
      </div>
      <svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",height,minWidth:Math.max(360,data.length*44)}}>
        <line x1={PAD} y1={H-PAD} x2={W-PAD} y2={H-PAD} stroke="#7a8a7044" strokeWidth="1"/>
        {series.map(s=>{
          const pts=data.map((d,i)=>({x:xOf(i),y:yOf(d[s.key]||0),v:d[s.key]||0}));
          const path=pts.map((p,i)=>(i===0?"M":"L")+p.x.toFixed(1)+","+p.y.toFixed(1)).join(" ");
          return(
            <g key={s.key}>
              <path d={path} fill="none" stroke={s.color} strokeWidth={s.dashed?2:2.5} strokeDasharray={s.dashed?"5,4":"none"} opacity={s.dashed?.85:1}/>
              {pts.map((p,i)=>(<circle key={i} cx={p.x} cy={p.y} r={s.dashed?2.5:3.2} fill={s.color}/>))}
            </g>
          );
        })}
        {data.map((d,i)=>(<text key={i} x={xOf(i)} y={H-PAD+16} fontSize="10" fill="#8a9a88" textAnchor="middle">{d.label}</text>))}
      </svg>
    </div>
  );
}
function PctStackChart({data,height=110}){
  // data: [{label,a,b}] — 날짜별 A/B 비율(%) 100% 누적 막대
  const W=680,H=height,PAD=26,barGap=6;
  if(data.length===0)return<div style={{color:"#8a9a88",fontSize:13,textAlign:"center",padding:20}}>데이터가 없습니다.</div>;
  const innerW=W-PAD*2;
  const barW=Math.max(10,Math.min(38,innerW/data.length-barGap));
  const stepX=data.length>1?innerW/data.length:innerW;
  const barTop=8,barBottom=H-PAD;
  const barH=barBottom-barTop;
  return(
    <div style={{width:"100%",overflowX:"auto"}}>
      <svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",height,minWidth:Math.max(360,data.length*44)}}>
        {data.map((d,i)=>{
          const total=(d.a||0)+(d.b||0);
          const aPct=total>0?(d.a||0)/total*100:0;
          const bPct=total>0?(d.b||0)/total*100:0;
          const x=PAD+stepX*i+(stepX-barW)/2;
          const aH=total>0?barH*aPct/100:0;
          const bH=total>0?barH*bPct/100:0;
          return(
            <g key={i}>
              {total===0?(
                <rect x={x} y={barTop} width={barW} height={barH} fill="#7a8a7022"/>
              ):(<>
                <rect x={x} y={barTop} width={barW} height={aH} fill="#6a9a5a"/>
                <rect x={x} y={barTop+aH} width={barW} height={bH} fill="#5a8fc0"/>
                {aPct>=12&&<text x={x+barW/2} y={barTop+aH/2+3} fontSize="9" fill="#fff" textAnchor="middle" fontWeight="700">{aPct.toFixed(0)}%</text>}
                {bPct>=12&&<text x={x+barW/2} y={barTop+aH+bH/2+3} fontSize="9" fill="#fff" textAnchor="middle" fontWeight="700">{bPct.toFixed(0)}%</text>}
              </>)}
              <text x={x+barW/2} y={H-8} fontSize="9.5" fill="#8a9a88" textAnchor="middle">{d.label}</text>
            </g>
          );
        })}
      </svg>
      <div style={{fontSize:11,color:"#6a7a68",marginTop:2}}>💡 날짜별 A라인(🟢)/B라인(🔵) 비율(%)</div>
    </div>
  );
}
function DonutChart({data}){
  const total=data.reduce((a,b)=>a+b.value,0)||1;
  let acc=0;
  const stops=data.map(d=>{
    const start=acc/total*360;acc+=d.value;const end=acc/total*360;
    return d.color+" "+start.toFixed(2)+"deg "+end.toFixed(2)+"deg";
  }).join(",");
  return(
    <div style={{display:"flex",alignItems:"center",gap:24,flexWrap:"wrap"}}>
      <div style={{width:260,height:260,borderRadius:"50%",background:data.length?"conic-gradient("+stops+")":"#3a3a38",flexShrink:0,border:"3px solid rgba(255,255,255,.08)",position:"relative"}}>
        <div style={{position:"absolute",inset:36,borderRadius:"50%",background:"#3a3a38",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column"}}>
          <div style={{fontSize:13,color:"#8a9a88"}}>총 생산량</div>
          <div style={{fontSize:22,fontWeight:700,color:"#f5c97a"}}>{total.toLocaleString()}개</div>
        </div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:6,flex:1,minWidth:180}}>
        {data.map((d,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:8,fontSize:13}}>
            <div style={{width:12,height:12,borderRadius:3,background:d.color,flexShrink:0}}/>
            <div style={{flex:1,color:"#e8f0e0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.label}</div>
            <div style={{color:"#c8a06a",fontWeight:700}}>{(d.value/total*100).toFixed(1)}%</div>

        ))}
        {data.length===0&&<div style={{color:"#8a9a88",fontSize:13}}>데이터가 없습니다.</div>}
      </div>
    </div>
  );
}

  const investCore=async(orderId,stockSnap)=>{
    const order=orders.find(o=>o.id===orderId);if(!order)return null;
    // ★ DB 실제 상태 확인 (state 비동기 문제 완전 차단)
    const{data:dbOrder}=await sb.from("drip2_orders").select("status").eq("id",orderId).single();
    if(!dbOrder||dbOrder.status!=="대기")return stockSnap||stock;
    const recipe=bomOf(order.p_code);
    if(!recipe.length){alert("BOM이 설정되지 않은 제품입니다.");return null;}
    const baseStock=stockSnap||stock;
    findUnifiedExpiry(baseStock,recipe,order.qty);
    let ws=[...baseStock];const details=[],errors=[];
    for(const comp of recipe){
      const need=comp.qty*order.qty;
      const{ok,used,next,shortage}=smartDeduct(ws,comp.s_code,need);
      if(!ok)errors.push("["+sName(comp.s_code)+"] "+shortage+"개 부족");
      else{ws=next;details.push({sCode:comp.s_code,used,total:need});}
    }
    if(errors.length){alert("⚠️ 생산 불가\n\n"+errors.join("\n"));return null;}
    const detailsWithExp=details.map(d=>({...d,expiry:(d.used&&d.used.length>0)?d.used.reduce((min,u)=>new Date(u.expiry)<new Date(min)?u.expiry:min,d.used[0].expiry):null}));
    const allExpArr=detailsWithExp.map(d=>d.expiry).filter(Boolean);
    const finExp=allExpArr.length>0?allExpArr.reduce((min,e)=>new Date(e)<new Date(min)?e:min):null;
    const mixed=detailsWithExp.filter(d=>(d.used||[]).length>1);
    if(mixed.length>0){
      const msg=mixed.map(d=>"["+sName(d.sCode)+"]\n"+d.used.map(u=>"  "+fmtDate(u.expiry)+" "+u.qty+"개").join("\n")).join("\n\n");
      if(!window.confirm("⚠️ 대형플랫폼 주의!\n\n소비기한 배치 혼합:\n\n"+msg+"\n\n그래도 생산하시겠습니까?"))return null;
    }
    const hasPendingFlag=details.some(d=>(d.used||[]).some(u=>stock.find(s=>s.id===u.id)?.is_pending));

    // ★ UI 즉시 반영 (DB 응답 기다리지 않음)
    setStock(ws);
    setOrders(prev=>prev.map(o=>o.id===orderId?{...o,status:"투입완료",detail:{details:detailsWithExp,finExp,hasPending:hasPendingFlag,lot:null,lotKey:null,logId:null},plan_date:order.plan_date}:o));

    // ★ 재고 업데이트 병렬 처리 (순차→병렬)
    const stockUpdates=ws
      .filter(row=>{const orig=baseStock.find(s=>s.id===row.id);return orig&&orig.qty!==row.qty;})
      .map(row=>sb.from("drip2_stock").update({qty:row.qty}).eq("id",row.id));

    // ★ assignLot + 재고업데이트 병렬 실행
    const[lot]=await Promise.all([
      assignLot(finExp,detailsWithExp,order.p_code),
      ...stockUpdates
    ]);

    const lotKey=makeLotKey(detailsWithExp);
    const workerId=user?.user_id||user?.email||"unknown";

    ]);
    if(logError)console.error("로그 저장 오류:",logError.message);

    // logId 반영 (UI 재업데이트)

    setOrders(prev=>prev.map(o=>o.id===orderId?{...o,status:"투입완료",detail:finalDetail}:o));
    if(logData)setProdLog(prev=>[logData,...prev]);
    return ws;

  const addBomComp=async()=>{const{sCode,qty}=newComp;if(!sCode||!qty)return alert("구성품과 수량을 입력하세요.");if(bomOf(bomPCode).length>=10)return alert("최대 10개");if(bomOf(bomPCode).find(c=>c.s_code===sCode))return alert("이미 추가된 구성품");const{data,error}=await sb.from("drip2_bom").insert({p_code:bomPCode,s_code:sCode,qty:parseInt(qty)}).select().single();if(error)return alert("오류: "+error.message);if(data)setBomData(prev=>[...prev,data]);setNewComp(f=>({...f,qty:""}));};
  const delBomComp=(id,sCode)=>askPw("BOM 구성품 삭제","["+sName(sCode)+"] 삭제됩니다.",async()=>{await sb.from("drip2_bom").delete().eq("id",id);setBomData(prev=>prev.filter(b=>b.id!==id));});
  const editBomQty=async(id,val)=>{await sb.from("drip2_bom").update({qty:parseInt(val)||1}).eq("id",id);};

  // ── 생산로그 삭제 ──
  const delLog=log=>{
    const label=log.lot||fmtDate(log.fin_exp)||String(log.id);
    askPw("생산로그 삭제","LOT: "+label+" / "+pName(log.p_code)+" "+log.qty+"개",async()=>{
      const{error}=await sb.from("drip2_prod_log").delete().eq("id",log.id);
      if(error){alert("삭제 오류: "+error.message);return;}
      setProdLog(prev=>prev.filter(l=>l.id!==log.id));

  // ── 주문 순서 ──
  const moveOrder=async(id,dir)=>{
    const pending=sortedOrders.filter(o=>o.status==="대기"||o.status==="투입완료");
    const idx=pending.findIndex(o=>o.id===id);const swapIdx=idx+dir;
    if(swapIdx<0||swapIdx>=pending.length)return;
    const a=pending[idx],b=pending[swapIdx];
    await Promise.all([sb.from("drip2_orders").update({priority:b.priority}).eq("id",a.id),sb.from("drip2_orders").update({priority:a.priority}).eq("id",b.id)]);
    setOrders(prev=>prev.map(o=>o.id===a.id?{...o,priority:b.priority}:o.id===b.id?{...o,priority:a.priority}:o));
  };

  // ── 생산확정 드래그 재정렬 ──
  const[dragOverId,setDragOverId]=useState(null);
  const onConfirmDragStart=(id)=>{dragItem.current=id;};
  const onConfirmDragOver=(e,id)=>{e.preventDefault();if(dragItem.current!==id){setDragOverId(id);}};
  const onConfirmDragEnd=()=>{setDragOverId(null);dragItem.current=null;dragOver.current=null;};
  const onConfirmDrop=async(e,targetId)=>{
    e.preventDefault();
    const srcId=dragItem.current;
    if(!srcId||srcId===targetId){setDragOverId(null);return;}
    // 확정 목록 priority 재계산
    const confirmed=sortedOrders.filter(o=>o.status==="확정"&&(o.plan_date||"").slice(0,10)===viewDate);
    const srcIdx=confirmed.findIndex(o=>o.id===srcId);
    const tgtIdx=confirmed.findIndex(o=>o.id===targetId);
    if(srcIdx===-1||tgtIdx===-1){setDragOverId(null);return;}
    // 배열 재정렬
    const reordered=[...confirmed];
    const[moved]=reordered.splice(srcIdx,1);
    reordered.splice(tgtIdx,0,moved);
    // priority 일괄 업데이트 (기존 priority 값 활용)
    const sortedPriorities=[...confirmed].map(o=>o.priority).sort((a,b)=>a-b);
    const updates=reordered.map((o,i)=>({id:o.id,priority:sortedPriorities[i]}));
    // 로컬 state 즉시 반영
    setOrders(prev=>prev.map(o=>{const u=updates.find(x=>x.id===o.id);return u?{...o,priority:u.priority}:o;}));
    // DB 저장
    await Promise.all(updates.map(u=>sb.from("drip2_orders").update({priority:u.priority}).eq("id",u.id)));
    setDragOverId(null);
  };

  // ── 업체 관리 ──
  const addChannel=async()=>{

    const{data,error}=await sb.from("drip2_channels").insert({name:newChannel.name.trim(),color:newChannel.color,color2:newChannel.color2||null,active:true,sort_order:maxOrder}).select().single();
    if(error)return alert("오류: "+error.message);

  const delChannel=id=>{const ch=channels.find(c=>c.id===id);askPw("업체 삭제","["+ch?.name+"] 삭제됩니다.",async()=>{await sb.from("drip2_channels").delete().eq("id",id);setChannels(prev=>prev.filter(c=>c.id!==id));});};
  const startEditCh=ch=>{setEditChId(ch.id);setEditChData({name:ch.name,color:ch.color||COLORS[0],color2:ch.color2||"",active:ch.active!==false});};
  const saveEditCh=async()=>{

    await sb.from("drip2_channels").update({name:editChData.name.trim(),color:editChData.color,color2:editChData.color2||null,active:editChData.active}).eq("id",editChId);
    setChannels(prev=>prev.map(c=>c.id===editChId?{...c,...editChData,name:editChData.name.trim()}:c));

  const toggleChActive=async(id,active)=>{await sb.from("drip2_channels").update({active}).eq("id",id);setChannels(prev=>prev.map(c=>c.id===id?{...c,active}:c));};

  // ── 비밀번호 변경 (13번) ──
  const changePw=async()=>{

    if(next!==confirm)return setPwChangeMsg({type:"err",msg:"새 비밀번호가 일치하지 않습니다."});
    // 현재 비밀번호 확인
    const{data,error}=await sb.from("drip2_users").select("id").eq("user_id",user.user_id).eq("password",cur).maybeSingle();
    if(error||!data)return setPwChangeMsg({type:"err",msg:"현재 비밀번호가 틀렸습니다."});
    const{error:upErr}=await sb.from("drip2_users").update({password:next}).eq("user_id",user.user_id);
    if(upErr)return setPwChangeMsg({type:"err",msg:"변경 오류: "+upErr.message});
    setPwChange({cur:"",next:"",confirm:""});
    setPwChangeMsg({type:"ok",msg:"✅ 비밀번호가 변경되었습니다."});

  // ── 조회 날짜 기준 필터 ──
  // 생산계획: priority 오름차순(먼저 등록한게 위, 새 등록은 아래)
  const sortedOrders=[...orders].sort((a,b)=>a.priority-b.priority);
  const viewOrders=sortedOrders.filter(o=>{
    if(!viewDate)return true;
    return (o.plan_date||"")=== viewDate;
  });

  // ── 생산로그 날짜 필터 (11번) ──
  const filteredLog=prodLog.filter(log=>{
    if(logFilter!=="전체"&&log.p_code!==logFilter)return false;
    const d=(log.created_at||"").slice(0,10);
    if(logDateMode==="single")return d===logSingleDate;
    if(logDateMode==="range"){
      if(logDateRange.from&&d<logDateRange.from)return false;
      if(logDateRange.to&&d>logDateRange.to)return false;

  });

  // ── 생산계획서 출력 ──
  const printPlan=(filterDate)=>{
    const pending=viewOrders.filter(o=>o.status==="대기"||o.status==="투입완료");
    if(!pending.length){alert("출력할 주문이 없습니다.");return;}
    const rows=pending.map(o=>{
      const lotStr=o.detail?.lot?"LOT "+o.detail.lot:"(투입 전)";
      const finExpStr=o.detail?.finExp?fmtDate(o.detail.finExp):"-";
      const ch=channels.find(c=>c.name===o.channel);
      const chColor=ch?.color||"#5a6a5a";
      const chColor2=ch?.color2||null;
      const companyDisplay=o.channel||"-";
      const lineLabel=o.line==="B"?"🔵 B라인":"🟢 A라인";
      const lineColor=o.line==="B"?"#1a5fa8":"#2a7a2a";
      const lineBadge="<span style='display:inline-block;background:"+lineColor+";color:#fff;border:3px solid rgba(255,255,255,.8);border-radius:8px;padding:6px 16px;font-weight:900;font-size:15px;-webkit-print-color-adjust:exact;print-color-adjust:exact;letter-spacing:.5px;margin-right:8px;'>"+lineLabel+"</span>";
      const details=(o.detail?.details||[]).map(d=>"<tr><td style='padding:4px 10px;border:1px solid #ccc;'>"+d.sCode+"</td><td style='padding:4px 10px;border:1px solid #ccc;'>"+sName(d.sCode)+"</td><td style='padding:4px 10px;border:1px solid #ccc;text-align:center;'>"+d.total+"개</td><td style='padding:4px 10px;border:1px solid #ccc;text-align:center;'>"+fmtDate(d.expiry)+"</td></tr>").join("");
      const detailTable=o.detail?.details?.length>0?"<table style='width:100%;border-collapse:collapse;margin-top:6px;font-size:12px;'><tr style='background:#f0f0f0;'><th style='padding:4px 10px;border:1px solid #ccc;'>코드</th><th style='padding:4px 10px;border:1px solid #ccc;'>낱개명</th><th style='padding:4px 10px;border:1px solid #ccc;'>수량</th><th style='padding:4px 10px;border:1px solid #ccc;'>소비기한</th></tr>"+details+"</table>":"";
      // 반반 색상 뱃지 (8번, 9번 — 인쇄용 크게)
      const badgeBg=chColor2
        ?"linear-gradient(90deg,"+chColor+" 50%,"+chColor2+" 50%)"

      const chBadge="<span style='display:inline-block;background:"+badgeBg+";color:#fff;border:3px solid rgba(255,255,255,.8);border-radius:8px;padding:6px 22px;font-weight:700;font-size:17px;-webkit-print-color-adjust:exact;print-color-adjust:exact;text-shadow:0 1px 3px rgba(0,0,0,.6);letter-spacing:.5px;'>"+companyDisplay+"</span>";
      return "<div style='border:2px solid #ccc;border-radius:8px;padding:14px 18px;margin-bottom:16px;page-break-inside:avoid;'>"
        +"<div style='display:flex;align-items:center;gap:12px;background:#f5f5f5;border-radius:6px;padding:10px 14px;margin-bottom:10px;border:1px solid #ddd;'>"+lineBadge+chBadge
        +"<span style='background:#5a7a3a;color:#fff;border-radius:5px;padding:4px 12px;font-weight:700;font-size:14px;'>📅 "+(o.plan_date||"-")+"</span>"
        +"</div>"
        +"<div style='display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;'>"
        +"<span style='background:#5a7a4a;color:#fff;border-radius:5px;padding:2px 8px;font-weight:700;font-size:12px;'>P"+o.priority+"</span>"
        +"<span style='font-size:11px;color:#888;'>["+o.p_code+"]</span>"
        +"<span style='font-weight:700;font-size:15px;'>"+pName(o.p_code)+"</span>"
        +"<span style='font-weight:700;font-size:14px;'>생산수량: <b>"+o.qty+"개</b></span>"
        +"<span style='color:#155a15;font-weight:700;'>"+lotStr+"</span>"
        +"<span>소비기한: <b style='color:#8a2000;'>"+finExpStr+"</b></span>"
        +"</div>"+detailTable+"</div>";
    }).join("");
    const todayStr=new Date().toLocaleDateString("ko-KR");
    const html="<!DOCTYPE html><html><head><meta charset='UTF-8'><title>생산계획서</title>"
      +"<style>body{font-family:'Noto Sans KR',sans-serif;padding:30px;color:#222;}"
      +"@media print{@page{margin:15mm;}*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}}</style>"
      +"</head><body>"
      +"<div style='display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;border-bottom:2px solid #333;padding-bottom:10px;'>"
      +"<div><h2 style='margin:0;'>드립백 생산계획서</h2><div style='color:#666;font-size:13px;'>"+(filterDate?filterDate+" · ":"")+pending.length+"건</div></div>"
      +"<div style='text-align:right;font-size:13px;color:#666;'><div>생산일: <b>"+(planInfo.planDate||todayStr)+"</b></div><div>출력일: "+todayStr+"</div></div>"
      +"</div>"+rows
      +"<div style='margin-top:30px;border-top:1px solid #ccc;padding-top:16px;display:flex;gap:40px;font-size:13px;color:#555;'>"
      +"<span>확인: ___________</span><span>담당: ___________</span><span>팀장: ___________</span>"

    const iframe=document.createElement("iframe");

    iframe.contentDocument.write(html);

    setTimeout(()=>{iframe.contentWindow.print();setTimeout(()=>document.body.removeChild(iframe),1000);},500);
  };

  // ── 스타일 ──
  const inp={background:"rgba(255,255,255,.1)",border:"1px solid #7a8a7055",borderRadius:6,color:"#f0e6d3",padding:"6px 10px",fontSize:13,outline:"none",width:130,fontFamily:"inherit"};
  const sel={...inp,cursor:"pointer",width:"auto"};
  const lbl={fontSize:12,color:"#c8a06a",marginBottom:4};
  const primaryBtn={border:"none",borderRadius:8,padding:"8px 20px",fontSize:14,cursor:"pointer",background:"linear-gradient(135deg,#5a7a4a,#7a9a6a)",color:"#fff",fontWeight:700,fontFamily:"inherit"};
  const delBtn={background:"rgba(160,60,60,.25)",border:"1px solid #c0606044",color:"#e89090",borderRadius:6,padding:"4px 10px",fontSize:13,cursor:"pointer",fontFamily:"inherit"};
  const SecTitle=({icon,title})=>(<div style={{display:"flex",alignItems:"center",gap:8,fontSize:16,fontWeight:700,color:"#f5c97a",marginBottom:14,borderLeft:"3px solid #c8821a",paddingLeft:12}}>{icon} {title}</div>);
  const Tbl=({headers,children})=>(<div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",background:"rgba(255,255,255,.03)",border:"1px solid #c8821a33",fontSize:14}}><thead><tr style={{background:"rgba(200,130,26,.18)"}}>{headers.map(h=><th key={h} style={{padding:"9px 14px",textAlign:"left",color:"#c8ddb8",fontWeight:600,fontSize:13,borderBottom:"1px solid #6a8a5a55"}}>{h}</th>)}</tr></thead><tbody>{children}</tbody></table></div>);
  const Td=({children,style,colSpan})=><td colSpan={colSpan} style={{padding:"8px 14px",borderBottom:"1px solid #6a6a6444",verticalAlign:"middle",...style}}>{children}</td>;

  if(authLoading)return(<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16,color:"#a8b8a0"}}><div style={{fontSize:40}}>☕</div><div>인증 확인 중...</div></div>);
  if(!user)return <LoginScreen onLogin={handleLogin}/>;
  if(loading)return(<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16,color:"#a8b8a0"}}><div style={{fontSize:40}}>☕</div><div>데이터 불러오는 중...</div></div>);

  const PlanSettingModal=()=>{
    const[tmp,setTmp]=useState({...planInfo});
    return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.7)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999}}>
      <div style={{background:"#2e2e2c",border:"2px solid #6a8a5a",borderRadius:16,padding:"28px 32px",minWidth:300}}>
        <div style={{color:"#d8ecca",fontWeight:700,fontSize:16,marginBottom:18}}>📅 생산 날짜 설정</div>

          <input type="date" value={tmp.planDate} onChange={e=>setTmp(t=>({...t,planDate:e.target.value}))}
            style={{width:"100%",padding:"8px 12px",borderRadius:8,fontSize:14,background:"rgba(255,255,255,.1)",border:"1px solid #7a8a7055",color:"#f0ede8",outline:"none",fontFamily:"inherit"}}/></div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>setShowPlanSetting(false)} style={{flex:1,padding:"8px",borderRadius:8,border:"none",background:"rgba(255,255,255,.07)",color:"#c8c8b8",cursor:"pointer",fontFamily:"inherit"}}>취소</button>
          <button onClick={()=>savePlanInfo(tmp)} style={{flex:1,padding:"8px",borderRadius:8,border:"none",background:"linear-gradient(135deg,#5a7a4a,#7a9a6a)",color:"#fff",fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>저장</button>
        </div>

  // 색상 팔레트 컴포넌트 (재사용)
  const ColorPicker=({label,value,onChange})=>(

        {COLORS.map(col=>(
          <div key={col} onClick={()=>onChange(col)} style={{width:24,height:24,borderRadius:5,cursor:"pointer",background:col,border:value===col?"3px solid #fff":"2px solid transparent",outline:value===col?"2px solid #c8821a":"none",boxSizing:"border-box"}}/>
        ))}
        <div onClick={()=>onChange("")} style={{width:24,height:24,borderRadius:5,cursor:"pointer",background:"transparent",border:!value?"3px solid #fff":"2px solid #6a6a64",backgroundImage:"repeating-linear-gradient(45deg,#888 0,#888 2px,transparent 2px,transparent 6px)",boxSizing:"border-box"}} title="없음"/>
      </div>
    </div>
  );

  // ── 분석 계산 (선택 기간 + 완료 데이터 기반) ──
  const anaRange=periodRange(anaPeriodType,anaAnchor,anaCustomFrom,anaCustomTo);
  const anaFrom=anaRange.from,anaTo=anaRange.to;
  const speedOf=code=>{const p=pMaster.find(x=>x.code===code);return p&&p.speed_sec?Number(p.speed_sec):0;};
  const anaTotalQty=anaRows.reduce((a,r)=>a+(r.qty||0),0);
  const anaTotalProdHours=anaRows.reduce((a,r)=>a+secToHour((r.qty||0)*speedOf(r.p_code)),0);
  const anaPerHour=anaTotalProdHours>0?(anaTotalQty/anaTotalProdHours):0;
  // 날짜별 가용시간: 반드시 그 날짜에 저장된 값이 있어야 계산됨 (기본값 없음). 미입력이면 null.
  const anaDailyAvailOf=d=>{
    const ov=anaNoteMap[d];
    if(!ov||ov.workers==null||ov.hours==null)return null;
    return ov.workers*ov.hours+(ov.overtime||0);
  };

  // 제품별 집계 (생산량/생산시간)
  const anaProductMap={};
  anaRows.forEach(r=>{
    const k=r.p_code;
    if(!anaProductMap[k])anaProductMap[k]={qty:0,hours:0};
    anaProductMap[k].qty+=r.qty||0;
    anaProductMap[k].hours+=secToHour((r.qty||0)*speedOf(k));
  });
  const anaProductArr=Object.keys(anaProductMap).map((k,i)=>({code:k,label:pName(k),value:anaProductMap[k].qty,hours:anaProductMap[k].hours,color:COLORS[i%COLORS.length]})).sort((a,b)=>b.value-a.value);
  const anaProductRank=anaProductArr;
  const anaProductPie=anaProductArr;
  const anaBest=anaProductArr.slice(0,5);
  const anaWorst=[...anaProductArr].sort((a,b)=>a.value-b.value).slice(0,5);

  // 일자별 집계 (가동률/생산시간 그래프) — 실제 생산이 있었던 날짜 기준
  const anaDayMap={};
  anaRows.forEach(r=>{
    const d=(r.plan_date||"").slice(0,10);if(!d)return;
    if(!anaDayMap[d])anaDayMap[d]=0;
    anaDayMap[d]+=secToHour((r.qty||0)*speedOf(r.p_code));
  });
  const anaDayKeys=Object.keys(anaDayMap).sort();
  const anaDays=anaDayKeys.length; // 달력상 일수(예:31일)가 아닌 실제 생산일수
  // 인원 미입력 날짜 (생산은 있었지만 작업자수/근무시간이 저장 안 된 날) — 경고 대상
  const anaMissingDays=anaDayKeys.filter(d=>d!==today()&&anaDailyAvailOf(d)==null);
  // 총 가용시간 = 인원이 입력된 날짜만 (그날 작업자수 × 그날 근무시간) 합산
  const anaTotalAvailHours=anaDayKeys.reduce((a,d)=>{const av=anaDailyAvailOf(d);return a+(av||0);},0);
  const anaUtilRate=anaTotalAvailHours>0?(anaTotalProdHours/anaTotalAvailHours*100):0;
  const anaUtilTrend=anaDayKeys.map(d=>{const av=anaDailyAvailOf(d);return{date:d,label:d.slice(5).replace("-","/"),value:av?(anaDayMap[d]/av*100):0,missing:av==null,sub:anaDayMap[d]};});
  const anaUtilValsFilled=anaUtilTrend.filter(d=>!d.missing).map(d=>d.value);
  const anaUtilAvg=anaUtilValsFilled.length?anaUtilValsFilled.reduce((a,b)=>a+b,0)/anaUtilValsFilled.length:0;
  const anaUtilMax=anaUtilValsFilled.length?Math.max(...anaUtilValsFilled):0;
  const anaUtilMin=anaUtilValsFilled.length?Math.min(...anaUtilValsFilled):0;

  // 일별 낱개 포장량 집계 — 완제품 생산완료 수량 × 그 제품 BOM 구성품 총 수량 (예: 세트 하나에 낱개 6종×3개=18개 들어가면 100세트=1800개)
  const anaPackDayMap={};
  anaRows.forEach(r=>{
    const d=(r.plan_date||"").slice(0,10);if(!d)return;
    const unitsPerProduct=bomOf(r.p_code).reduce((a,c)=>a+(c.qty||0),0);
    anaPackDayMap[d]=(anaPackDayMap[d]||0)+(r.qty||0)*unitsPerProduct;
  });
  const anaPackDayKeys=Object.keys(anaPackDayMap).sort();
  const anaPackTrend=anaPackDayKeys.map(d=>({date:d,label:d.slice(5).replace("-","/"),value:anaPackDayMap[d]}));
  const anaPackTotal=anaPackDayKeys.reduce((a,d)=>a+anaPackDayMap[d],0);
  const anaPackAvg=anaPackDayKeys.length?anaPackTotal/anaPackDayKeys.length:0;
  const anaPackMax=anaPackDayKeys.length?Math.max(...anaPackDayKeys.map(d=>anaPackDayMap[d])):0;
  // 라인별(A/B) 일자별 생산량 + 낱개 포장량 집계 — "함께" 보기용 (합계 포함)
  const anaLineDayMap={}; // {date:{qA,qB,pA,pB}}
  anaRows.forEach(r=>{
    const d=(r.plan_date||"").slice(0,10);if(!d)return;
    const ln=r.line==="B"?"B":"A";
    const unitsPerProduct=bomOf(r.p_code).reduce((a,c)=>a+(c.qty||0),0);
    if(!anaLineDayMap[d])anaLineDayMap[d]={qA:0,qB:0,pA:0,pB:0};
    if(ln==="A"){anaLineDayMap[d].qA+=r.qty||0;anaLineDayMap[d].pA+=(r.qty||0)*unitsPerProduct;}
    else{anaLineDayMap[d].qB+=r.qty||0;anaLineDayMap[d].pB+=(r.qty||0)*unitsPerProduct;}
  });
  const anaLineDayKeys=Object.keys(anaLineDayMap).sort();
  const anaLineQtyTrend=anaLineDayKeys.map(d=>({date:d,label:d.slice(5).replace("-","/"),a:anaLineDayMap[d].qA,b:anaLineDayMap[d].qB,total:anaLineDayMap[d].qA+anaLineDayMap[d].qB}));
  const anaLinePackTrend=anaLineDayKeys.map(d=>({date:d,label:d.slice(5).replace("-","/"),a:anaLineDayMap[d].pA,b:anaLineDayMap[d].pB,total:anaLineDayMap[d].pA+anaLineDayMap[d].pB}));
  const anaLineQtyATotal=anaLineDayKeys.reduce((s,d)=>s+anaLineDayMap[d].qA,0);
  const anaLineQtyBTotal=anaLineDayKeys.reduce((s,d)=>s+anaLineDayMap[d].qB,0);
  const anaLinePackATotal=anaLineDayKeys.reduce((s,d)=>s+anaLineDayMap[d].pA,0);
  const anaLinePackBTotal=anaLineDayKeys.reduce((s,d)=>s+anaLineDayMap[d].pB,0);
  const anaLineQtySum=anaLineQtyATotal+anaLineQtyBTotal;
  const anaLineQtyAPct=anaLineQtySum>0?(anaLineQtyATotal/anaLineQtySum*100):0;
  const anaLineQtyBPct=anaLineQtySum>0?(anaLineQtyBTotal/anaLineQtySum*100):0;
  const anaLinePackSum=anaLinePackATotal+anaLinePackBTotal;
  const anaLinePackAPct=anaLinePackSum>0?(anaLinePackATotal/anaLinePackSum*100):0;
  const anaLinePackBPct=anaLinePackSum>0?(anaLinePackBTotal/anaLinePackSum*100):0;
  const anaLineSeries=[{key:"a",label:"🟢 A라인",color:"#6a9a5a"},{key:"b",label:"🔵 B라인",color:"#5a8fc0"},{key:"total",label:"⚪ 합계",color:"#f5c97a",dashed:true}];

  // 선택한 날짜의 낱개 포장량 근거 — 어떤 완제품을 몇 개 만들었고, 제품당 낱개가 몇 개 들어가는지
  const anaPackSelRows=anaPackSelDay?anaRows.filter(r=>(r.plan_date||"").slice(0,10)===anaPackSelDay):[];
  const anaPackSelMap={};
  anaPackSelRows.forEach(r=>{
    const k=r.p_code;
    if(!anaPackSelMap[k])anaPackSelMap[k]={qty:0};
    anaPackSelMap[k].qty+=r.qty||0;
  });
  const anaPackSelDetail=Object.keys(anaPackSelMap).map(k=>{
    const unitsPerProduct=bomOf(k).reduce((a,c)=>a+(c.qty||0),0);
    return{code:k,label:pName(k),qty:anaPackSelMap[k].qty,unitsPerProduct,packQty:anaPackSelMap[k].qty*unitsPerProduct};
  }).sort((a,b)=>b.packQty-a.packQty);
  const anaPackSelTotalQty=anaPackSelDetail.reduce((a,b)=>a+b.qty,0);
  const anaPackSelTotalPack=anaPackSelDetail.reduce((a,b)=>a+b.packQty,0);
  const anaPackSelWeekday=anaPackSelDay?WEEKDAY_KR[new Date(anaPackSelDay+"T00:00:00Z").getUTCDay()]+"요일":"";

  // 선택한 날짜(anaSelDay)의 가동률 근거 상세 — 어떤 제품을 몇 개, 몇 시간 생산했는지
  const anaSelRows=anaSelDay?anaRows.filter(r=>(r.plan_date||"").slice(0,10)===anaSelDay):[];
  const anaSelMap={};
  anaSelRows.forEach(r=>{
    const k=r.p_code;
    if(!anaSelMap[k])anaSelMap[k]={qty:0,hours:0};
    anaSelMap[k].qty+=r.qty||0;
    anaSelMap[k].hours+=secToHour((r.qty||0)*speedOf(k));
  });
  const anaSelDetail=Object.keys(anaSelMap).map(k=>({code:k,label:pName(k),speed:speedOf(k),qty:anaSelMap[k].qty,hours:anaSelMap[k].hours})).sort((a,b)=>b.hours-a.hours);
  const anaSelTotalQty=anaSelDetail.reduce((a,b)=>a+b.qty,0);
  const anaSelTotalHours=anaSelDetail.reduce((a,b)=>a+b.hours,0);
  const anaSelDailyAvail=anaSelDay?anaDailyAvailOf(anaSelDay):null;
  const anaSelRate=anaSelDailyAvail?(anaSelTotalHours/anaSelDailyAvail*100):0;
  const anaSelWeekday=anaSelDay?WEEKDAY_KR[new Date(anaSelDay+"T00:00:00Z").getUTCDay()]+"요일":"";

  // 업체별 집계
  const anaChannelMap={};
  anaRows.forEach(r=>{
    const k=r.channel||"미입력";
    if(!anaChannelMap[k])anaChannelMap[k]=0;
    anaChannelMap[k]+=r.qty||0;
  });
  const anaChannelStats=Object.keys(anaChannelMap).map(k=>{
    const ch=channels.find(c=>c.name===k);
    return{label:k,value:anaChannelMap[k],color:ch?.color||"#556655",color2:ch?.color2||null};
  }).sort((a,b)=>b.value-a.value);

  // ──────────────────────────────────────

  return(
    <div style={{minHeight:"100vh"}}>

      {pwModal&&<PwModal title={pwModal.title} desc={pwModal.desc} onConfirm={()=>{pwModal.action();setPwModal(null);}} onClose={()=>setPwModal(null)}/>}

      {/* 헤더 */}
      <div style={{background:"linear-gradient(90deg,#2c2c2a,#484844,#2c2c2a)",borderBottom:"2px solid #7a9a6a",padding:"12px 20px",display:"flex",alignItems:"center",gap:12,boxShadow:"0 4px 18px rgba(0,0,0,.35)",flexWrap:"wrap"}}>
        <span style={{fontSize:24}}>☕</span>
        <div>
          <div style={{fontSize:16,fontWeight:700,color:"#e8f0e0",letterSpacing:1}}>드립백 생산 관리 시스템</div>
          <div style={{fontSize:11,color:"#6fcf97"}}>🟢 실시간 연동 · FIFO · BOM</div>
        </div>
        <KstClock/>
        <div style={{marginLeft:"auto",display:"flex",gap:5,flexWrap:"wrap",alignItems:"center"}}>
          {["낱개재고","완제품생산","BOM관리","제품마스터","생산로그","분석","라인별생산량","추적","전광판","설정"].map(t=>(
            <button key={t} onClick={()=>switchTab(t)} style={{padding:"5px 13px",borderRadius:20,border:"none",cursor:"pointer",fontFamily:"inherit",fontSize:13,background:tab===t?(t==="전광판"?"#0d2a18":"#6a8a5a"):"rgba(255,255,255,.1)",color:tab===t?(t==="전광판"?"#00ff88":"#fff"):"#c8c8b8",fontWeight:tab===t?700:400,boxShadow:tab===t&&t==="전광판"?"0 0 8px rgba(0,255,136,.35)":"none"}}>{t==="전광판"?"📺 전광판":t==="분석"?"📊 분석":t==="라인별생산량"?"🟢🔵 라인별 생산량":t==="추적"?"🔍 추적":t}</button>
          ))}
          <div style={{marginLeft:6,display:"flex",alignItems:"center",gap:8,padding:"3px 10px",background:"rgba(255,255,255,.07)",borderRadius:20,border:"1px solid #6a8a5a44"}}>
            <span style={{fontSize:11,color:"#a8b8a0"}}>👤 {user.user_id}</span>
            <button onClick={logout} style={{background:"rgba(200,80,80,.25)",border:"1px solid #c0606044",color:"#e89090",borderRadius:6,padding:"2px 8px",fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>로그아웃</button>
          </div>
        </div>
      </div>

      {/* ════ 전광판 — 컨테이너 밖 전체 폭 ════ */}
      {tab==="전광판"&&(
        <div style={{padding:"0 14px 14px"}}>
          <DashboardView orders={orders} pMaster={pMaster} sMaster={sMaster} channels={channels}/>

      <div style={{padding:"18px 20px",maxWidth:1300,margin:"0 auto",display:tab==="전광판"?"none":"block"}}>

        {/* ════ 낱개재고 ════ */}
        {tab==="낱개재고"&&(
          <div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14,flexWrap:"wrap",gap:8}}>
              <SecTitle icon="📦" title="낱개 재고 현황"/>
              <div style={{display:"flex",gap:8}}>
                <input ref={xlsxRef} type="file" accept=".xlsx,.xls,.csv" onChange={handleExcel} style={{display:"none"}}/>

                <button onClick={resetStock} style={{border:"1px solid #c0606044",borderRadius:8,padding:"7px 15px",fontSize:13,cursor:"pointer",background:"rgba(160,60,60,.2)",color:"#e89090",fontFamily:"inherit"}}>🗑 전체 리셋</button>

              <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
                <div><div style={lbl}>제품 선택</div><select value={stockForm.sCode} onChange={e=>setStockForm(f=>({...f,sCode:e.target.value}))} style={sel}>{[...sMaster].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)).map(s=><option key={s.code} value={s.code}>[{s.code}] {s.name}</option>)}</select></div>

                <div style={{alignSelf:"flex-end",display:"flex",alignItems:"center",gap:6,padding:"8px 12px",background:"rgba(242,201,76,.08)",border:"1px solid #f2c94c44",borderRadius:8,cursor:"pointer"}} onClick={()=>setStockForm(f=>({...f,isPending:!f.isPending}))}>

              <span>📋 엑셀: <b>A열 품목코드</b> | <b>C열 수량</b> | <b>D열 소비기한(YYYYMMDD)</b></span>

                {stockSummary.filter(s=>s.total!==0).map(s=>{const c=sColor(s.code);return(

                <button key={t} onClick={()=>{setOrderTab(t);setCheckedOrders(new Set());}}

                    color:orderTab===t?"#d8ecca":"#8a9a88",
                    borderBottom:orderTab===t?"2px solid "+color:"2px solid transparent",marginBottom:-2}}>
