// 생산계획 통합 (생산계획 앱 이식 + 완제품생산 연동)
// ════════════════════════════════════════════
const PlanApp = (function () {
/* ===== 생산계획 핵심 로직 (분류 / 병합 / 집계 / 파싱) ===== */
const DEFAULT_KEYWORDS = ['리본', '보자기'];
// 매장 출고표에는 15드립백이 아니어도 이 접두어 코드(박스/부속 등)를 함께 넣는다
const STORE_EXTRA_PREFIXES = ['DRP', 'TEP'];

// 비교용 정규화: 공백·괄호·기호·"포장" 제거
function norm(s) {
  return String(s == null ? '' : s).toLowerCase()
    .replace(/[\s\[\](){}+&\/,._\-·'"]/g, '')
    .replace(/포장/g, '');
}
function kwTokens(kw) { return String(kw).split(/\s+/).map(norm).filter(Boolean); }

// 상품명에 들어있는 구분 키워드 찾기 (키워드 안의 모든 단어가 들어있어야 매칭, 더 구체적인 키워드가 우선)
function matchKeywords(name, keywords) {
  const n = norm(name);
  const ms = [];
  (keywords || []).forEach(kw => {
    const label = String(kw).trim().replace(/\s+/g, ' ');
    const t = kwTokens(label);
    if (t.length && t.every(x => n.includes(x))) ms.push({ label, t });
  });
  const kept = ms.filter((a, i) => !ms.some((b, j) => j !== i && (
    (b.t.length > a.t.length && a.t.every(x => b.t.includes(x))) ||
    (b.t.length === a.t.length && b.label === a.label && j < i)
  )));
  const labels = kept.map(k => k.label).sort();
  const tokens = [...new Set(kept.flatMap(k => k.t))];
  return { labels, tokens };
}

// 코드 끝의 알파벳(A,B,C…)을 뗀 기본코드
function baseCode(code) {
  const c = String(code == null ? '' : code).trim().toUpperCase();
  const m = c.match(/^([A-Z]{2,4}\d{3,5})[A-Z]$/);
  return m ? m[1] : c;
}

function classify(code, name, keywords) {
  const mk = matchKeywords(name, keywords);
  const base = baseCode(code);
  return { base, labels: mk.labels, tokens: mk.tokens, key: base + '|' + mk.labels.join('+') };
}

function cleanName(name, tokens) {
  let s = String(name == null ? '' : name);
  s = s.replace(/\[([^\]]*)\]/g, (m, inner) => {
    const parts = inner.split(/\s*[&\/+]\s*/);
    const keep = parts.filter(p => {
      const np = norm(p);
      if (!np) return false;
      if (/쇼핑백/.test(p)) return false;
      if ((tokens || []).some(t => np.includes(t))) return false;
      return true;
    });
    if (keep.length === parts.length) return m;
    if (!keep.length) return '';
    return '[' + keep.join('+') + ']';
  });
  s = s.replace(/\([^)]*쇼핑백[^)]*\)/g, '');
  s = s.replace(/쇼핑백\s*(포함|소|대|중)?/g, '');
  return s.replace(/\s+/g, ' ').trim();
}

function packCount(name) {
  const m = String(name).match(/(\d+)\s*(개입|입|개)/);
  return m ? parseInt(m[1], 10) : 999999;
}
function baseKeyName(name) {
  return String(name).replace(/\s*\d+\s*(개입|입|개)/g, '').trim();
}

// 대표 코드/이름 고르기 (기본코드 자체가 있으면 우선)
function pickRep(cands, base, tokens) {
  const pool = cands.some(c => c.d) ? cands.filter(c => c.d) : cands;   // 주문/매장 쪽 이름 우선, 재고만 있으면 ERP 이름
  const plain = pool.find(c => String(c.code).trim().toUpperCase() === base);
  const rep = plain || pool[0];
  return { code: rep.code, name: cleanName(rep.name, tokens) };
}

function sortBlocks(arr) {
  return arr.sort((a, b) =>
    packCount(a.name) - packCount(b.name) ||
    baseKeyName(a.name).localeCompare(baseKeyName(b.name), 'ko') ||
    String(a.base).localeCompare(String(b.base)));
}

/* ===== 100개입 → 50개입 환산 (총생산계획 전용) =====
   100개입은 생산하지 않고 50개입 2개로 만들어 보낸다. 출고표(온라인/매장)는 100개입 그대로 두고, 총생산계획 계산에서만 환산한다.
   - 맛 4종 [A+B+C+D] → 50개입 [A+B] 1개 + 50개입 [C+D] 1개
   - 맛 1~2종 [A+B]   → 50개입 [A+B] 2개
   50개입 코드는 ERP 재고/주문 데이터에 있는 50개입 상품에서 같은 맛 조합을 찾아 쓴다. */
function parseFlavors(name, keywords) {
  const mk = matchKeywords(name, keywords);
  const cs = cleanName(name, mk.tokens);
  const bs = [...cs.matchAll(/\[([^\]]*)\]/g)];
  const pick = bs.find(m => /[+&\/]/.test(m[1])) || bs[0] || null;
  const flv = pick ? pick[1].split(/\s*[+&\/]\s*/).map(x => x.trim()).filter(Boolean) : [];
  const tmpl = norm(cs.replace(/\[[^\]]*\]/g, '').replace(/\d+\s*(개입|입)/, '50개입'));
  return { mk, cs, pick, flv, tmpl };
}
const flavKey = flv => flv.map(norm).sort().join('|');
function build50Lookup(rows, keywords) {
  const exact = new Map(), loose = new Map();
  (rows || []).forEach(r => {
    if (!r || !r.c || packCount(r.n) !== 50 || !/50\s*(개입|입)/.test(r.n)) return;
    const p = parseFlavors(r.n, keywords);
    if (!p.flv.length) return;
    const fk = flavKey(p.flv), b = baseCode(r.c);
    if (!exact.has(p.tmpl + '#' + fk)) exact.set(p.tmpl + '#' + fk, b);
    if (!loose.has(fk)) loose.set(fk, b);
  });
  return { exact, loose };
}
function split100(rows, keywords, lookup, info) {
  const out = [];
  (rows || []).forEach(r => {
    if (r.x || !/100\s*(개입|입)/.test(r.n) || packCount(r.n) !== 100) { out.push(r); return; }
    const p = parseFlavors(r.n, keywords);
    let parts = null;
    if (p.flv.length === 1 || p.flv.length === 2) parts = [p.flv, p.flv];
    else if (p.flv.length === 4) parts = [p.flv.slice(0, 2), p.flv.slice(2)];
    if (!parts) { info.unmatched.push(r.n); out.push(r); return; }   // 환산 규칙에 없는 구성 → 그대로 두고 경고
    parts.forEach(f => {
      const fk = flavKey(f);
      let code = lookup.exact.get(p.tmpl + '#' + fk) || lookup.loose.get(fk);
      if (!code) { code = 'N50-' + f.join('+'); const t = '[' + f.join('+') + ']'; if (!info.noCode.includes(t)) info.noCode.push(t); }
      const nm = p.cs.replace(/100\s*(개입|입)/, '50$1').replace(p.pick[0], '[' + f.join('+') + ']') + (p.mk.labels.length ? ' [' + p.mk.labels.join('&') + ']' : '');
      out.push({ c: code, n: nm, q: r.q });
    });
    info.converted++;
  });
  return out;
}

/* 총생산계획: 필요수량(온라인+매장) vs ERP 재고 → 기본코드 단위 블록 */
function buildPlan({ erp, online, store, keywords }) {
  const info = { converted: 0, unmatched: [], noCode: [] };
  const lookup = build50Lookup([].concat(erp || [], online || [], store || []), keywords);
  online = split100(online, keywords, lookup, info);
  store = split100(store, keywords, lookup, info);
  const groups = new Map();
  const bases = new Set();
  const get = c => {
    if (!groups.has(c.key)) groups.set(c.key, { key: c.key, base: c.base, labels: c.labels, tokens: c.tokens, online: 0, store: 0, stock: 0, stockCalc: 0, cands: [] });
    return groups.get(c.key);
  };
  (online || []).forEach(r => { const c = classify(r.c, r.n, keywords); const g = get(c); g.online += r.q; g.cands.push({ code: r.c, name: r.n, d: 1 }); bases.add(c.base); });
  (store || []).forEach(r => { if (r.x) return;   // 박스/부속(DRP·TEP)은 생산계획에서 제외
    const c = classify(r.c, r.n, keywords); const g = get(c); g.store += r.q; g.cands.push({ code: r.c, name: r.n, d: 1 }); bases.add(c.base); });
  (erp || []).forEach(r => {
    const c = classify(r.c, r.n, keywords);
    if (!bases.has(c.base)) return;
    const g = get(c);
    g.stock += r.q;
    g.stockCalc += Math.max(0, r.q);   // 마이너스 재고는 0으로 계산
    g.cands.push({ code: r.c, name: r.n });
  });
  const byBase = new Map();
  groups.forEach(g => {
    const rep = pickRep(g.cands, g.base, g.tokens);
    g.code = rep.code; g.name = rep.name; g.need = g.online + g.store;
    if (!byBase.has(g.base)) byBase.set(g.base, []);
    byBase.get(g.base).push(g);
  });
  const blocks = [];
  byBase.forEach((rows, base) => {
    const need = rows.reduce((s, r) => s + r.need, 0);
    if (need <= 0) return;
    rows.sort((a, b) => a.labels.join('+').localeCompare(b.labels.join('+'), 'ko'));
    const shown = rows.filter(r => r.need > 0 || r.stock > 0);
    const stockCalc = rows.reduce((s, r) => s + r.stockCalc, 0);
    const onlineSum = rows.reduce((t, r) => t + r.online, 0);
    blocks.push({
      base, name: shown[0].name, need, stockCalc, prod: need - stockCalc,
      online: onlineSum, onlineShort: onlineSum - stockCalc,   // 온라인 부족 = 온라인 필요 − 재고
      rows: shown.map(r => ({ code: r.code, name: r.name, labels: r.labels, online: r.online, store: r.store, need: r.need, stock: r.stock }))
    });
  });
  // 온라인 우선: 온라인 물량이 재고 대비 많이 부족한 순서 → 온라인 수량 많은 순 → 전체 생산수량 많은 순
  // 그 다음(온라인은 재고로 충당 가능)은 매장 포함 생산이 더 필요한 순서 → 재고 충분한 상품은 맨 아래
  blocks.sort((a, b) => {
    const ga = a.onlineShort > 0 ? 0 : 1, gb = b.onlineShort > 0 ? 0 : 1;
    if (ga !== gb) return ga - gb;
    if (ga === 0) return b.onlineShort - a.onlineShort || b.online - a.online || b.prod - a.prod || String(a.base).localeCompare(String(b.base));
    return b.prod - a.prod || b.online - a.online || String(a.base).localeCompare(String(b.base));
  });
  let rank = 0;
  blocks.forEach(b => { b.rank = b.onlineShort > 0 ? ++rank : 0; });
  blocks.info = info;
  return blocks;
}

/* 출고 인쇄용 집계: 같은 상품(기본코드+구분키워드) 합산, 구분 키워드는 별도 줄 */
function groupDemand(items, keywords) {
  const groups = new Map();
  (items || []).forEach(r => {
    const c = classify(r.c, r.n, keywords);
    if (!groups.has(c.key)) groups.set(c.key, { base: c.base, labels: c.labels, tokens: c.tokens, qty: 0, cands: [] });
    const g = groups.get(c.key);
    g.qty += r.q; g.cands.push({ code: r.c, name: r.n, d: 1 });
  });
  const rows = [];
  groups.forEach(g => {
    const rep = pickRep(g.cands, g.base, g.tokens);
    rows.push({ key: g.base + '|' + g.labels.join('+'), base: g.base, code: rep.code, name: rep.name, labels: g.labels, qty: g.qty });
  });
  return rows.sort((a, b) =>
    packCount(a.name) - packCount(b.name) ||
    baseKeyName(a.name).localeCompare(baseKeyName(b.name), 'ko') ||
    String(a.base).localeCompare(String(b.base)) ||
    a.labels.join('+').localeCompare(b.labels.join('+'), 'ko'));
}

/* ===== 엑셀 파싱 (SheetJS 필요) ===== */
function sheetRows(ws) { return XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null }); }
function findHeaderRow(aoa, needles, maxScan) {
  for (let i = 0; i < Math.min(aoa.length, maxScan || 30); i++) {
    const cells = (aoa[i] || []).map(v => String(v == null ? '' : v).trim());
    if (needles.every(n => cells.includes(n))) return i;
  }
  return -1;
}
const isCode = v => /^[A-Za-z]{2,4}\d{3,}[A-Za-z]?$/.test(String(v == null ? '' : v).trim());

function parseERP(wb) {
  const ws = wb.Sheets[wb.SheetNames[0]];
  const aoa = sheetRows(ws);
  const h = findHeaderRow(aoa, ['품목코드', '품목명', '재고수량']);
  if (h < 0) throw new Error("ERP 재고 파일에서 '품목코드 / 품목명 / 재고수량' 헤더를 찾지 못했어요.");
  const hd = aoa[h].map(v => String(v == null ? '' : v).trim());
  const ci = hd.indexOf('품목코드'), ni = hd.indexOf('품목명'), qi = hd.indexOf('재고수량');
  const sum = new Map();
  for (let i = h + 1; i < aoa.length; i++) {
    const r = aoa[i]; if (!r) continue;
    const code = String(r[ci] == null ? '' : r[ci]).trim();
    if (!isCode(code)) continue;           // 합계 / 출력시각 행 제외
    const q = Number(r[qi]); if (isNaN(q)) continue;
    const k = code.toUpperCase();
    if (!sum.has(k)) sum.set(k, { c: k, n: String(r[ni] == null ? '' : r[ni]).trim(), q: 0 });
    sum.get(k).q += q;
  }
  const t = String((aoa[0] || [])[0] || '').match(/(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})/);
  const date = t ? `${t[1]}-${t[2].padStart(2, '0')}-${t[3].padStart(2, '0')}` : null;
  return { rows: [...sum.values()], meta: { date } };
}

/* 온라인 집계 파일(출고지시서) 파싱
   - 마스터파일 시트에서 주문 행을 읽고, 수령자명에 '매장'이 들어간 행은 매장(s)으로 분리
   - 15드립백 여부는 '드립백 기물 집계' 시트의 SKU→재고관리코드로 판단 (매장 행은 재고관리코드가 비어있는 경우가 있음) */
function parseOnline(wb) {
  const mName = wb.SheetNames.find(n => /마스터/.test(n));
  const gName = wb.SheetNames.find(n => /기물/.test(n) && /집계/.test(n));
  const catMap = new Map();
  let gAoa = null, gh = -1;
  if (gName) {
    gAoa = sheetRows(wb.Sheets[gName]);
    gh = findHeaderRow(gAoa, ['SKU코드', '재고관리코드', '수량'], 10);
    if (gh >= 0) {
      const hd = gAoa[gh].map(v => String(v == null ? '' : v).trim());
      const ci = hd.indexOf('SKU코드'), gi = hd.indexOf('재고관리코드');
      for (let i = gh + 1; i < gAoa.length; i++) {
        const r = gAoa[i]; if (!r || !r[ci]) continue;
        catMap.set(String(r[ci]).trim().toUpperCase(), String(r[gi] == null ? '' : r[gi]).trim());
      }
    }
  }
  const sum = new Map();
  const add = (code, name, q, s, x) => {
    const k = code + '|' + (s || '');
    if (!sum.has(k)) { const o = { c: code, n: name, q: 0 }; if (s) o.s = s; if (x) o.x = 1; sum.set(k, o); }
    sum.get(k).q += q;
  };
  let used = null;
  if (mName) {
    const aoa = sheetRows(wb.Sheets[mName]);
    const h = findHeaderRow(aoa, ['SKU코드', '주문수량', '수령자명'], 10);
    if (h >= 0) {
      used = mName;
      const hd = aoa[h].map(v => String(v == null ? '' : v).trim());
      const ci = hd.indexOf('SKU코드'), ni = hd.indexOf('SKU상품명'), qi = hd.indexOf('주문수량'), gi = hd.indexOf('재고관리코드'), ri = hd.indexOf('수령자명');
      for (let i = h + 1; i < aoa.length; i++) {
        const r = aoa[i]; if (!r) continue;
        const code = String(r[ci] == null ? '' : r[ci]).trim().toUpperCase();
        if (!code) continue;
        const q = Number(r[qi]); if (!(q > 0)) continue;
        const cat = catMap.has(code) ? catMap.get(code) : String(r[gi] == null ? '' : r[gi]).trim();
        const rec = String(r[ri] == null ? '' : r[ri]).trim();
        const isStore = rec.includes('매장');
        const extra = isStore && cat !== '15드립백' && STORE_EXTRA_PREFIXES.some(p => code.startsWith(p));
        if (cat !== '15드립백' && !extra) continue;
        add(code, String(r[ni] == null ? '' : r[ni]).trim(), q, isStore ? rec : '', extra);
      }
    }
  }
  if (!used) {
    // 마스터파일 시트가 없으면 기물 집계 시트로 대체 (매장 구분 불가)
    if (gh < 0) throw new Error("온라인 집계 파일에서 '마스터파일' 또는 '드립백 기물 집계' 시트를 찾지 못했어요.");
    const hd = gAoa[gh].map(v => String(v == null ? '' : v).trim());
    const ci = hd.indexOf('SKU코드'), gi = hd.indexOf('재고관리코드'), ni = hd.indexOf('SKU상품명'), qi = hd.indexOf('수량');
    for (let i = gh + 1; i < gAoa.length; i++) {
      const r = gAoa[i]; if (!r) continue;
      const code = String(r[ci] == null ? '' : r[ci]).trim().toUpperCase();
      const q = Number(r[qi]);
      if (!code || String(r[gi] == null ? '' : r[gi]).trim() !== '15드립백' || !(q > 0)) continue;
      add(code, String(r[ni] == null ? '' : r[ni]).trim(), q, '');
    }
    used = gName + ' (매장 구분 불가)';
  }
  const rows = [...sum.values()];
  return { rows, meta: { sheet: used, store: rows.filter(r => r.s).length } };
}



/* ===== 생산 진행률 =====
   reg = { 기본코드: 수량 } : '계획 불러오기'로 등록한 온라인 오더 수량 (불러오기 중복 방지용)
   fin = { 기본코드: 수량 } : 그중 생산완료 + ERP 처리 + 창고이동까지 끝난 수량 (진행률·클리어 기준)
   1차 계획을 먼저 채우고, 넘치는 분은 2차로 배분.
   2차 필요수량 = 2차 온라인 수량 − (1차 생산 후 남는 ERP 재고), 0이면 재고 충분(진행률 계산 제외) */
function calcProgress({ blocks, online2, erp, reg, fin, keywords }) {
  reg = reg || {}; fin = fin || {};
  const stockBy = {};
  (erp || []).forEach(r => { const b = baseCode(r.c); stockBy[b] = (stockBy[b] || 0) + Math.max(0, r.q); });
  const t1 = {}, need1 = {};
  (blocks || []).forEach(b => { need1[b.base] = b.need; if (b.prod > 0) t1[b.base] = b.prod; });
  const mk = (part, g, base, name, target, over0, o, extra) => {
    const r = over0(reg[base] || 0), f = over0(fin[base] || 0);
    const reg_ = Math.min(r, target), done = Math.min(f, target);
    return Object.assign({ part, g, base, name, target, reg: reg_, done, left: target - reg_, rem: target - done, o }, extra || {});
  };
  const list = [];
  (blocks || []).filter(b => b.prod > 0).forEach(b => {
    list.push(mk('1', b.onlineShort > 0 ? 0 : 2, b.base, b.name, b.prod, v => v, b.onlineShort > 0 ? b.onlineShort : b.prod));
  });
  const m2 = {};
  groupDemand(online2 || [], keywords).forEach(r => { const m = m2[r.base] || (m2[r.base] = { base: r.base, name: r.name, qty: 0 }); m.qty += r.qty; });
  Object.values(m2).forEach(m => {
    const leftover = Math.max(0, (stockBy[m.base] || 0) - (need1[m.base] || 0));
    const short = Math.max(0, m.qty - leftover);
    list.push(mk('2', short > 0 ? 1 : 3, m.base, m.name, short, v => Math.max(0, v - (t1[m.base] || 0)), short, { qty: m.qty }));
  });
  const ord = list.map((x, i) => [x, i]);
  ord.sort((a, b) => a[0].g - b[0].g || (a[0].g === 1 ? b[0].o - a[0].o : 0) || a[1] - b[1]);
  const sorted = ord.map(x => x[0]);
  const mm = {};
  list.forEach(x => {
    const m = mm[x.base] || (mm[x.base] = { base: x.base, name: x.name, t1: 0, t2: 0, g: 9, o: 0 });
    if (x.part === '1') { m.t1 = x.target; m.name = x.name; } else m.t2 = x.target;
    m.g = Math.min(m.g, x.g); m.o += x.o;
  });
  const merged = Object.values(mm).map((m, i) => {
    const target = m.t1 + m.t2, r = Math.min(reg[m.base] || 0, target), f = Math.min(fin[m.base] || 0, target);
    return { ...m, i, target, reg: r, done: f, left: target - r, rem: target - f };
  });
  merged.sort((a, b) => a.g - b.g || (a.g <= 1 ? b.o - a.o : 0) || a.i - b.i);
  const stat = l => { const L = l.filter(x => x.target > 0); const T = L.reduce((s, x) => s + x.target, 0), D = L.reduce((s, x) => s + x.done, 0); return { pct: T ? Math.floor(D / T * 100) : null, clr: L.filter(x => x.done >= x.target).length, n: L.length }; };
  return { merged, list: sorted, s1: stat(list.filter(x => x.part === '1')), s2: stat(list.filter(x => x.part === '2')), all: stat(list) };
}

/* 날짜 데이터(up) 전체로 1차 계획 + 진행률 계산 (2차도 100개입→50개입 환산) */
function planCompute(up, keywords, reg, fin) {
  up = up || {};
  const rowsOf = k => (up[k] && up[k].rows) || [];
  const on = k => rowsOf(k).filter(r => !r.s), st = k => rowsOf(k).filter(r => r.s);
  const blocks = buildPlan({ erp: rowsOf('erp'), online: on('online1'), store: st('online1'), keywords });
  const info2 = { converted: 0, unmatched: [], noCode: [] };
  const lookup = build50Lookup([].concat(rowsOf('erp'), rowsOf('online1'), rowsOf('online2')), keywords);
  const o2 = split100(on('online2'), keywords, lookup, info2);
  const prog = calcProgress({ blocks, online2: o2, erp: rowsOf('erp'), reg, fin, keywords });
  return { blocks, prog };
}
async function fetchDay(sb, day) {
  const [u, s] = await Promise.all([
    sb.from('plan_uploads').select('kind,file_name,rows,meta,updated_at,updated_by').eq('work_date', day),
    sb.from('plan_settings').select('value').eq('key', 'split_keywords').maybeSingle()
  ]);
  if (u.error) throw new Error(u.error.message);
  const uploads = {}; (u.data || []).forEach(r => { uploads[r.kind] = r; });
  const keywords = s.data && Array.isArray(s.data.value) ? s.data.value : DEFAULT_KEYWORDS.slice();

/* ================= 앱 ================= */
const sb = ctx.sb;

const TEAM = '제품생산팀(가공파트)';
const KINDS = {
  erp:     { label: 'ERP 재고',   step: '① 1차 작업', hint: '완제품창고 재고현황', parse: parseERP },
  online1: { label: '1차 집계 (출고지시서)', step: '② 1차 작업', hint: '매장 주문 포함 · 매장은 자동 분류', parse: parseOnline },
  online2: { label: '2차 집계 (출고지시서)', step: '③ 10시 이후', hint: '1차가 포함되지 않은 파일', parse: parseOnline }
};
const STORE_ORDER = ['영도', '온천장', '마린'];
const S = { user: ctx.user || { name: '' }, date: ctx.date || todayStr(), keywords: DEFAULT_KEYWORDS.slice(), up: {}, tab: 'plan', onlyShort: false, reg: {}, fin: {} };
let orders = ctx.orders || [];

const $ = s => host.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dateKo(s) { const [y, m, d] = s.split('-').map(Number); return `${y}년 ${m}월 ${d}일 ${'일월화수목금토'[new Date(y, m - 1, d).getDay()]}요일`; }
function toast(msg, ms) { const t = $('#toast'); t.textContent = msg; t.classList.remove('hide'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hide'), ms || 3200); }
const onlineOf = u => (u && u.rows ? u.rows.filter(r => !r.s) : []);
const storeOf = u => (u && u.rows ? u.rows.filter(r => r.s) : []);
const optText = labels => labels.map(l => '[' + l + ']').join(' ');

/* ---------- DB ---------- */
async function addLog(action, detail) {
  if (['업로드', '삭제', '키워드 변경'].includes(action)) { try { window.dispatchEvent(new Event('plan-updated')); } catch (e) { } }
  try { await sb.from('plan_logs').insert({ work_date: S.date, action, detail, user_email: S.user && S.user.name }); } catch (e) { }
}
async function loadSettings() {
  const { data, error } = await sb.from('plan_settings').select('key,value').eq('key', 'split_keywords').maybeSingle();
  if (error) { toast('설정 불러오기 실패: ' + error.message + ' (SQL을 먼저 실행했는지 확인)'); return; }
  if (data && Array.isArray(data.value)) S.keywords = data.value;
}
async function saveKeywords() {
  const { error } = await sb.from('plan_settings').upsert({ key: 'split_keywords', value: S.keywords, updated_by: S.user.name }, { onConflict: 'key' });
  if (error) { toast('키워드 저장 실패: ' + error.message); return false; }
  addLog('키워드 변경', S.keywords.join(', '));
  return true;
}
async function loadUploads() {
  S.up = {};
  const { data, error } = await sb.from('plan_uploads').select('kind,file_name,rows,meta,updated_at,updated_by').eq('work_date', S.date);
  if (error) toast('데이터 불러오기 실패: ' + error.message);
  (data || []).forEach(r => { S.up[r.kind] = r; });
  renderAll();
}
async function handleFile(kind, file) {
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const res = KINDS[kind].parse(wb);
    if (!res.rows.length) { toast('읽을 수 있는 품목이 없어요. 파일을 확인해 주세요.', 4500); return; }
    const rec = { work_date: S.date, kind, file_name: file.name, rows: res.rows, meta: res.meta || {}, updated_by: S.user.name };
    const { error } = await sb.from('plan_uploads').upsert(rec, { onConflict: 'work_date,kind' });
    S.up[kind] = { ...rec, updated_at: new Date().toISOString() };
    if (error) toast('화면에는 반영됐지만 저장에 실패했어요: ' + error.message, 5000);
    else { toast(`${KINDS[kind].label}: ${res.rows.length}건 불러오기 완료`); addLog('업로드', `${KINDS[kind].label} · ${file.name} · ${res.rows.length}건`); }
    renderAll();
  } catch (e) { toast(e.message || '파일을 읽는 중 오류가 났어요.', 5000); }
}
async function removeUpload(kind) {
  if (!confirm(`${KINDS[kind].label} 데이터를 삭제할까요?`)) return;
  const { error } = await sb.from('plan_uploads').delete().eq('work_date', S.date).eq('kind', kind);
  if (error) { toast('삭제 실패: ' + error.message); return; }
  delete S.up[kind]; addLog('삭제', KINDS[kind].label); renderAll();
}

/* Drip2 오더(실시간) → '계획 불러오기'로 등록한 온라인 오더: 등록 수량(reg) / 완료+ERP+창고이동까지 끝난 수량(fin) */
function calcReg() {
  const r = {}, f = {};
  (orders || []).forEach(o => {
    if (o.plan_date !== S.date || o.channel !== '온라인' || !o.plan_pick) return;
    const b = baseCode(o.p_code);
    r[b] = (r[b] || 0) + (o.qty || 0);
    f[b] = (f[b] || 0) + (o.qty || 0); // 불러오기로 등록되면 바로 진행률 반영
  });
  return { reg: r, fin: f };
}
function syncReg(force) {
  const n = calcReg();
  if (!force && JSON.stringify(n) === JSON.stringify({ reg: S.reg, fin: S.fin })) return;
  S.reg = n.reg; S.fin = n.fin;
  if (S.tab === 'plan') renderPanel();
}

/* ---------- 렌더 ---------- */
function renderAll() { renderUploads(); renderWarns(); renderPanel(); }

function renderUploads() {
  $('#ups').innerHTML = Object.keys(KINDS).map(k => {
    const u = S.up[k], K = KINDS[k];
    const when = u && u.updated_at ? new Date(u.updated_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : '';
    return `<div class="up ${u ? 'done' : ''}" data-k="${k}">
      <h3>${K.label}<span class="step">${K.step}</span></h3>
      <div class="st">${u ? `✔ ${esc(u.file_name)}<br>${u.rows.length}건${u.meta && u.meta.store ? ` (매장 ${u.meta.store}건 포함)` : ''} · ${when} 저장` : '엑셀 파일을 끌어다 놓거나 선택하세요<br>' + K.hint}</div>
      <div class="row"><label class="btn" style="padding:3px 10px">파일 선택<input type="file" accept=".xlsx,.xlsm,.xls" hidden data-k="${k}"></label>
      ${u ? `<button class="x" data-del="${k}">삭제</button>` : ''}</div>
    </div>`;
  }).join('');
  host.querySelectorAll('.up').forEach(el => {
    const k = el.dataset.k;
    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drag'); });
    el.addEventListener('dragleave', () => el.classList.remove('drag'));
    el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('drag'); if (e.dataTransfer.files[0]) handleFile(k, e.dataTransfer.files[0]); });
  });
  host.querySelectorAll('.up input[type=file]').forEach(i => i.addEventListener('change', e => { if (e.target.files[0]) handleFile(i.dataset.k, e.target.files[0]); e.target.value = ''; }));
  host.querySelectorAll('[data-del]').forEach(b => b.onclick = () => removeUpload(b.dataset.del));
}

function renderWarns() {

const STORE_COLORS = [['#cfe2ff', '#eaf2ff'], ['#ffdfbf', '#fff3e6'], ['#cfeed3', '#eefaef'], ['#e3d4f5', '#f5eefc'], ['#f8d3de', '#fdeff3']];
const storeColor = (name, i) => { const k = STORE_ORDER.findIndex(x => name.includes(x)); return STORE_COLORS[(k < 0 ? i : k) % STORE_COLORS.length]; };

// 매장 표: 매장별로 세로로 쌓기 (색 구분, 소비기한/수량 한 세트)
function storeSection(kind) {
  const rows = storeOf(S.up[kind]); if (!rows.length) return null;
  const stores = [...new Set(rows.map(r => r.s))].sort((a, b) => {
    const ia = STORE_ORDER.findIndex(x => a.includes(x)), ib = STORE_ORDER.findIndex(x => b.includes(x));
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b, 'ko');
  });
  const groups = stores.map((st, i) => {
    const items = groupDemand(rows.filter(r => r.s === st), S.keywords);
    return { store: st, color: storeColor(st, i), items, total: items.reduce((a, r) => a + r.qty, 0) };
  });
  return { title: '드립백 매장출고 ' + (kind === 'online1' ? '1차' : '2차'), groups, total: groups.reduce((a, g) => a + g.total, 0) };
}
function storeSheetHtml(x) {
  let h = `<div class="sec"><div class="ptitle"><div>${esc(x.title)} <span style="font-size:12px;font-weight:400">· ${TEAM}</span></div><div class="d">${dateKo(S.date)}</div></div>
  <table class="p st"><colgroup><col style="width:58px"><col style="width:66px"><col style="width:230px"><col style="width:46px"><col style="width:44px"><col style="width:150px"><col style="width:62px"></colgroup>

  });

}
function viewStore(kind) {

const pk = (lbl, st) => `<div class="kpi"><b style="${st.pct >= 100 ? 'color:#1b6b2a' : ''}">${st.pct === null ? '-' : st.pct >= 100 ? '100% 클리어' : st.pct + '%'}</b><span>${lbl}${st.pct === null ? '' : ` (${st.clr}/${st.n})`}</span></div>`;
function mergedCells(x, span, has2) {
  if (!has2) return '';
  if (!x) return `<td rowspan="${span}">-</td><td rowspan="${span}">-</td>`;
  return `<td rowspan="${span}" class="big${x.t2 > 0 ? ' warn' : ''}">${x.t2 > 0 ? x.t2 : '-'}</td><td rowspan="${span}" class="big">${x.target}</td>`;
}
function progCell(x, span) {
  if (!x || x.target <= 0) return `<td rowspan="${span}" class="noprt"></td>`;
  const pct = Math.min(100, Math.floor(x.done / x.target * 100)), full = x.done >= x.target;
  return `<td rowspan="${span}" class="noprt${full ? ' okc' : ''}" style="white-space:nowrap">${full ? '✅ 클리어' : pct + '%'}<div style="font-size:11px;font-weight:400">완료 ${x.done} / ${x.target}${x.reg > x.done ? ' · 등록 ' + x.reg : ''}</div><div class="pbar${full ? ' full' : ''}"><i style="width:${pct}%"></i></div></td>`;
}
function p2Html(prog, baseSet) {
  const L = prog.merged.filter(x => x.t2 > 0 && !baseSet.has(x.base));
  if (!L.length) return '';
  return `<div class="sec" style="margin-top:16px"><div class="bar"><b>2차 단독 품목</b><span class="note">1차 총생산계획에 없는 상품 · 2차 온라인 수량 − 1차 생산 후 남는 재고</span></div>
  <table class="t" style="width:auto;min-width:520px"><thead><tr><th>코드</th><th>품목명</th><th>2차 필요</th><th>등록</th><th>완료</th><th>진행</th></tr></thead><tbody>${L.map(x => {
    const pct = Math.min(100, Math.floor(x.done / x.target * 100)), full = x.done >= x.target;
    return `<tr><td>${esc(x.base)}</td><td class="l">${esc(x.name)}</td><td class="big">${x.target}</td><td>${x.reg}</td><td>${x.done}</td><td class="${full ? 'okc' : ''}" style="min-width:110px">${full ? '✅ 클리어' : pct + '%'}<div class="pbar${full ? ' full' : ''}"><i style="width:${pct}%"></i></div></td></tr>`;
  }).join('')}</tbody></table></div>`;
}
function viewPlan() {
  const u = S.up;
  const miss = [];
  if (!u.erp) miss.push('ERP 재고'); if (!u.online1) miss.push('1차 집계');
  if (miss.length === 2) return '<div class="empty">ERP 재고 · 1차 집계(출고지시서) 파일을 올리면 총생산계획이 만들어져요.</div>';
  const pc = planCompute(u, S.keywords, S.reg, S.fin);
  let blocks = pc.blocks;
  const prog = pc.prog;
  const pm = {}; prog.merged.forEach(x => { pm[x.base] = x; });
  const has2 = prog.merged.some(x => x.t2 > 0);
  const baseSet = new Set(blocks.map(b => b.base));
  const kpi = {
    n: blocks.length,
    short: blocks.filter(b => b.prod > 0).length,
    sum: blocks.reduce((s, b) => s + Math.max(0, b.prod), 0)
  };
  const info = blocks.info || { converted: 0, unmatched: [], noCode: [] };
  if (S.onlyShort) blocks = blocks.filter(b => b.prod > 0 || (pm[b.base] && pm[b.base].t2 > 0));
  let h = '';
  if (info.converted) h += `<div class="warnbox" style="background:rgba(255,255,255,.08);border-color:#5a5a56">100개입 주문 <b>${info.converted}건</b>을 50개입으로 환산해서 계산했어요. (출고표는 100개입 그대로예요)</div>`;
  if (info.noCode.length) h += `<div class="warnbox">⚠ 50개입 코드를 ERP·주문 데이터에서 못 찾은 조합이에요: <b>${info.noCode.map(esc).join(', ')}</b> — 코드가 N50-로 표시돼요. 50개입 상품이 ERP 재고 파일에 있는지 확인해 주세요.</div>`;
  if (info.unmatched.length) h += `<div class="warnbox">⚠ 환산 규칙(맛 1·2·4종)에 없어 100개입 그대로 둔 상품: <b>${[...new Set(info.unmatched)].map(esc).join(', ')}</b></div>`;
  if (miss.length) h += `<div class="warnbox">아직 올리지 않은 파일: <b>${miss.join(', ')}</b> — 올린 파일만으로 계산한 결과예요.</div>`;
  h += `<div class="cards"><div class="kpi"><b>${kpi.n}</b><span>집계 상품</span></div><div class="kpi"><b>${kpi.short}</b><span>생산 필요 상품</span></div><div class="kpi"><b>${kpi.sum}</b><span>총 생산수량</span></div>
  ${pk('전체 진행', prog.all)}${pk('1차 진행', prog.s1)}${pk('2차 진행', prog.s2)}</div>
  <div class="bar"><b>총생산계획</b> <label><input type="checkbox" id="only-short" ${S.onlyShort ? 'checked' : ''}> 생산 필요한 것만 보기</label><span class="sp"></span>
  <button class="btn" id="btn-xls">엑셀 저장</button><button class="btn" id="btn-img">이미지 복사</button><button class="btn pri" id="btn-print">인쇄</button></div>
  <div class="printable scroll"><div class="sec"><div class="ptitle"><div>드립백 총생산계획 <span style="font-size:12px;font-weight:400">· ${TEAM}</span></div><div class="d">${dateKo(S.date)}</div></div>
  <table class="t"><thead><tr><th>온라인<br>우선순위</th><th>품목코드</th><th>품목명</th><th>옵션</th><th>온라인</th><th>매장</th><th>필요수량</th><th>재고</th><th>온라인<br>부족</th><th>생산수량</th>${has2 ? '<th>2차<br>추가</th><th>통합<br>생산</th>' : ''}<th class="noprt">진행</th></tr></thead><tbody>`;
  blocks.forEach(b => {
    b.rows.forEach((r, i) => {
      h += `<tr>`;
      if (i === 0) h += `<td rowspan="${b.rows.length}" class="big">${b.rank || '-'}</td>`;
      h += `<td>${esc(r.code)}</td><td class="l">${esc(r.name)}</td><td>${esc(optText(r.labels))}</td><td>${r.online}</td><td>${r.store}</td><td>${r.need}</td><td${r.stock < 0 ? ' class="neg"' : ''}>${r.stock}</td>`;
      if (i === 0) h += `<td rowspan="${b.rows.length}" class="big${b.onlineShort > 0 ? ' warn' : ''}">${b.onlineShort > 0 ? b.onlineShort : '-'}</td><td rowspan="${b.rows.length}" class="big${b.prod < 0 ? ' neg' : ''}">${b.prod}</td>${mergedCells(pm[b.base], b.rows.length, has2)}${progCell(pm[b.base], b.rows.length)}`;
      h += '</tr>';
    });
  });
  if (!blocks.length) h += '<tr><td colspan="${has2 ? 13 : 11}" style="padding:24px">표시할 상품이 없어요.</td></tr>';
  h += `</tbody></table><div class="note">정렬: 온라인 물량이 재고 대비 많이 부족한 순서(온라인 부족 = 온라인 − 재고)로 먼저 생산해요. 생산수량 = 필요수량(온라인+매장, 리본/보자기 포함) − ERP 재고. 빨간색은 재고가 더 많은(생산 불필요) 상품이에요. 마이너스 재고는 0으로 계산해요.</div></div></div>
  <div class="note">2차 집계를 올리면 ‘2차 추가’와 ‘통합 생산’(1차+2차)이 같이 나와요. 진행 = ‘📋 생산계획 불러오기’로 불러와 온라인으로 <b>등록한</b> 수량 ÷ 통합 생산 (오더가 바뀌면 자동 반영). 인쇄에서는 진행 칸이 빠져요.</div>${p2Html(prog, baseSet)}`;
  return h;
}

/* ---------- 이미지 복사 (웍스 공유용 캡처) ---------- */
async function captureImage() {
  const el = host.querySelector('.printable');
  if (!el) return toast('캡처할 표가 없어요.');
  const btn = $('#btn-img'); const old = btn.textContent; btn.disabled = true; btn.textContent = '캡처 중…';
  try {
    if (typeof html2canvas === 'undefined') throw new Error('캡처 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff', width: el.scrollWidth, windowWidth: Math.max(el.scrollWidth, 1000) });
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    if (!blob) throw new Error('이미지를 만들지 못했어요.');
    let copied = false;
    try {
      if (navigator.clipboard && window.ClipboardItem) { await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); copied = true; }
    } catch (e) { copied = false; }
    if (copied) toast('이미지를 복사했어요. 웍스 채팅방에 Ctrl+V로 붙여넣으세요.', 4500);
    else {
      const name = { plan: '총생산계획', online1: '온라인1차', store1: '매장1차', online2: '온라인2차', store2: '매장2차' }[S.tab];
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `생산계획_${name}_${S.date.replace(/-/g, '')}.png`; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      toast('이 환경에서는 복사가 막혀 있어 이미지 파일로 저장했어요. 파일을 웍스에 올려주세요.', 5500);
    }
    addLog('이미지 복사', S.tab);
  } catch (e) { toast(e.message || '캡처 중 오류가 났어요.', 5000); }
  btn.disabled = false; btn.textContent = old;
}

function exportXls() {
  const wb = XLSX.utils.book_new();

  //   - 아무 변경 없으면 목록 조회 0회 (여러 명이 켜둬도 DB 부담 거의 없음)
  //   - 안전장치: 5분마다 1회 전체 갱신 / drip2_sync 테이블이 없거나 오류면 기존 30초 폴링으로 자동 전환
  const syncRef = useRef({
    orders: null,
    stock: null
  });
  useEffect(() => {
    if (!user) return;
    loadAll();
    const SYNC_CHECK_MS = 10000,
      FALLBACK_POLL_MS = 30000,
      SAFETY_REFRESH_MS = 5 * 60 * 1000;
    const canPoll = () => !pollPaused.current && document.visibilityState === "visible";
    let syncOk = true,
      lastFallback = Date.now(),
      lastSafety = Date.now(),
      lastStock = Date.now(),
      lastSyncFail = 0;
    const SYNC_RETRY_MS = 5 * 60 * 1000; // 폴백 중에도 5분마다 drip2_sync 복구 여부 재확인
    const checkSync = async force => {
      if (!canPoll()) return;
      const now = Date.now();
      if (!syncOk && now - lastSyncFail >= SYNC_RETRY_MS) {
        syncOk = true;
        syncRef.current = {
          orders: null,
          stock: null
        }; // 복구 직후 기준 시각부터 다시 잡음 (이번 회차는 폴백 조회로 최신화)
        force = true;
      }
      if (syncOk) {
        const {
          data,
          error
        } = await sb.from("drip2_sync").select("key,changed_at");
        if (error || !data || !data.length) {
          syncOk = false;
          lastSyncFail = now;
          console.warn("drip2_sync 사용 불가 → 30초 폴링으로 전환 (5분 후 재시도)", error?.message || "");
        } else {
          const m = {};
          data.forEach(r => {
            m[r.key] = r.changed_at;
          });
          const prev = syncRef.current;
          const ordersChanged = prev.orders !== null && m.orders !== prev.orders;
          const stockChanged = prev.stock !== null && m.stock !== prev.stock;
          syncRef.current = {
            orders: m.orders ?? null,
            stock: m.stock ?? null
          };
          if (force || ordersChanged || now - lastSafety >= SAFETY_REFRESH_MS) {
            lastSafety = now;
            loadOrders();
          }
          if ((force || stockChanged) && tabRef.current !== "전광판") loadStock();
          return;
        }
      }
      // 폴백: 기존 방식 (주문 30초 / 재고 60초, 전광판 탭은 재고 제외)
      if (force || now - lastFallback >= FALLBACK_POLL_MS) {
        lastFallback = now;
        loadOrders();
        if (tabRef.current !== "전광판" && (force || now - lastStock >= 60000)) {
          lastStock = now;
          loadStock();
        }
      }
    };
    checkSync(false); // 기준 시각 저장 (loadAll이 이미 최신 데이터를 불러옴)
    const syncTimer = setInterval(() => checkSync(false), SYNC_CHECK_MS);
    const onVisible = () => {
      if (document.visibilityState !== "visible" || pollPaused.current) return;
      checkSync(true);
    };
    document.addEventListener("visibilitychange", onVisible);
    return () => {
      clearInterval(syncTimer);
      document.removeEventListener("visibilitychange", onVisible);
    };
  }, [user]);
  useEffect(() => {
    if (!user || tab !== "완제품생산") return;
    loadTodayNote();
    const t = setInterval(() => {
      if (document.visibilityState === "visible" && !todayEditing) loadTodayNote();
    }, 5 * 60 * 1000);
    return () => clearInterval(t);
  }, [user, tab, todayEditing]);
  useEffect(() => {
    if (channels.length > 0 && !orderForm.channelId) setOrderForm(f => ({
      ...f,

    }));
  }, [channels]);
  const loadAll = async () => {
    setLoading(true);
    await Promise.all([loadMasters(), loadBom(), loadStock(), loadOrders(), loadChannels(), loadShipTypes()]);
    // 초기 탭이 생산로그면 자동 로드
    if (tab === "생산로그") loadLog();
    if (tab === "취소복귀로그") loadActionLog();
    setLoading(false);
  };
  const loadMasters = async () => {
    const [{
      data: sm
    }, {
      data: pm
    }] = await Promise.all([sb.from("drip2_single_master").select("*").order("code"), sb.from("drip2_product_master").select("*").order("sort_order").order("code")]);
    if (sm) {
      setSMaster(sm);
      setStockForm(f => ({
        ...f,
        sCode: f.sCode && sm.find(x => x.code === f.sCode) ? f.sCode : sm[0]?.code || ""
      }));
      setNewComp(f => ({
        ...f,
        sCode: f.sCode && sm.find(x => x.code === f.sCode) ? f.sCode : sm[0]?.code || ""
      }));
    }
    if (pm) {
      setPMaster(pm);
      setOrderForm(f => ({
        ...f,
        pCode: f.pCode && pm.find(x => x.code === f.pCode) ? f.pCode : pm[0]?.code || ""
      }));
      setBomPCode(p => p && pm.find(x => x.code === p) ? p : pm[0]?.code || "");

  };
  const loadBom = async () => {
    const {
      data
    } = await sb.from("drip2_bom").select("*");
    if (data) {
      setBomData(data);
      setBomLoaded(true);
    }
  };
  const sortStock = arr => [...arr].sort((a, b) => a.s_code.localeCompare(b.s_code) || cmpBatch(a, b));
  // ★ DB에서 최신 재고를 직접 조회 (다른 세션의 변경사항을 놓치지 않기 위함 — 로컬 state에 의존하지 않음)
  const fetchStock = async () => {
    const {
      data
    } = await sb.from("drip2_stock").select("*");

    setStock(await fetchStock());

  // ★ [DB 부하 개선] 전체 이력 대신 필요한 범위만 조회
  //   ① 완료 안 된 건(대기/투입완료/확정) 전부  ② 최근 7일 완료 건  ③ 조회 날짜가 7일 이전이면 그 날짜 건
  const ORDER_WINDOW_DAYS = 7;
  const viewDateRef = useRef(viewDate);
  // 다른 날짜까지 포함한 ERP/창고이동 미처리 완료건 (id·날짜만 가볍게)
  const loadProcPending = async () => {
    const {
      data,
      error
    } = await sb.from("drip2_orders").select("id,plan_date,erp_done,wh_done").eq("status", "완료").or("erp_done.is.null,erp_done.eq.false,wh_done.is.null,wh_done.eq.false").order("plan_date", {
      ascending: false
    }).limit(2000);
    if (error) {
      setProcPending(null);
      return;
    }
    setProcPending(data || []);
  };
  const loadOrders = async () => {
    loadProcPending();
    const cutoff = addDays(today(), -ORDER_WINDOW_DAYS);
    const vd = viewDateRef.current;
    const reqs = [sb.from("drip2_orders").select("*").or("status.neq.완료,plan_date.gte." + cutoff + ",plan_date.is.null").order("priority")];
    if (vd && vd < cutoff) reqs.push(sb.from("drip2_orders").select("*").eq("plan_date", vd).order("priority"));
    const res = await Promise.all(reqs);
    if (res.some(r => r.error)) {
      console.error("주문 조회 오류:", res.find(r => r.error).error.message);
      return;
    }
    const byId = new Map();
    res.forEach(r => (r.data || []).forEach(o => byId.set(o.id, o)));
    const data = [...byId.values()].sort((a, b) => a.priority - b.priority);
    setOrders(prev => {
      // 데이터 변경 없으면 리렌더 방지 (수량·ERP·담당자 변경도 감지)
      if (prev.length === data.length && JSON.stringify(prev) === JSON.stringify(data)) return prev;
      return data;
    });
  };
  // 조회 날짜가 7일 이전으로 바뀌면 그 날짜 주문을 추가로 불러옴
  useEffect(() => {

  // 신규 우선순위: 화면에 없는 과거 건까지 고려해 DB 최대값 기준으로 계산
  const getNextPriority = async () => {
    const {
      data
    } = await sb.from("drip2_orders").select("priority").order("priority", {
      ascending: false
    }).limit(1);
    const dbMax = data && data.length ? data[0].priority || 0 : 0;
    const localMax = orders.length ? Math.max(...orders.map(o => o.priority || 0)) : 0;

  const loadLog = async (from, to) => {

  const loadTodayNote = async () => {

    } = await sb.from("drip2_ana_notes").select("date,note,workers,hours,overtime").eq("date", d).maybeSingle();

    if (overtime < 0) return alert("⚠️ 연장근무 시간은 0 이상이어야 합니다.");

  // ── 1000행 제한 없이 전부 가져오기 (1000행씩 나눠서 조회) ──
  const fetchAllRows = async makeQuery => {
    const PAGE = 1000;
    let all = [],
      from = 0;
    for (;;) {
      const {
        data,
        error
      } = await makeQuery().range(from, from + PAGE - 1);
      if (error) return {
        data: null,
        error
      };
      all = all.concat(data || []);
      if (!data || data.length < PAGE) return {
        data: all,
        error: null
      };
      from += PAGE;
    }
  };
  // ── 분석2: 지정 기간 완료 데이터 ──

  const runTraceP2M = async () => {

    const recipe = bomOf(order.p_code);

  // ── 생산확정 건에 실제 초과 생산분(추가 수량) 반영: 계획 추가 없이 수량+재고차감만 처리 ──

        });

    };

      qty: newQty,

    } : o));

    // ★ 재고 DB 반영 (동시수정 감지 CAS)

      ...x,
      sort_order: i

      missing: av == null,
      sub: anaDayMap[d]
    };
  });
  const anaUtilValsFilled = anaUtilTrend.filter(d => !d.missing).map(d => d.value);
  const anaUtilAvg = anaUtilValsFilled.length ? anaUtilValsFilled.reduce((a, b) => a + b, 0) / anaUtilValsFilled.length : 0;
  const anaUtilMax = anaUtilValsFilled.length ? Math.max(...anaUtilValsFilled) : 0;
  const anaUtilMin = anaUtilValsFilled.length ? Math.min(...anaUtilValsFilled) : 0;

  // 일별 낱개 포장량 집계 — 완제품 생산완료 수량 × 그 제품 BOM 구성품 총 수량 (예: 세트 하나에 낱개 6종×3개=18개 들어가면 100세트=1800개)
  const anaPackDayMap = {};
  anaRows.forEach(r => {
    const d = (r.plan_date || "").slice(0, 10);
    if (!d) return;
    const unitsPerProduct = bomOf(r.p_code).reduce((a, c) => a + (c.qty || 0), 0);
    anaPackDayMap[d] = (anaPackDayMap[d] || 0) + (r.qty || 0) * unitsPerProduct;
  });
  const anaPackDayKeys = Object.keys(anaPackDayMap).sort();
  const anaPackTrend = anaPackDayKeys.map(d => ({
    date: d,
    label: d.slice(5).replace("-", "/"),
    value: anaPackDayMap[d]
  }));
  const anaPackTotal = anaPackDayKeys.reduce((a, d) => a + anaPackDayMap[d], 0);
  const anaPackAvg = anaPackDayKeys.length ? anaPackTotal / anaPackDayKeys.length : 0;
  const anaPackMax = anaPackDayKeys.length ? Math.max(...anaPackDayKeys.map(d => anaPackDayMap[d])) : 0;
  // ══ 분석2: 요일별 생산량 + 업체별 낱개 (요일별) ══
  const A2_WD = [1, 2, 3, 4, 5, 6, 0]; // 월~일 순서
  const a2UnitsOf = code => bomOf(code).reduce((a, c) => a + (c.qty || 0), 0);
  // 분석은 출고업체 단위로만 집계 (대량납품은 납품업체명과 관계없이 "대량납품" 하나로 묶음)
  const a2Key = r => (r.channel || "미입력").trim() || "미입력";
  const a2Wd = {};
  A2_WD.forEach(w => {
    a2Wd[w] = {
      days: new Set(),
      qty: 0,
      unit: 0,
      ch: {}
    };
  });
  const a2Ch = {}; // {업체:{qty,unit,days:Set,wd:{w:{qty,unit}}}}
  const a2Date = {}; // {날짜:{qty,unit,ch:{업체:{qty,unit}}}}
  a2Rows.forEach(r => {
    const d = (r.plan_date || "").slice(0, 10);
    if (!d) return;
    const w = new Date(d + "T00:00:00Z").getUTCDay();
    const q = r.qty || 0,
      u = q * a2UnitsOf(r.p_code),
      k = a2Key(r);
    const W = a2Wd[w];
    W.days.add(d);
    W.qty += q;
    W.unit += u;
    if (!W.ch[k]) W.ch[k] = {
      qty: 0,
      unit: 0
    };
    W.ch[k].qty += q;
    W.ch[k].unit += u;
    if (!a2Ch[k]) a2Ch[k] = {
      qty: 0,
      unit: 0,
      days: new Set(),
      wd: {}
    };
    const C = a2Ch[k];
    C.qty += q;
    C.unit += u;
    C.days.add(d);
    if (!C.wd[w]) C.wd[w] = {
      qty: 0,
      unit: 0
    };
    C.wd[w].qty += q;
    C.wd[w].unit += u;
    if (!a2Date[d]) a2Date[d] = {
      qty: 0,
      unit: 0,
      ch: {}
    };
    a2Date[d].qty += q;
    a2Date[d].unit += u;
    if (!a2Date[d].ch[k]) a2Date[d].ch[k] = {
      qty: 0,
      unit: 0
    };
    a2Date[d].ch[k].qty += q;
    a2Date[d].ch[k].unit += u;
  });
  const a2Pick = o => o ? a2Metric === "unit" ? o.unit : o.qty : 0;
  const a2Unit = a2Metric === "unit" ? "개(낱개)" : "개(완제품)";
  const a2Fmt = v => Math.round(v).toLocaleString();
  // 화면에 보여줄 요일: 월~금은 항상, 토·일은 생산이 있었던 경우만
  const a2WdShow = A2_WD.filter(w => w >= 1 && w <= 5 || a2Wd[w].days.size > 0);
  const a2WdVal = (w, obj) => {
    const n = a2Wd[w].days.size;
    const v = a2Pick(obj);
    return a2Mode === "avg" ? n ? v / n : 0 : v;
  };
  // 업체 목록 (선택 기준 내림차순) + 색상 (업체 색상 우선, 겹치면 팔레트에서 대체)
  const a2ChKeys = Object.keys(a2Ch).sort((a, b) => a2Pick(a2Ch[b]) - a2Pick(a2Ch[a]));
  const a2ChColor = {};
  {
    const used = new Set();
    a2ChKeys.forEach((k, i) => {
      const base = k.split(" · ")[0];
      let c = channels.find(x => x.name === base)?.color;
      if (!c || used.has(c)) c = COLORS.find(x => !used.has(x)) || COLORS[i % COLORS.length];
      used.add(c);
      a2ChColor[k] = c;
    });
  }
  const a2TotalQty = a2Rows.reduce((a, r) => a + (r.qty || 0), 0);
  const a2TotalUnit = Object.values(a2Ch).reduce((a, c) => a + c.unit, 0);
  const a2TotalPick = a2Metric === "unit" ? a2TotalUnit : a2TotalQty;
  const a2DateKeys = Object.keys(a2Date).sort();
  const a2ProdDays = a2DateKeys.length;
  const a2BestWd = [...A2_WD].filter(w => a2Wd[w].days.size > 0).sort((a, b) => a2Pick(a2Wd[b]) / a2Wd[b].days.size - a2Pick(a2Wd[a]) / a2Wd[a].days.size)[0];
  const a2NoBom = [...new Set(a2Rows.filter(r => !a2UnitsOf(r.p_code)).map(r => r.p_code))];
  // ══ 분석2 · 낱개 종류별 사용량 (완료 수량 × BOM 구성) ══
  const A2_GRAN = {
    week: "주별",
    month: "월별",
    quarter: "분기별"
  };
  const a2BucketOf = d => a2Gran === "week" ? salesWeekStart(d) : a2Gran === "month" ? d.slice(0, 7) : d.slice(0, 4) + "-Q" + (Math.floor((Number(d.slice(5, 7)) - 1) / 3) + 1);
  const a2BucketSpan = b => {
    if (a2Gran === "week") return [b, addDays(b, 6)];
    if (a2Gran === "month") {
      const y = +b.slice(0, 4),
        m = +b.slice(5, 7);
      return [b + "-01", new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10)];
    }
    const y = +b.slice(0, 4),
      q = +b.slice(6);
    const sm = (q - 1) * 3 + 1;
    return [y + "-" + String(sm).padStart(2, "0") + "-01", new Date(Date.UTC(y, sm + 2, 0)).toISOString().slice(0, 10)];
  };
  const a2BucketLbl = b => {
    const [st, en] = a2BucketSpan(b);
    const part = st < a2Range.from || en > a2Range.to;
    if (a2Gran === "week") return {
      label: b.slice(5).replace("-", "/"),
      sub: "~" + en.slice(5).replace("-", "/") + (part ? " *" : "")
    };
    if (a2Gran === "month") return {
      label: b.slice(2, 4) + "년 " + Number(b.slice(5, 7)) + "월",
      sub: part ? "일부 *" : ""
    };
    return {
      label: b.slice(2, 4) + "년 " + b.slice(6) + "분기",
      sub: part ? "일부 *" : ""
    };
  };
  // 기간 안의 모든 구간 (사용 0인 구간도 표시)
  const a2Buckets = (() => {
    const out = [];
    let d = a2Range.from,
      guard = 0;
    while (d <= a2Range.to && guard++ < 4000) {
      const b = a2BucketOf(d);
      if (out[out.length - 1] !== b) out.push(b);
      d = addDays(d, 1);
    }
    return out;
  })();
  const a2BomBy = {};
  bomData.forEach(b => {
    (a2BomBy[b.p_code] = a2BomBy[b.p_code] || []).push(b);
  });
  const a2S = {};
  a2Rows.forEach(r => {
    const d = (r.plan_date || "").slice(0, 10);
    if (!d) return;
    const bk = a2BucketOf(d),
      wk = salesWeekStart(d),
      ck = a2Key(r);
    (a2BomBy[r.p_code] || []).forEach(c => {
      const u = (r.qty || 0) * (c.qty || 0);
      if (!u) return;
      const S = a2S[c.s_code] || (a2S[c.s_code] = {
        code: c.s_code,
        total: 0,
        b: {},
        wk: {},
        prod: {},
        ch: {},
        days: new Set()
      });
      S.total += u;
      S.b[bk] = (S.b[bk] || 0) + u;
      S.wk[wk] = (S.wk[wk] || 0) + u;
      S.prod[r.p_code] = (S.prod[r.p_code] || 0) + u;
      S.ch[ck] = (S.ch[ck] || 0) + u;
      S.days.add(d);
    });
  });
  const a2SDays = daysBetween(a2Range.from, a2Range.to);
  const a2SKeys = Object.keys(a2S).sort((a, b) => a2S[b].total - a2S[a].total);
  const a2STotal = a2SKeys.reduce((a, k) => a + a2S[k].total, 0);
  const S_PALETTE = ["#5aa9e6", "#b06ad0", "#6fcf97", "#f2994a", "#eb5757", "#56ccf2", "#f2c94c", "#bb6bd9", "#27ae60", "#9b8579", "#4db6ac", "#e0a0c0", "#a0c060", "#c0a060"];
  const a2SColor = {};
  {
    const used = new Set();
    a2SKeys.forEach((k, i) => {
      let c = sColor(k);
      if (!c || used.has(c)) c = S_PALETTE.find(x => !used.has(x)) || S_PALETTE[i % S_PALETTE.length];
      used.add(c);
      a2SColor[k] = c;
    });
  }
  const a2SStock = code => stock.filter(x => x.s_code === code && !x.is_pending).reduce((a, x) => a + (x.qty || 0), 0);
  const a2SPend = code => stock.filter(x => x.s_code === code && x.is_pending).reduce((a, x) => a + (x.qty || 0), 0);
  const a2SStat = k => {
    const S = a2S[k];
    const wkVals = Object.values(S.wk);
    const wAvg = S.total / (a2SDays / 7),
      mAvg = S.total / (a2SDays / 30.44),
      qAvg = S.total / (a2SDays / 91.31);
    const st = a2SStock(k);
    const dAvg = S.total / (a2ProdDays || 1); // 생산일 기준 하루 평균 사용량
    return {
      wAvg,
      mAvg,
      qAvg,
      dAvg,
      maxWk: wkVals.length ? Math.max(...wkVals) : 0,
      stock: st,
      pend: a2SPend(k),
      cover: dAvg > 0 ? st / dAvg : null
    };
  };
  const a2STop = a2SKeys.slice(0, 10),
    a2SRest = a2SKeys.slice(10);
  const a2SChart = a2Buckets.map(b => ({
    ...a2BucketLbl(b),
    segs: [...a2STop.map(k => ({
      key: k,
      name: sName(k),
      value: a2S[k].b[b] || 0,
      color: a2SColor[k]
    })), ...(a2SRest.length ? [{
      key: "etc",
      name: "기타 " + a2SRest.length + "종",
      value: a2SRest.reduce((a, k) => a + (a2S[k].b[b] || 0), 0),
      color: "#5a6a5a"
    }] : [])]
  }));
  const a2SHeatMax = Math.max(1, ...a2SKeys.flatMap(k => a2Buckets.map(b => a2S[k].b[b] || 0)));
  const a2SSel = a2SelS && a2S[a2SelS] ? a2SelS : "";

  // 차트 데이터
  const a2WdChart = a2WdShow.map(w => ({
    label: WEEKDAY_KR[w],
    sub: a2Wd[w].days.size + "일",
    segs: [{
      key: "전체",
      name: "전체",
      value: a2WdVal(w, a2Wd[w]),
      color: a2Metric === "unit" ? "#4db6ac" : "#f5c97a"
    }]
  }));
  const a2WdChChart = a2WdShow.map(w => ({
    label: WEEKDAY_KR[w],
    sub: a2Wd[w].days.size + "일",
    segs: a2ChKeys.map(k => ({
      key: k,
      name: k,
      value: a2WdVal(w, a2Wd[w].ch[k]),
      color: a2ChColor[k]
    }))
  }));
  const a2DateChart = a2DateKeys.map(d => ({
    label: d.slice(5).replace("-", "/"),
    sub: WEEKDAY_KR[new Date(d + "T00:00:00Z").getUTCDay()],
    segs: a2ChKeys.map(k => ({
      key: k,
      name: k,
      value: a2Pick(a2Date[d].ch[k]),
      color: a2ChColor[k]
    }))
  }));
  // 업체×요일 히트맵 최대값
  const a2HeatMax = Math.max(1, ...a2ChKeys.flatMap(k => a2WdShow.map(w => a2WdVal(w, a2Ch[k].wd[w]))));
  // ── 업체별 추이 (세부탭) ──
  const a2DateLbl = d => ({
    label: d.slice(5).replace("-", "/"),
    sub: WEEKDAY_KR[new Date(d + "T00:00:00Z").getUTCDay()]
  });
  // 업체 하나의 일자별 막대 데이터 (x축은 전체 생산일로 맞춰서 업체끼리 비교 가능)
  const a2ChDateChart = k => a2DateKeys.map(d => ({
    ...a2DateLbl(d),
    segs: [{
      key: k,
      name: k,
      value: a2Pick(a2Date[d].ch[k]),
      color: a2ChColor[k]
    }]
  }));
  // 선택 업체의 제품별 생산 내역
  const a2SelValid = a2SelCh !== "__all__" && a2Ch[a2SelCh];
  const a2SelProd = (() => {
    if (!a2SelValid) return [];
    const m = {};
    a2Rows.forEach(r => {
      if (a2Key(r) !== a2SelCh) return;
      const q = r.qty || 0;
      if (!m[r.p_code]) m[r.p_code] = {
        code: r.p_code,
        qty: 0,
        unit: 0,
        days: new Set()
      };
      m[r.p_code].qty += q;
      m[r.p_code].unit += q * a2UnitsOf(r.p_code);
      m[r.p_code].days.add((r.plan_date || "").slice(0, 10));
    });
    return Object.values(m).sort((a, b) => a2Pick(b) - a2Pick(a));
  })();
  const a2SelWdChart = a2SelValid ? a2WdShow.map(w => {
    const C = a2Ch[a2SelCh].wd[w];
    const n = a2Wd[w].days.size;
    const v = a2Pick(C);
    return {
      label: WEEKDAY_KR[w],
      sub: n + "일",
      segs: [{
        key: a2SelCh,
        name: a2SelCh,
        value: a2Mode === "avg" ? n ? v / n : 0 : v,
        color: a2ChColor[a2SelCh]
      }]
    };
  }) : [];

  // 선택한 날짜의 낱개 포장량 근거 — 어떤 완제품을 몇 개 만들었고, 제품당 낱개가 몇 개 들어가는지
  const anaPackSelRows = anaPackSelDay ? anaRows.filter(r => (r.plan_date || "").slice(0, 10) === anaPackSelDay) : [];
  const anaPackSelMap = {};
  anaPackSelRows.forEach(r => {
    const k = r.p_code;
    if (!anaPackSelMap[k]) anaPackSelMap[k] = {
      qty: 0
    };
    anaPackSelMap[k].qty += r.qty || 0;
  });
  const anaPackSelDetail = Object.keys(anaPackSelMap).map(k => {
    const unitsPerProduct = bomOf(k).reduce((a, c) => a + (c.qty || 0), 0);
    return {
      code: k,
      label: pName(k),
      qty: anaPackSelMap[k].qty,
      unitsPerProduct,
      packQty: anaPackSelMap[k].qty * unitsPerProduct
    };
  }).sort((a, b) => b.packQty - a.packQty);
  const anaPackSelTotalQty = anaPackSelDetail.reduce((a, b) => a + b.qty, 0);
  const anaPackSelTotalPack = anaPackSelDetail.reduce((a, b) => a + b.packQty, 0);
  const anaPackSelWeekday = anaPackSelDay ? WEEKDAY_KR[new Date(anaPackSelDay + "T00:00:00Z").getUTCDay()] + "요일" : "";

  // 선택한 날짜(anaSelDay)의 가동률 근거 상세 — 어떤 제품을 몇 개, 몇 시간 생산했는지
  const anaSelRows = anaSelDay ? anaRows.filter(r => (r.plan_date || "").slice(0, 10) === anaSelDay) : [];
  const anaSelMap = {};
  anaSelRows.forEach(r => {
    const k = r.p_code;
    if (!anaSelMap[k]) anaSelMap[k] = {
      qty: 0,
      hours: 0
    };
    anaSelMap[k].qty += r.qty || 0;
    anaSelMap[k].hours += secToHour((r.qty || 0) * speedOf(k));
  });
  const anaSelDetail = Object.keys(anaSelMap).map(k => ({
    code: k,
    label: pName(k),
    speed: speedOf(k),
    qty: anaSelMap[k].qty,
    hours: anaSelMap[k].hours
  })).sort((a, b) => b.hours - a.hours);
  const anaSelTotalQty = anaSelDetail.reduce((a, b) => a + b.qty, 0);
  const anaSelTotalHours = anaSelDetail.reduce((a, b) => a + b.hours, 0);
  const anaSelDailyAvail = anaSelDay ? anaDailyAvailOf(anaSelDay) : null;
  const anaSelRate = anaSelDailyAvail ? anaSelTotalHours / anaSelDailyAvail * 100 : 0;
  const anaSelWeekday = anaSelDay ? WEEKDAY_KR[new Date(anaSelDay + "T00:00:00Z").getUTCDay()] + "요일" : "";

  // 업체별 집계
  // 업체별 집계 — 완제품 수량 + 낱개 기준 수량(완제품 × BOM 구성품 총 수량)
  const anaChannelMap = {};
  const anaChannelUnitMap = {};
  const anaChannelNoBom = {};
  anaRows.forEach(r => {
    const k = r.channel || "미입력";
    const unitsPerProduct = bomOf(r.p_code).reduce((a, c) => a + (c.qty || 0), 0);
    anaChannelMap[k] = (anaChannelMap[k] || 0) + (r.qty || 0);
    anaChannelUnitMap[k] = (anaChannelUnitMap[k] || 0) + (r.qty || 0) * unitsPerProduct;
    if (!unitsPerProduct && (r.qty || 0) > 0) anaChannelNoBom[k] = true;
  });
  const anaChannelUnitTotal = Object.values(anaChannelUnitMap).reduce((a, v) => a + v, 0);
  const anaChannelStats = Object.keys(anaChannelMap).map(k => {
    const ch = channels.find(c => c.name === k);
    const value = anaChannelMap[k],
      unit = anaChannelUnitMap[k] || 0;
    const rate = value / (anaTotalQty || 1) * 100,
      unitRate = unit / (anaChannelUnitTotal || 1) * 100;
    return {
      label: k,
      value,
      unit,
      rate,
      unitRate,
      diff: unitRate - rate,
      noBom: !!anaChannelNoBom[k],
      color: ch?.color || "#556655",
      color2: ch?.color2 || null
    };
  }).sort((a, b) => anaChSort === "unit" ? b.unit - a.unit : b.value - a.value);

  // ── 금일 가동률 계산 (오늘 plan_date 주문 기준) ──
  const tdStr = today();
  const tdOrders = orders.filter(o => (o.plan_date || "").slice(0, 10) === tdStr && !String(o.id).startsWith("temp_"));
  const tdHoursOf = o => secToHour((o.qty || 0) * speedOf(o.p_code));
  const tdDone = tdOrders.filter(o => o.status === "완료");
  const tdConfirmed = tdOrders.filter(o => o.status === "확정");
  const tdDoneH = tdDone.reduce((a, o) => a + tdHoursOf(o), 0);
  const tdConfH = tdConfirmed.reduce((a, o) => a + tdHoursOf(o), 0);
  const tdPlanH = tdOrders.reduce((a, o) => a + tdHoursOf(o), 0); // 대기+투입완료+확정+완료 전체
  const tdDoneQty = tdDone.reduce((a, o) => a + (o.qty || 0), 0);
  const tdPlanQty = tdOrders.reduce((a, o) => a + (o.qty || 0), 0);
  const tdDonePack = tdDone.reduce((a, o) => a + (o.qty || 0) * bomOf(o.p_code).reduce((s, c) => s + (c.qty || 0), 0), 0);
  const tdLineH = ln => tdDone.filter(o => (o.line || "A") === ln).reduce((a, o) => a + tdHoursOf(o), 0);
  const tdNoSpeed = [...new Set(tdOrders.filter(o => !speedOf(o.p_code)).map(o => o.p_code))];
  const tdAvail = todayNote && todayNote.workers != null && todayNote.hours != null ? Number(todayNote.workers) * Number(todayNote.hours) + (Number(todayNote.overtime) || 0) : null;
